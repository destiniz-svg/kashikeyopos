<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create your store — KashikeyoPOS</title>
<link rel="icon" href="/logo-mark.png" />
<style>
  :root {
    --app: #FBFAF7; --panel: #FFFFFF; --border: #E3DED4; --text: #26221C;
    --sub: #8A8378; --faint: #B8B0A3; --primary: #C7431D; --primary-hov: #A33417;
    --input: #FFFFFF; --btn: #F4F1EB; --btn-hov: #E8E1D2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 58%),
      radial-gradient(950px 520px at 108% 4%, color-mix(in srgb, var(--primary) 9%, transparent), transparent 55%),
      var(--app);
    background-attachment: fixed; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; padding: 32px 28px;
    background: color-mix(in srgb, var(--panel) 72%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid color-mix(in srgb, var(--border) 60%, transparent); border-radius: 20px;
    box-shadow: 0 1px 2px rgba(38,34,28,.05), 0 24px 56px rgba(38,34,28,.12);
  }
  .back { display: inline-block; margin-bottom: 16px; color: var(--sub); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--text); }
  .logo-img { display: block; height: 36px; width: auto; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing:-.01em; }
  p.sub { color: var(--sub); font-size: 14px; margin: 0 0 20px; line-height:1.45; }
  label { display: block; font-size: 12.5px; font-weight:600; color: var(--sub); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--input) 82%, transparent); color: var(--text); font-size: 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer;
    background: linear-gradient(180deg, color-mix(in srgb, var(--primary) 90%, #fff 10%), var(--primary)); color: #fff;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--primary) 32%, transparent);
  }
  button.primary:hover { filter:brightness(1.04); }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.linkbtn { background:none; border:none; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer; padding:0; }
  .error { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #FBEAE4; color: #A3391F; font-size: 13px; }
  .note { display:none; margin-top:12px; padding:9px 12px; border-radius:8px; background:#EEF6EE; color:#2C6E3A; font-size:12.5px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; line-height:1.4; }
  .terms { display:flex; align-items:flex-start; gap:8px; margin-top:16px; font-size:12.5px; color:var(--sub); }
  .terms input { width:auto; margin-top:2px; accent-color:var(--primary); }
  .terms a { color:var(--primary); text-decoration:none; }
  .foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--sub); }
  .foot a { color: var(--primary); text-decoration: none; font-weight: 600; }
  #oauthBox { display: none; flex-direction:column; gap: 10px; margin-bottom: 4px; }
  #googleBtn { display: flex; justify-content: center; } #googleBtn > div { width: 100% !important; }
  .oauth-btn { display: none; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; border-radius: 999px; border: 1px solid #000; background: #000; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .oauth-btn:hover { background: #1a1a1a; } .oauth-btn svg { width: 16px; height: 16px; flex: none; }
  .divider { display: none; align-items: center; gap: 10px; margin: 18px 0; color: var(--faint); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .otpbox input { text-align:center; font-size:24px; letter-spacing:.4em; font-weight:700; }
  .hide { display:none; }
</style>
</head>
<body>
  <div class="card">
    <a class="back" href="/">&larr; kashikeyopos.com</a>
    <img class="logo-img" src="/logo.png" alt="KashikeyoPOS" onerror="this.style.display='none'" />

    <!-- Social sign-up -->
    <div id="oauthBox">
      <div id="googleBtn"></div>
      <button type="button" id="appleBtn" class="oauth-btn">
        <svg viewBox="0 0 384 512" fill="#fff"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141 4 184.8 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 37.1 59 128 107.2 126.5 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-83.5 102.6-120.7-65.2-30.7-61.7-90-61.7-91.8zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.6-67.9 35.2-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.6z"/></svg>
        Continue with Apple
      </button>
    </div>
    <div class="divider" id="oauthDivider"><span>or sign up with email</span></div>

    <!-- Stage 1: email + password -->
    <form id="emailForm">
      <h1>Create your account</h1>
      <p class="sub">We'll email you a code to verify your address, then help you set up your store.</p>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@business.mv" />
      <div class="row">
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required /></div>
        <div><label for="password2">Confirm</label><input id="password2" type="password" autocomplete="new-password" minlength="8" required /></div>
      </div>
      <div class="hint">At least 8 characters.</div>
      <label class="terms"><input type="checkbox" id="terms" /> <span>I agree to the <a href="/terms" target="_blank">Terms</a> &amp; <a href="/privacy" target="_blank">Privacy Policy</a>.</span></label>
      <div class="error" id="err1"></div>
      <button class="primary" type="submit" id="sendBtn">Send verification code</button>
    </form>

    <!-- Stage 2: OTP verify -->
    <form id="otpForm" class="hide">
      <h1>Check your email 📩</h1>
      <p class="sub">We sent a 6-digit code to <b id="otpEmail"></b>. Enter it below.</p>
      <div class="note" id="devNote"></div>
      <div class="otpbox"><label for="code">Verification code</label><input id="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" /></div>
      <div class="error" id="err2"></div>
      <button class="primary" type="submit" id="verifyBtn">Verify &amp; continue</button>
      <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
        <button type="button" class="linkbtn" id="resend">Resend code</button>
        <button type="button" class="linkbtn" id="changeEmail" style="color:var(--sub)">Change email</button>
      </div>
    </form>

    <div class="foot">Already have a store? <a href="/login">Sign in</a></div>
  </div>
  <script src="/oauth.js"></script>
  <script>
  (function () {
    function $(id){ return document.getElementById(id); }
    function showErr(id,msg){ var e=$(id); e.textContent=msg; e.style.display="block"; }
    function hideErr(id){ $(id).style.display="none"; }
    var email = "", password = "";

    if (window.KashikeyoOAuth) window.KashikeyoOAuth.init({
      boxId: "oauthBox", googleId: "googleBtn", appleId: "appleBtn", dividerId: "oauthDivider",
      onError: function (msg) { showErr("err1", msg); },
    });

    $("emailForm").addEventListener("submit", function (e) {
      e.preventDefault(); hideErr("err1");
      email = $("email").value.trim().toLowerCase();
      password = $("password").value;
      if (!/.+@.+\..+/.test(email)) return showErr("err1", "Enter a valid email.");
      if (password.length < 8) return showErr("err1", "Password must be at least 8 characters.");
      if (password !== $("password2").value) return showErr("err1", "Passwords don't match.");
      if (!$("terms").checked) return showErr("err1", "Please accept the Terms & Privacy Policy.");
      var btn = $("sendBtn"); btn.disabled = true; btn.textContent = "Sending…";
      fetch("/api/signup/otp", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email: email, password: password }) })
        .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(x){
          btn.disabled = false; btn.textContent = "Send verification code";
          if (!x.ok) return showErr("err1", x.j.error || "Could not send a code.");
          $("otpEmail").textContent = email;
          $("emailForm").classList.add("hide"); $("otpForm").classList.remove("hide"); $("oauthBox").style.display="none"; $("oauthDivider").style.display="none";
          if (x.j.devCode) { $("devNote").textContent = "Dev mode (email not configured): your code is " + x.j.devCode; $("devNote").style.display="block"; $("code").value = x.j.devCode; }
          else if (x.j.configured === false) { $("devNote").textContent = "Email delivery isn't set up on this server yet — ask an admin to add an email key."; $("devNote").style.display="block"; }
          $("code").focus();
        })
        .catch(function(){ btn.disabled=false; btn.textContent="Send verification code"; showErr("err1","Network error — try again."); });
    });

    $("otpForm").addEventListener("submit", function (e) {
      e.preventDefault(); hideErr("err2");
      var code = $("code").value.trim();
      if (!/^\d{6}$/.test(code)) return showErr("err2", "Enter the 6-digit code.");
      var btn = $("verifyBtn"); btn.disabled = true; btn.textContent = "Verifying…";
      fetch("/api/signup/verify-otp", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email: email, password: password, code: code }) })
        .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(x){
          if (!x.ok) { btn.disabled=false; btn.textContent="Verify & continue"; return showErr("err2", x.j.error || "Incorrect code."); }
          try { localStorage.setItem("kashikeyo-cloud", JSON.stringify({ url:"", token:x.j.token, slug:x.j.slug, register:"R1" })); } catch(e){}
          location.href = x.j.next || "/welcome";
        })
        .catch(function(){ btn.disabled=false; btn.textContent="Verify & continue"; showErr("err2","Network error — try again."); });
    });

    $("resend").addEventListener("click", function(){
      hideErr("err2");
      fetch("/api/signup/otp", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ email: email, password: password }) })
        .then(function(r){ return r.json().catch(function(){return{};}).then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(x){ if(!x.ok) return showErr("err2", x.j.error||"Could not resend."); if(x.j.devCode){ $("devNote").textContent="Dev mode: your code is "+x.j.devCode; $("devNote").style.display="block"; $("code").value=x.j.devCode; } $("devNote").scrollIntoView&&0; });
    });
    $("changeEmail").addEventListener("click", function(){ $("otpForm").classList.add("hide"); $("emailForm").classList.remove("hide"); $("oauthBox").style.display="flex"; $("oauthDivider").style.display="flex"; });
  })();
  </script>
</body>
</html>
