name: tests

# `staging` is where all work lands first (CLAUDE.md → Deploy): it is the branch
# that gets verified and then fast-forwarded onto the live `main`. Running CI
# only on `main` meant the first cold-database run of any change happened AFTER
# it was already promoted to production — and a fix to this workflow could not
# be validated on the branch it was made on.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kash
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install EXACTLY what the runtime image installs. The Dockerfile copies
      # package-lock.json and runs `npm ci --omit=dev`, so `npm install` here
      # tested a dependency tree that could differ from the one that ships on
      # any transitive release — which is the whole thing `npm ci` was adopted
      # to prevent. `npm ci` also fails loudly if package.json and the lockfile
      # drift, instead of quietly resolving something else.
      - run: npm ci --omit=dev
      - run: npm test
