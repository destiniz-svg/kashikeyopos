<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up KashikeyoPOS</title>
<link rel="icon" href="brand/kashikeyo-mark.png">
<link rel="stylesheet" href="fonts.css">
<!-- The same tokens the terminal is painted from. An onboarding panel that
     looks like a different product is an onboarding panel nobody trusts with
     their TIN. -->
<link rel="stylesheet" href="kashikeyo.css">
<script>
/* Follow the reader's own setting. The terminal has a theme switcher of its
   own; a front door does not, and a phone set to dark at midnight should not
   be handed a white page. Inline and first, so there is no flash of the
   wrong one. */
(function () {
  try {
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    var set = function () {
      document.documentElement.setAttribute("data-theme", dark && dark.matches ? "dark" : "light");
    };
    set();
    if (dark && dark.addEventListener) dark.addEventListener("change", set);
  } catch (e) { /* the light default in the markup stands */ }
})();
</script>
<style>
/* ═══ THE PANEL ═════════════════════════════════════════════════════════════
   Fourteen steps, forced by dependency, each writing the records the running
   app reads — through the same handlers the app itself uses. There is no
   config blob and no wizard-only table: if step 2 wrote something only the
   wizard understood, step 2 would become un-editable the moment the wizard
   closed.

   Every step therefore has an equivalent edit path in Settings, and the target
   is a first correct, complete, auditable sale in under five minutes.

   Two shapes. On a desk the rail is a SPINE — where you are, what is behind
   you, what is left — and it stays put while the step scrolls. On a phone the
   rail is gone, so the same three facts move into a bar that sticks to the
   top, and the action sticks to the bottom. Somebody setting a restaurant up
   on their phone should never have to scroll to find out where they are or how
   to go on.
   ═══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
/* The shared stylesheet locks the document down for the TERMINAL, which is an
   app shell with its own internal scroll panes: html,body{height:100%;overflow:hidden}.
   This panel is not a shell — it is a long form, and on a phone it is taller
   than the viewport every single step. Inheriting that rule left the page
   unscrollable with "Save and continue" stranded below the fold, which is an
   install nobody can complete. Restore document scrolling explicitly. */
html,body{margin:0;padding:0;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
/* iOS: keep the last control clear of the home indicator. */
body{padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.mono{font-family:'JetBrains Mono',monospace}
/* minmax(0,1fr), not 1fr: a grid track defaults to min-width:auto and will
   refuse to shrink below its widest content. The step editors are TABLES, so
   the track grew to 819px inside a 390px phone, dragged the whole page
   sideways, and left .scroll's overflow-x:auto with nothing to do because its
   parent was already as wide as the table. */
.wrap{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100dvh}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} .rail{display:none} }

/* ── the rail: a spine, not a list ──────────────────────────────────────── */
.rail{background:var(--bg-0);border-right:1px solid var(--line);padding:22px 0 30px;
  position:sticky;top:0;align-self:start;max-height:100dvh;overflow-y:auto;
  scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:0 22px 18px}
.brand img{width:34px;height:34px;border-radius:11px;background:var(--brand-plate);
  border:1px solid var(--brand-plate-line);object-fit:contain;padding:2px}
.brand b{font-size:13.5px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand span{color:var(--brand-olive-bright)}
.brand small{display:block;font-size:9px;color:var(--text-muted);letter-spacing:.1em;
  text-transform:uppercase;margin-top:3px}
.railHead{padding:0 22px 12px;font-size:9.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--text-faint)}
.steps{display:flex;flex-direction:column;position:relative}
/* The spine itself: one line behind every node, so the fourteen read as a
   sequence rather than fourteen unrelated buttons. */
.steps:before{content:"";position:absolute;left:calc(22px + 12px);top:16px;bottom:16px;
  width:2px;background:var(--line);border-radius:2px}
.step{display:flex;align-items:flex-start;gap:13px;padding:9px 22px;border:0;width:100%;
  background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  position:relative;border-radius:0;transition:background .14s}
.step:hover:not(:disabled){background:var(--bg-2)}
.step:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.step[aria-current="true"]{background:var(--bg-2)}
.step[aria-current="true"]:after{content:"";position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.step .no{flex-shrink:0;width:26px;height:26px;border-radius:9px;display:grid;
  place-items:center;font-size:10px;font-weight:800;
  font-family:'JetBrains Mono',monospace;position:relative;z-index:1;
  background:var(--bg-1);color:var(--text-faint);border:2px solid var(--line);
  transition:background .16s,color .16s,border-color .16s}
.step.done .no{background:var(--go-dim);color:var(--go-bright);border-color:var(--go-line)}
.step[aria-current="true"] .no{background:var(--amber);color:var(--on-amber);
  border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-dim)}
.step .lab{min-width:0;flex:1;padding-top:2px}
.step .lab b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
.step .lab small{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;
  text-wrap:pretty;line-height:1.45}
.step.done .lab b{color:var(--text-muted)}
.step[aria-current="true"] .lab b{font-weight:700}

/* ── the phone's orientation, since the rail is not there ───────────────── */
.mobar{display:none}
@media (max-width:900px){
  .mobar{display:block;position:sticky;top:0;z-index:30;background:var(--bg-0);
    border-bottom:1px solid var(--line);padding:11px 18px 0}
  .mobar .mb{display:flex;align-items:center;gap:10px;min-width:0}
  .mobar img{width:26px;height:26px;border-radius:8px;background:var(--brand-plate);
    border:1px solid var(--brand-plate-line);object-fit:contain;padding:2px;flex-shrink:0}
  .mobar .mt{min-width:0;flex:1}
  .mobar .mt b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobar .mt small{display:block;font-size:10px;color:var(--text-muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobar .mn{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;
    font-weight:700;color:var(--text-dim);background:var(--bg-2);border:1px solid var(--line);
    border-radius:20px;padding:4px 10px}
  .mobar .mbar{height:3px;background:var(--bg-3);border-radius:3px;overflow:hidden;
    margin-top:10px}
  .mobar .mbar i{display:block;height:100%;background:var(--amber);transition:width .3s}
}

/* ── the stage ─────────────────────────────────────────────────────────── */
.stage{padding:clamp(26px,3.4vw,46px) clamp(18px,5vw,56px) 30px;max-width:920px;
  width:100%;min-width:0}
h1{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.042em;
  margin:0 0 8px;text-wrap:balance;line-height:1.1}
.sub{font-size:14px;color:var(--text-dim);margin:0 0 4px;max-width:64ch;text-wrap:pretty}
.why{font-size:12.5px;color:var(--text-muted);margin:14px 0 0;max-width:64ch;
  background:var(--bg-1);border:1px solid var(--line-soft);
  border-left:3px solid var(--amber);border-radius:0 10px 10px 0;
  padding:11px 14px;text-wrap:pretty;line-height:1.6}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:16px;
  padding:clamp(18px,2.4vw,26px);margin-top:24px;box-shadow:var(--shadow-lg);
  animation:step .3s cubic-bezier(.16,.84,.34,1) both}
@keyframes step{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-faint)}
label .req{color:var(--amber-bright);margin-left:3px}
input,select,textarea{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;
  padding:11px 13px;min-height:46px;color:var(--text);font:inherit;font-size:14px;
  width:100%;outline:none;transition:border-color .14s,background .14s,box-shadow .14s;
}
input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:.7}
input:hover,select:hover,textarea:hover{border-color:var(--line-3)}
input:focus,select:focus,textarea:focus{border-color:var(--amber);background:var(--bg-1);
  box-shadow:0 0 0 3px var(--amber-dim)}
input.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.hint{font-size:11px;color:var(--text-muted);text-wrap:pretty;line-height:1.5}
.err{font-size:12.5px;color:var(--danger-bright);margin-top:12px;font-weight:600;
  background:var(--bad-dim);border:1px solid var(--danger-line);border-radius:11px;
  padding:11px 13px;text-wrap:pretty}
.foot{font-size:11.5px;color:var(--text-muted);margin-top:20px;padding-top:16px;
  border-top:1px solid var(--line-soft);text-wrap:pretty;line-height:1.6}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.go{flex:0 0 auto;padding:13px 22px;min-height:48px;border-radius:12px;border:0;
  background:var(--amber);color:var(--on-amber);font-size:13.5px;font-weight:700;
  letter-spacing:-.01em;transition:transform .12s,filter .14s;
  box-shadow:0 1px 2px rgba(0,0,0,.16),0 8px 22px var(--amber-dim)}
button.go:hover:not(:disabled){filter:brightness(1.06)}
button.go:active:not(:disabled){transform:translateY(1px)}
button.go:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button.ghost{background:var(--bg-1);border:1px solid var(--line-2);color:var(--text-dim);
  padding:13px 17px;min-height:48px;border-radius:12px;font-size:12.5px;
  font-weight:600;transition:background .14s,border-color .14s}
button.ghost:hover{background:var(--bg-2);border-color:var(--line-3);color:var(--text)}
button.mini{background:var(--bg-2);border:1px solid var(--line-2);color:var(--text-dim);
  padding:8px 12px;min-height:38px;border-radius:9px;font-size:11.5px;
  font-weight:600;transition:background .14s,border-color .14s}
button.mini:hover{background:var(--bg-3);border-color:var(--line-3);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-faint);padding:0 8px 9px;white-space:nowrap}
td{padding:5px 8px;border-top:1px solid var(--line-soft);vertical-align:middle}
td input,td select{min-height:40px;padding:8px 10px;font-size:12.5px;border-radius:9px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.09em;padding:5px 11px;border-radius:20px;
  background:var(--bg-2);color:var(--text-dim);border:1px solid var(--line-2)}
.chip.ok{background:var(--ok-dim);color:var(--go-bright);border-color:var(--go-line)}
.chip.warn{background:var(--warn-dim);color:var(--warn-bright);border-color:var(--warn-line)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-top:1px solid var(--line-soft);font-size:12.5px}
.kv:first-child{border-top:0}
.kv b{font-weight:600;color:var(--text-dim)}
.kv span{font-family:'JetBrains Mono',monospace;color:var(--text);text-align:right}
.bar{height:3px;background:var(--bg-3);border-radius:3px;overflow:hidden;margin-top:22px}
.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--bg-1);border:1px solid var(--line-2);border-radius:12px;
  padding:13px 19px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:ktoast .2s;max-width:calc(100vw - 32px)}
.toast.err{border-color:var(--danger-line);color:var(--danger-bright)}
/* Thumbs, not mice. In-table controls were 36–38px, which is under the floor
   every other surface in this build holds itself to. */
@media (max-width:900px){
  td input,td select{min-height:44px;font-size:13px}
  /* min-WIDTH too: the row-delete control is a single glyph, so padding alone
     left it 34px across — tall enough and still too small to hit. */
  button.mini{min-height:40px;min-width:40px;padding:9px 13px}
  .stage{padding-top:22px;padding-bottom:148px}
  /* The action never scrolls out of reach. On a phone this is the difference
     between an install somebody finishes and one they abandon halfway down a
     fourteen-row table — and the fourteen-row table is step 11. */
  .row{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:8px;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--bg-1);border-top:1px solid var(--line-2);
    box-shadow:0 -12px 34px var(--scrim)}
  .row button.go{flex:1 1 100%}
  .row button.ghost{flex:1 1 auto;padding:12px 14px}
  /* "Editable afterwards: Settings → Company" is orientation, not an action.
     It belongs on the page, not in a bar a thumb is aiming at. */
  .row .hint{display:none}
  /* Clear of the action bar. A toast that lands under the button somebody is
     about to press is a toast nobody reads. */
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<!-- On a phone the rail is not there, so where-am-I moves up here and sticks. -->
<div class="mobar" id="mobar">
  <div class="mb">
    <img src="brand/kashikeyo-mark.png" alt="">
    <div class="mt"><b id="moTitle">Setting up</b><small id="moSub">KashikeyoPOS</small></div>
    <span class="mn" id="moNo">1 / 14</span>
  </div>
  <div class="mbar"><i id="moBar" style="width:0%"></i></div>
</div>
<div class="wrap">
  <aside class="rail">
    <div class="brand">
      <img src="brand/kashikeyo-mark.png" alt="">
      <div>
        <b>Kashikeyo<span>POS</span></b>
        <small>Restaurant platform</small>
      </div>
    </div>
    <div class="railHead">Setting up</div>
    <div class="steps" id="steps"></div>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<script>
(function () {
  "use strict";

  /* ── the fourteen, forced by dependency ───────────────────────────────────
     Each `write` posts to the SAME handler the running app uses, so the
     wizard's output and the app's model cannot drift. `edit` names where the
     step lives once the app is running — that is the promise this panel makes,
     and it is the reason none of these steps writes a config blob. */
  var STEPS = [
    {
      key: "company", n: 1, label: "Company",
      sub: "The entity that files the return",
      title: "Who is trading?",
      lede: "This is the legal entity — the name on the return, its registration number, its registered address and who to reach. It is not the name over the door: your outlets are named on the next step, and one business may have several. The fascia a guest sees is set per outlet, under branding.",
      why: "A receipt carries the TIN of the entity that took the money, so it is asked for only if you have one. A business below the GST threshold has none, and inventing one here would be a false statement to a tax authority — which is also why nothing is pre-filled.",
      edit: "Settings → Company",
      fields: [
        { k: "legalName", label: "Registered legal name", req: true, full: true, ph: "e.g. Kashikeyo Group Pvt Ltd" },
        { k: "regNo", label: "Company registration number", req: true, mono: true, ph: "C-0000/2026" },
        { k: "gstRegistered", label: "GST registration", type: "select", req: true, full: true,
          v: "no",
          options: [
            ["no", "Not registered for GST"],
            ["yes", "Registered for GST"]
          ],
          hint: "In the Maldives a business registers once taxable supplies pass MVR 1,000,000 in any 12 months — the tourism sector registers whatever the turnover. Below that, you charge nothing and no tax line prints at all. The app measures your own turnover against the threshold and tells you when this answer has to change." },
        { k: "tin", label: "TIN", mono: true, ph: "1000000GST501",
          showIf: { k: "gstRegistered", is: "yes" },
          hint: "What MIRA issued you. It prints on every receipt." },
        { k: "address", label: "Registered address", req: true, full: true },
        { k: "atoll", label: "Atoll or city" },
        { k: "currency", label: "Base currency", type: "select", req: true, v: "MVR",
          options: [["MVR", "MVR — Maldivian rufiyaa"], ["USD", "USD — US dollar"]],
          hint: "The currency this business keeps its books in. Every price, receipt, report and ledger figure is in it. A guest may still pay in another currency at the counter." },
        { k: "phone", label: "Telephone" },
        { k: "email", label: "Accounts email", type: "email" }
      ],
      foot: "Saving writes chain.company. Every receipt, invoice and tax return reads it back from there rather than keeping its own copy, so a correction lands everywhere at once.",
      write: function (v) { return post("company", v); }
    },
    {
      key: "outlet", n: 2, label: "First outlet",
      sub: "Its own schema and its own login role",
      title: "The first place you trade from",
      lede: "An outlet sits under the business you named on step 1 — one business, one or many outlets, and this is the first. Give it the name a guest would recognise on the door; the company's registered name stays on step 1 and prints on the tax line. An outlet is not a filter on shared data: it gets its own Postgres schema and its own database login, granted access to that schema alone — another outlet's tables are unreachable, not merely hidden.",
      why: "Tax class is per outlet, not per company: GGST for a general outlet, TGST for one in a tourism zone. Whether there is a rate at all was answered on step 1 — a business below the threshold charges nothing rather than quietly assuming 8%.",
      edit: "Chain & Outlets → the outlet",
      fields: [
        { k: "name", label: "Outlet name", req: true, full: true, ph: "e.g. Chaandhanee",
          hint: "The store, not the company. It is what the fascia says, what a docket is headed with, and what you pick between when the business has more than one." },
        { k: "code", label: "Short code", req: true, mono: true, ph: "KOCHA", hint: "Goes in front of every document number. Letters and digits, up to eight." },
        { k: "slug", label: "Store address", type: "handle", from: "name", full: true,
          ph: "chaandhanee",
          hint: "Where your guests scan to. This is printed on the table cards, so it is worth getting right — lower case letters, numbers and hyphens." },
        { k: "kind", label: "What it is", type: "select", options: [
          ["restaurant", "Restaurant — takes money"],
          ["central_kitchen", "Central kitchen — produces, does not sell"],
          ["main_store", "Main store — receives and dispatches"]
        ] },
        { k: "taxCode", label: "Tax class", type: "select",
          /* Which rate, once the COMPANY is registered. Whether there is a rate
             at all was answered on step 1, and offering "not registered" again
             here invites two answers to one question. Deferred, because STEPS
             is built before anybody has answered anything. */
          options: function () {
            return state.gstRegistered()
              ? [["GGST", "GGST — general goods and services"],
                ["TGST", "TGST — tourism sector"]]
              : [["NONE", "Not registered for GST"]];
          },
          hint: function () {
            return state.gstRegistered()
              ? "TGST if this outlet is in a tourism zone; GGST otherwise."
              : "This business is not registered for GST, so this outlet charges nothing. Change it on step 1 if that is wrong.";
          } },
        { k: "servicePct", label: "Service charge %", type: "number", v: "10",
          hint: "Charged on the goods, distributed to staff, and itself taxable." },
        { k: "dayStart", label: "Trading day starts", type: "time", v: "04:00",
          hint: "The trading day is not the calendar day: a sale at 01:30 belongs to last night." },
        { k: "address", label: "Street address", full: true },
        { k: "phone", label: "Telephone" }
      ],
      foot: "Saving creates the schema, the login role, the document series and the chart of accounts, records the tax version in force from today, and reserves the store address for good.",
      write: function (v) {
        v.servicePct = Number(v.servicePct) || 0;
        return post("outlet", v);
      }
    },
    {
      key: "owner", n: 3, label: "Owner account",
      sub: "Rank 5 — the only account that can create others",
      title: "Your own account",
      lede: "One five-rank ladder runs the whole system: Kitchen 1, Till 2, Manager 3, Admin 4, Owner 5. This is the rank-5 account, and it is the only one that can create the others.",
      why: "A shared till never asks for a password. Staff tap their own face and key four digits — that is what makes a void, a discount or a drawer opening attributable to a person. Your PIN is hashed with scrypt and a per-row salt the moment you set it, and is never displayed again.",
      edit: "Chain & Outlets → Users & roles",
      fields: [
        { k: "name", label: "Your name", req: true, full: true },
        { k: "pin", label: "Choose a PIN", req: true, mono: true, type: "password",
          attrs: { inputmode: "numeric", maxlength: "8", autocomplete: "new-password" },
          hint: "Four to eight digits. Five wrong attempts lock this terminal for fifteen minutes." },
        { k: "pin2", label: "Repeat the PIN", req: true, mono: true, type: "password",
          attrs: { inputmode: "numeric", maxlength: "8", autocomplete: "new-password" } }
      ],
      foot: "This account can be claimed exactly once in the life of an installation. After that, accounts are created from Users & roles by an admin, and never above their own rank.",
      validate: function (v) {
        if (!/^\d{4,8}$/.test(v.pin)) return "A PIN is four to eight digits.";
        if (v.pin !== v.pin2) return "The two PINs do not match.";
        if (/^(\d)\1+$/.test(v.pin)) return "That PIN is one repeated digit — pick something a colleague could not watch you type.";
        return null;
      },
      write: function (v) {
        return post("owner", { name: v.name, pin: v.pin }).then(function (r) {
          state.token = r.token;
          try { localStorage.setItem("kashikeyo.token", JSON.stringify({

  /* ── state ────────────────────────────────────────────────────────────── */
  var state = {
    token: null, at: 0, done: {}, outlet: null, install: null,
    vals: {},
    /* Did the business say it is registered? Read from what step 1 saved where
       it exists, and from what is on screen before it is saved — so steps 2 and
       4 reshape themselves the moment the answer changes, rather than a step
       later. */
    gstRegistered: function () {
      var typed = (state.vals && state.vals.company) || null;
      if (typed && typed.gstRegistered !== undefined) return typed.gstRegistered === "yes";
      if (state.gst !== undefined) return !!state.gst;
      var o = state.outlet || {};
      return !!o.tax_code && o.tax_code !== "NONE";
    },
    statutory: function (code) {
      var rows = (state.install && state.install.tax) || [];
      var hit = rows.filter(function (r) { return r.code === code; })[0];
      return hit ? hit.rate : (code === "TGST" ? 16 : code === "NONE" ? 0 : 8);
    }
  };

  function today() { return new Date().toISOString().slice(0, 10); }
  function slug(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "").slice(0, 40) || ("x" + Date.now().toString(36));
  }
  // How many base units are in one stock unit. The one conversion in the app,
  // and it lives in one place.
  function factorFor(base, stock) {
    if (!stock || base === stock) return 1;
    var map = { "g:kg": 1000, "ml:l": 1000, "pcs:doz": 12 };
    return map[base + ":" + stock] || 1;
  }

  /* Read once, from the address, because a link from Settings or from the
     seller's own email is where a second business would be named. */
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("business");
      if (q && /^\d+$/.test(q)) state.businessId = Number(q);
    } catch (e) { /* no URLSearchParams is no query to read */ }
  }());

  function api(method, path, body) {
    var headers = { "content-type": "application/json" };
    if (state.token) headers.authorization = "Bearer " + state.token;
    // The account that signed up on the website is who this business will
    // belong to. Carried on every step, because the company is recorded on
    // step 1 and the outlet ownership on step 3.
    try {
      var at = localStorage.getItem("kashikeyo.account.token");
      if (at) headers["x-account-token"] = at;
    } catch (e) { /* private mode: the install is simply unattributed */ }
    // The setup code, where this install was provisioned with one. It proves
    // the person claiming the install is the person the seller gave it to —
    // sessionStorage rather than local, because it is spent on this sitting
    // and a code left on a shared counter terminal is a code lying around.
    if (state.claim) headers["x-claim-token"] = state.claim;
    /* WHICH BUSINESS, for the account that owns more than one. Silent for the
       ordinary customer who owns exactly one; for a group that has signed up a
       second company, this is what stops fourteen steps of setup landing in
       whichever database happened to be created last. Read once from the
       address, because that is where a link from Settings or an email would
       carry it. */
    if (state.businessId) headers["x-business-id"] = String(state.businessId);
    return fetch(path, {
      method: method, headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) {}
        if (!res.ok) {
          var err = new Error((data && data.error) || ("HTTP " + res.status));
          // A refused CLAIM is not an ordinary validation error: the answer is
          // a different code, not a different company name. It is flagged so
          // the screen can ask again instead of printing a sentence under a
          // field the code was never in.
          if (data && data.claim) err.claim = true;
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }
  function post(step, body) { return api("POST", "/api/onboarding/" + step, body); }

  var toastTimer = null;
  function toast(msg, tone) {
    var el = document.querySelector(".toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.className = "toast" + (tone === "err" ? " err" : "");
    el.textContent = msg;
    el.setAttribute("role", "status");
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 4200);
  }

  /* ── where are we? The server decides, from the records. ──────────────── */
  function refresh() {
    return api("GET", "/api/onboarding/state").then(function (r) {
      state.done = {};
      (r.steps || []).forEach(function (s) { state.done[s.key] = s.done; });
      state.next = r.next;
      state.counts = r.counts || {};
      state.gst = r.gstRegistered;
      state.claimWanted = !!r.claimRequired;
      state.business = r.business || "";
      state.businessId = r.businessId || state.businessId || null;
      state.businesses = r.businesses || [];
      return api("GET", "/api/auth/install");
    }).then(function (i) {
      state.install = i;
      state.outlet = (i.outlets || [])[0] || null;
      if (!state.token) {
        try {
          var t = JSON.parse(localStorage.getItem("kashikeyo.token") || "null");
          if (t && t.exp > Date.now()) state.token = t.token;
        } catch (e) {}
      }
    });
  }

  /* ── defaults: what a step opens with ─────────────────────────────────── */
  function defaults(step) {
    var v = {};
    (fieldsOf(step) || []).forEach(function (f) {
      // A select shows its first option whether or not anyone has touched it,
      // so that is what it is worth. Leaving it blank makes the screen say one
      // thing and the request say another.
      if (f.v !== undefined) { v[f.k] = f.v; return; }
      v[f.k] = f.type === "select" ? ((f.options || [])[0] || [""])[0] : "";
    });
    /* ASKED ONCE. The business name was typed on the account form, before
       anybody had been asked for a registration number, so it is a working
       title rather than the registered one — and it is the registry's name
       for this customer, not the outlet's, which step 2 asks for on its own.
       Offering it here is a prefill and nothing more: whatever is saved on
       this step is the registered name, and the registry adopts it. */
    if (step.key === "company" && state.business) v.legalName = state.business;
    if (step.key === "series") {
      v.series = [
        { kind: "SALE", prefix: pfx("R"), start: 1 },
        { kind: "CN", prefix: pfx("CN"), start: 1 },
        { kind: "PO", prefix: pfx("PO"), start: 1 },
        { kind: "GRN", prefix: pfx("GRN"), start: 1 },
        { kind: "PR", prefix: pfx("PR"), start: 1 },
        { kind: "DSP", prefix: pfx("DSP"), start: 1 },
        { kind: "JV", prefix: pfx("JV"), start: 1 }
      ];
    }
    if (step.key === "units") {
      v.units = [
        { code: "g", name: "gram", base: "g", factor: 1 },
        { code: "kg", name: "kilogram", base: "g", factor: 1000 },
        { code: "ml", name: "millilitre", base: "ml", factor: 1 },
        { code: "l", name: "litre", base: "ml", factor: 1000 },
        { code: "pcs", name: "piece", base: "pcs", factor: 1 },
        { code: "doz", name: "dozen", base: "pcs", factor: 12 }
      ];
    }
    if (step.key === "locations") {
      v.locations = [
        { name: "Kitchen", kind: "kitchen" },
        { name: "Dry store", kind: "store" },
        { name: "Freezer", kind: "freezer" }
      ];
    }
    if (step.key === "items") v.items = [blank(step), blank(step), blank(step)];
    if (step.key === "menu") v.dishes = [blank(step), blank(step)];
    if (step.key === "floor") {
      v.tables = [];
      for (var i = 1; i <= 6; i++) {
        v.tables.push({ label: "T" + (i < 10 ? "0" : "") + i, zone: "Main floor", seats: i % 3 === 0 ? 4 : 2 });
      }
    }
    if (step.key === "staff") v.staff = [blank(step), blank(step)];
    return v;
  }
  function pfx(suffix) {
    return ((state.outlet && state.outlet.code) || "DOC") + "-" + suffix;
  }
  function blank(step) {
    var row = {};
    (step.table ? step.table.cols : []).forEach(function (c) {
      row[c.k] = c.type === "recipe" ? [] : (typeof c.options === "object" && c.options.length ? c.options[0][0] : "");
    });
    return row;
  }
  /* A step's WORDS can depend on the answers too, not only its fields. The tax
     step told an unregistered business "Confirm the rate you charge" over a
     callout asserting that GST prints as its own line — the exact claim this
     whole option exists to stop a business making. */
  function viewOf(step) {
    var d = step.dynamic ? step.dynamic() : null;
    return d ? Object.assign({}, step, d) : step;
  }

  function fieldsOf(step) {
    var fields = step.dynamic ? step.dynamic().fields : step.fields;
    /* A field may defer any of its own properties to render time by giving a
       function instead of a value. STEPS is built before `state` exists — it is
       a literal at the top of this file — so anything that depends on what the
       business ANSWERED cannot be evaluated where it is written. Without this,
       one conditional option list forces the whole step to be rewritten as a
       dynamic() that duplicates its other nine fields. */
    return (fields || []).map(function (f) {
      var live = null;
      Object.keys(f).forEach(function (k) {
        if (typeof f[k] === "function" && k !== "showIf") {
          live = live || Object.assign({}, f);
          live[k] = f[k]();
        }
      });
      return live || f;
    });
  }

  /* ── render ───────────────────────────────────────────────────────────── */
  var current = 0;

  function renderRail() {
    var el = document.getElementById("steps");
    el.innerHTML = "";
    STEPS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "step" + (state.done[s.key] ? " done" : "");
      b.setAttribute("aria-current", i === current ? "true" : "false");
      b.type = "button";
      var reachable = i === 0 || state.done[STEPS[i - 1].key] || state.done[s.key];
      b.disabled = !reachable;
      b.style.opacity = reachable ? "1" : ".42";
      b.innerHTML = '<span class="no">' + (state.done[s.key] ? "✓" : s.n) + '</span>'
        + '<span class="lab"><b></b><small></small></span>';
      b.querySelector("b").textContent = s.label;
      b.querySelector("small").textContent = s.sub;
      b.addEventListener("click", function () { if (reachable) { current = i; render(); } });
      el.appendChild(b);
    });
  }

  function render() {
    renderRail();
    var step = STEPS[current];
    var v = state.vals[step.key] || (state.vals[step.key] = defaults(step));
    var stage = document.getElementById("stage");
    stage.innerHTML = "";

    var doneN = STEPS.filter(function (s) { return state.done[s.key]; }).length;

    var view = viewOf(step);
    var h = el("div");
    h.appendChild(el("div", { class: "chip" + (state.done[step.key] ? " ok" : "") },
      state.done[step.key] ? "Step " + step.n + " of 14 · done" : "Step " + step.n + " of 14"));
    /* WHICH BUSINESS THIS IS SETTING UP, but only where there is a choice to
       get wrong. An account owns exactly one in the ordinary case, and naming
       it on every screen is noise; an account that owns two is fourteen steps
       away from finding out from the company name on a receipt which one it
       just configured. */
    if ((state.businesses || []).length > 1 && state.business) {
      var which = el("div", { class: "chip" }, "Setting up " + state.business);
      which.style.marginTop = "8px";
      h.appendChild(which);
    }
    var title = el("h1", {}, view.title);
    title.style.marginTop = "12px";
    h.appendChild(title);
    h.appendChild(el("p", { class: "sub" }, view.lede));
    if (view.why) h.appendChild(el("p", { class: "why" }, view.why));
    var bar = el("div", { class: "bar" });
    bar.appendChild(el("i", { style: "width:" + Math.round((doneN / 14) * 100) + "%" }));
    h.appendChild(bar);
    stage.appendChild(h);

    var card = el("div", { class: "card" });
    if (step.table) card.appendChild(renderTable(step, v));
    else card.appendChild(renderFields(step, v));
    if (step.key === "chart") card.appendChild(renderChartSummary());
    card.appendChild(el("div", { class: "foot" }, view.foot));
    stage.appendChild(card);

    var err = el("div", { class: "err" });
    err.style.display = "none";
    stage.appendChild(err);

    var row = el("div", { class: "row" });
    var save = el("button", { class: "go", type: "button" },
      state.done[step.key] ? "Saved · continue" : (step.n === 14 ? "Open the register and start" : "Save and continue"));
    save.addEventListener("click", function () { commit(step, v, save, err); });
    row.appendChild(save);

    if (current > 0) {
      var back = el("button", { class: "ghost", type: "button" }, "Back");
      back.addEventListener("click", function () { current--; render(); });
      row.appendChild(back);
    }
    if (state.done[step.key] && current < STEPS.length - 1) {
      var skip = el("button", { class: "ghost", type: "button" }, "Skip — already done");
      skip.addEventListener("click", function () { current++; render(); });
      row.appendChild(skip);
    }
    var where = el("span", { class: "hint" }, "Editable afterwards: " + step.edit);
    where.style.marginLeft = "auto";
    row.appendChild(where);
    stage.appendChild(row);

    // The rail is hidden on a phone, so the same three facts — which step,
    // how far in, how much is left — live in the bar at the top instead.
    document.getElementById("moTitle").textContent = step.label;
    document.getElementById("moSub").textContent = step.sub;
    document.getElementById("moNo").textContent = step.n + " / 14";
    document.getElementById("moBar").style.width =
      Math.round((doneN / 14) * 100) + "%";

    window.scrollTo(0, 0);
  }

  /* A store address is the one field on this panel whose answer is not the
     business's to decide alone — somebody else may already hold it. So it is
     checked against the same function the database will use when the step is
     saved (chain.handle_why), and it shows the whole address rather than the
     label, because a subdomain read on its own does not look like a place you
     can go. A field that shows a green tick and then refuses on save is worse
     than one that never checked. */
  function wireHandle(wrap, input, f, v, inputs) {
    var note = el("div", { class: "hint" }, "");
    note.style.marginTop = "2px";
    // Directly under the box, above the explanation. Feedback on what was just
    // typed belongs next to it, not below a paragraph about the rules.
    input.insertAdjacentElement("afterend", note);
    var timer = null, seq = 0, typed = false;
    input.addEventListener("input", function () { typed = true; });

    function paint(tone, text) {
      note.textContent = text;
      note.style.color = tone === "ok" ? "var(--go-bright)"
        : tone === "bad" ? "var(--danger-bright)" : "var(--text-muted)";
    }

    function ask() {
      var mine = ++seq;
      var q = "?h=" + encodeURIComponent(input.value || "")
        + "&from=" + encodeURIComponent(v[f.from] || "");
      api("GET", "/api/onboarding/handle" + q).then(function (r) {
        if (mine !== seq) return;                 // a later keystroke won
        // Nothing typed yet: offer the business's own name as the address,
        // filled in rather than described, so it can be corrected in place.
        if (!typed && !input.value && r.suggested) {
          input.value = r.suggested;
          v[f.k] = r.suggested;
          return ask();
        }
        if (!input.value) return paint("", "");
        if (r.free) return paint("ok", "https://" + input.value
          + (r.base ? "." + r.base : "") + " is free");
        paint("bad", r.why || "that address cannot be used");
      }).catch(function () {
        // The check is a courtesy; the database is the authority. Say that
        // rather than block a business behind a failed fetch.
        if (mine === seq) paint("", "Could not check that address just now — saving will tell you.");
      });
    }

    input.addEventListener("input", function () {
      clearTimeout(timer); timer = setTimeout(ask, 350);
    });
    // Typing the business's name is how somebody tells us what to suggest. The
    // suggestion has to arrive THEN, not on a second visit to this step —
    // which is the only place it used to appear.
    var src = inputs && inputs[f.from];
    if (src) {
      src.addEventListener("input", function () {
        if (typed || input.value) return;    // theirs to change, not ours
        clearTimeout(timer); timer = setTimeout(ask, 400);
      });
    }
    ask();
  }

  function renderFields(step, v) {
    var grid = el("div", { class: "grid" });
    var inputs = {}, derived = [], conditional = [];
    (fieldsOf(step) || []).forEach(function (f) {
      var wrap = el("div", { class: "f" + (f.full ? " full" : "") });
      var lab = el("label", {}, f.label);
      if (f.req) lab.appendChild(el("span", { class: "req" }, "*"));
      wrap.appendChild(lab);
      var input;
      if (f.type === "select") {
        input = el("select");
        (f.options || []).forEach(function (o) {
          var opt = el("option", { value: o[0] }, o[1]);
          input.appendChild(opt);
        });
        input.value = v[f.k] || (f.options[0] || [])[0] || "";
      } else {
        input = el("input", { type: f.type || "text" });
        if (f.mono) input.className = "mono";
        if (f.ph) input.placeholder = f.ph;
        if (f.ro) { input.readOnly = true; input.style.opacity = ".6"; }
        Object.keys(f.attrs || {}).forEach(function (a) { input.setAttribute(a, f.attrs[a]); });
        input.value = v[f.k] === undefined ? "" : v[f.k];
      }
      input.addEventListener("input", function () { v[f.k] = input.value; });
      input.addEventListener("change", function () { v[f.k] = input.value; });
      wrap.appendChild(input);
      inputs[f.k] = input;
      if (f.type === "handle") derived.push({ wrap: wrap, input: input, f: f });
      if (f.showIf) conditional.push({ wrap: wrap, input: input, f: f });
      if (f.hint) wrap.appendChild(el("div", { class: "hint" }, f.hint));
      grid.appendChild(wrap);
    });

    /* A field that only applies given another field's answer. Asking a business
       below the GST threshold for a TIN is asking it to invent a tax number,
       and the field going away is the clearest way to say it does not apply. */
    conditional.forEach(function (c) {
      var src = inputs[c.f.showIf.k];
      var apply = function () {
        var on = src && String(src.value) === String(c.f.showIf.is);
        c.wrap.style.display = on ? "" : "none";
        // A hidden field must not also be a submitted one.
        if (!on) { c.input.value = ""; v[c.f.k] = ""; }
      };
      if (src) { src.addEventListener("change", apply); src.addEventListener("input", apply); }
      apply();
    });
    // Wired after the loop, not inside it: a field that derives from another
    // one has to be able to find it, and the one it derives from may not have
    // been built yet when its own turn came round.
    derived.forEach(function (d) { wireHandle(d.wrap, d.input, d.f, v, inputs); });
    return grid;
  }

  function renderTable(step, v) {
    var key = step.table.rows;
    var rows = v[key] || (v[key] = []);
    var box = el("div");
    var scroll = el("div", { class: "scroll" });
    var t = el("table");
    var thead = el("thead"), tr = el("tr");
    step.table.cols.forEach(function (c) { tr.appendChild(el("th", {}, c.label)); });
    if (step.table.add) tr.appendChild(el("th", {}, ""));
    thead.appendChild(tr); t.appendChild(thead);
    var tb = el("tbody");
    rows.forEach(function (r, i) {
      var line = el("tr");
      step.table.cols.forEach(function (c) {
        var td = el("td");
        td.style.minWidth = c.w === "2.4fr" ? "300px" : "110px";
        if (c.type === "recipe") td.appendChild(recipeCell(r));
        else if (c.type === "select") {
          var sel = el("select");
          optionsFor(c).forEach(function (o) { sel.appendChild(el("option", { value: o[0] }, o[1])); });
          sel.value = r[c.k] || "";
          sel.addEventListener("change", function () { r[c.k] = sel.value; });
          td.appendChild(sel);
        } else {
          var inp = el("input", { type: c.type || "text" });
          if (c.mono) inp.className = "mono";
          if (c.ro) { inp.readOnly = true; inp.style.opacity = ".6"; }
          Object.keys(c.attrs || {}).forEach(function (a) { inp.setAttribute(a, c.attrs[a]); });
          inp.value = r[c.k] === undefined ? "" : r[c.k];
          inp.addEventListener("input", function () { r[c.k] = inp.value; });
          td.appendChild(inp);
        }
        line.appendChild(td);
      });
      if (step.table.add) {
        var td2 = el("td");
        td2.style.minWidth = "0";
        var del = el("button", { class: "mini", type: "button", title: "Remove this row" }, "✕");
        del.addEventListener("click", function () { rows.splice(i, 1); render(); });
        td2.appendChild(del);
        line.appendChild(td2);
      }
      tb.appendChild(line);
    });
    t.appendChild(tb);
    scroll.appendChild(t);
    box.appendChild(scroll);
    if (step.table.add) {
      var add = el("button", { class: "mini", type: "button" }, "+ Add a row");
      add.style.marginTop = "12px";
      add.addEventListener("click", function () { rows.push(blank(step)); render(); });
      box.appendChild(add);
    }
    if (!rows.length) {
      box.appendChild(el("div", { class: "hint", style: "padding:14px 4px" },
        "Nothing here yet — add a row, or carry on and add them from the app later."));
    }
    return box;
  }

  function optionsFor(c) {
    if (c.options === "locations") {
      var locs = (state.vals.locations && state.vals.locations.locations) || [];
      var out = locs.filter(function (l) { return l.name; })
        .map(function (l) { return [slug(l.name), l.name]; });
      return out.length ? out : [["", "—"]];
    }
    return c.options || [];
  }

  // A recipe on one line: what goes into the dish, and how much.
  function recipeCell(row) {
    var box = el("div");
    row.recipe = row.recipe || [];
    var items = (state.vals.items && state.vals.items.items) || [];
    var choices = items.filter(function (i) { return i.name; });
    if (!choices.length) {
      return el("div", { class: "hint" }, "Add ingredients in step 9 first");
    }
    row.recipe.forEach(function (line, i) {
      var l = el("div");
      l.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:5px";
      var sel = el("select");
      sel.style.flex = "1 1 auto";
      choices.forEach(function (c) { sel.appendChild(el("option", { value: slug(c.name) }, c.name)); });
      sel.value = line.ing || slug(choices[0].name);
      line.ing = sel.value;
      sel.addEventListener("change", function () { line.ing = sel.value; });
      var qty = el("input", { type: "number", class: "mono" });
      qty.style.cssText = "width:88px;flex:0 0 auto";
      qty.placeholder = "qty";
      qty.value = line.qty || "";
      qty.addEventListener("input", function () { line.qty = qty.value; });
      var unit = el("span", { class: "hint" },
        (choices.filter(function (c) { return slug(c.name) === line.ing; })[0] || {}).base || "");
      var del = el("button", { class: "mini", type: "button" }, "✕");
      del.addEventListener("click", function () { row.recipe.splice(i, 1); render(); });
      l.appendChild(sel); l.appendChild(qty); l.appendChild(unit); l.appendChild(del);
      box.appendChild(l);
    });
    var add = el("button", { class: "mini", type: "button" }, "+ ingredient");
    add.addEventListener("click", function () {
      row.recipe.push({ ing: slug(choices[0].name), qty: "" });
      render();
    });
    box.appendChild(add);
    return box;
  }

  function renderChartSummary() {
    var box = el("div");
    box.style.marginTop = "18px";
    var rows = [
      ["Accounts shipped", "35"],
      ["Owned by the till, refused to a manual journal", "9"],
      ["Expense accounts on the P&L", "17"],
      ["Document series created", "7"]
    ];
    rows.forEach(function (r) {
      var kv = el("div", { class: "kv" });
      kv.appendChild(el("b", {}, r[0]));
      kv.appendChild(el("span", {}, r[1]));
      box.appendChild(kv);
    });
    return box;
  }

  /* ── save ─────────────────────────────────────────────────────────────── */
  function commit(step, v, button, errEl) {
    errEl.style.display = "none";
    var missing = (fieldsOf(step) || []).filter(function (f) {
      return f.req && !String(v[f.k] || "").trim();
    });
    if (missing.length) {
      errEl.textContent = missing.length === 1
        ? missing[0].label + " is required."
        : "These are required: " + missing.map(function (f) { return f.label; }).join(", ") + ".";
      errEl.style.display = "block";
      return;
    }
    if (step.validate) {
      var msg = step.validate(v);
      if (msg) { errEl.textContent = msg; errEl.style.display = "block"; return; }
    }

    // Already done and unchanged: move on rather than writing twice.
    if (state.done[step.key] && !step.rewritable) {
      advance();
      return;
    }

    button.disabled = true;
    var was = button.textContent;
    button.textContent = "Saving…";
    Promise.resolve(step.write(v)).then(function () {
      return refresh();
    }).then(function () {
      button.disabled = false;
      button.textContent = was;
      toast(step.label + " saved");
      advance();
    }).catch(function (e) {
      button.disabled = false;
      button.textContent = was;
      if (e.claim) {
        // The code was wrong, or this install grew one since the page loaded.
        // Forget it and ask again in the code's own words — leaving a bad code
        // in place would refuse every subsequent step for the same reason.
        state.claim = "";
        try { sessionStorage.removeItem("kashikeyo.claim"); } catch (x) {}
        askClaim(e.message);
        return;
      }
      errEl.textContent = e.message;
      errEl.style.display = "block";
      toast(e.message, "err");
    });
  }

  function advance() {
    if (current < STEPS.length - 1) { current++; render(); return; }
    // Fourteen of fourteen. Stamp it and hand over to the floor.
    api("POST", "/api/onboarding/finish", {}).catch(function () {}).then(function () {
      toast("Set up — opening the floor");
      setTimeout(function () { location.href = "/"; }, 700);
    });
  }

  /* ── the setup code ───────────────────────────────────────────────────────
     An install provisioned by a seller is CLAIMED before it is configured, and
     the claim is a code handed over with the address. It is asked once, up
     front, rather than added as a field on step 1: it is not a fact about the
     company, it is permission to create one — and putting it beside the legal
     name would invite somebody to invent it the way they might invent a TIN.

     There is nothing to remember and nothing to get wrong: one field, one
     button, and the server's own words when it refuses. */
  function askClaim(why) {
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    stage.appendChild(el("div", { class: "chip" }, "Before you begin"));
    var t = el("h1", {}, "This install has a setup code");
    t.style.marginTop = "12px";
    stage.appendChild(t);
    stage.appendChild(el("p", { class: "sub" },
      why || "It was given to you with your store's address. It proves this "
        + "install is yours to set up."));

    var card = el("div", { class: "card" });
    var lab = el("label", { for: "claimcode" }, "Setup code");
    card.appendChild(lab);
    var inp = el("input", {
      id: "claimcode", type: "text", autocomplete: "off",
      spellcheck: "false", placeholder: "Paste the code"
    });
    card.appendChild(inp);
    card.appendChild(el("div", { class: "foot" },
      "Lost it? Whoever set the store up can read it back — it is not "
      + "recoverable from this screen, by design."));
    stage.appendChild(card);

    var err = el("div", { class: "err" });
    err.style.display = "none";
    stage.appendChild(err);

    var go = el("button", { class: "go" }, "Continue");
    go.onclick = function () {
      var v = inp.value.trim();
      if (!v) { err.textContent = "Type the code you were given."; err.style.display = ""; return; }
      // Checked HERE, not on the first save. Letting somebody past the gate on
      // an unchecked code and refusing them three fields later is the same
      // defect as a green tick on a store handle that is then taken.
      go.disabled = true;
      var was = go.textContent;
      go.textContent = "Checking…";
      state.claim = v;
      api("POST", "/api/onboarding/claim", {}).then(function () {
        try { sessionStorage.setItem("kashikeyo.claim", v); } catch (e) {}
        begin();
      }).catch(function (e) {
        state.claim = "";
        go.disabled = false;
        go.textContent = was;
        err.textContent = e.message;
        err.style.display = "";
        inp.select();
      });
    };
    inp.onkeydown = function (e) { if (e.key === "Enter") go.click(); };
    stage.appendChild(go);
    inp.focus();
  }

  /* ── boot ─────────────────────────────────────────────────────────────── */
  function begin() {
    return refresh().then(function () {
      if (state.claimWanted && !state.claim) return askClaim();
      // Land on the first step that is not done, not on step 1 every time.
      var i = STEPS.findIndex(function (s) { return !state.done[s.key]; });
      current = i < 0 ? 0 : i;
      if (i < 0) { location.href = "/"; return; }
      render();
    });
  }

  try { state.claim = sessionStorage.getItem("kashikeyo.claim") || ""; } catch (e) {}
  begin().catch(function (e) {
    document.getElementById("stage").innerHTML = "";
    var stage = document.getElementById("stage");
    stage.appendChild(el("h1", {}, "The server is not answering"));
    stage.appendChild(el("p", { class: "sub" },
      "Set-up needs the database to be reachable. " + e.message));
  });

  /* One element helper, so the markup above reads as markup. Text is set with
     textContent, never innerHTML: a company name is user input and belongs in
     a text node. */
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text !== undefined) n.textContent = text;
    return n;
  }
})();
</script>
</body>
</html>
