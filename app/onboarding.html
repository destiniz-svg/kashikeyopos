<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set up KashikeyoPOS</title>
<link rel="icon" href="brand/kashikeyo-mark.png">
<link rel="stylesheet" href="fonts.css">
<!-- The same tokens the terminal is painted from. An onboarding panel that
     looks like a different product is an onboarding panel nobody trusts with
     their TIN. -->
<link rel="stylesheet" href="kashikeyo.css">
<script>
/* Follow the reader's own setting. The terminal has a theme switcher of its
   own; a front door does not, and a phone set to dark at midnight should not
   be handed a white page. Inline and first, so there is no flash of the
   wrong one. */
(function () {
  try {
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    var set = function () {
      document.documentElement.setAttribute("data-theme", dark && dark.matches ? "dark" : "light");
    };
    set();
    if (dark && dark.addEventListener) dark.addEventListener("change", set);
  } catch (e) { /* the light default in the markup stands */ }
})();
</script>
<style>
/* ═══ THE PANEL ═════════════════════════════════════════════════════════════
   Thirteen steps, forced by dependency, each writing the records the running
   app reads — through the same handlers the app itself uses. There is no
   config blob and no wizard-only table: if step 2 wrote something only the
   wizard understood, step 2 would become un-editable the moment the wizard
   closed.

   Every step therefore has an equivalent edit path in Settings, and the target
   is a first correct, complete, auditable sale in under five minutes.

   Two shapes. On a desk the rail is a SPINE — where you are, what is behind
   you, what is left — and it stays put while the step scrolls. On a phone the
   rail is gone, so the same three facts move into a bar that sticks to the
   top, and the action sticks to the bottom. Somebody setting a restaurant up
   on their phone should never have to scroll to find out where they are or how
   to go on.
   ═══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
/* The shared stylesheet locks the document down for the TERMINAL, which is an
   app shell with its own internal scroll panes: html,body{height:100%;overflow:hidden}.
   This panel is not a shell — it is a long form, and on a phone it is taller
   than the viewport every single step. Inheriting that rule left the page
   unscrollable with "Save and continue" stranded below the fold, which is an
   install nobody can complete. Restore document scrolling explicitly. */
html,body{margin:0;padding:0;height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
/* iOS: keep the last control clear of the home indicator. */
body{padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.mono{font-family:'JetBrains Mono',monospace}
/* minmax(0,1fr), not 1fr: a grid track defaults to min-width:auto and will
   refuse to shrink below its widest content. The step editors are TABLES, so
   the track grew to 819px inside a 390px phone, dragged the whole page
   sideways, and left .scroll's overflow-x:auto with nothing to do because its
   parent was already as wide as the table. */
.wrap{display:grid;grid-template-columns:296px minmax(0,1fr);min-height:100dvh}
@media (max-width:900px){ .wrap{grid-template-columns:minmax(0,1fr)} .rail{display:none} }

/* ── the rail: a spine, not a list ──────────────────────────────────────── */
.rail{background:var(--bg-0);border-right:1px solid var(--line);padding:22px 0 30px;
  position:sticky;top:0;align-self:start;max-height:100dvh;overflow-y:auto;
  scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:0 22px 18px}
.brand img{width:34px;height:34px;border-radius:11px;background:var(--brand-plate);
  border:1px solid var(--brand-plate-line);object-fit:contain;padding:2px}
.brand b{font-size:13.5px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand span{color:var(--brand-olive-bright)}
.brand small{display:block;font-size:9px;color:var(--text-muted);letter-spacing:.1em;
  text-transform:uppercase;margin-top:3px}
.railHead{padding:0 22px 12px;font-size:9.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--text-faint)}
.steps{display:flex;flex-direction:column;position:relative}
/* The spine itself: one line behind every node, so the steps read as a
   sequence rather than as unrelated buttons. */
.steps:before{content:"";position:absolute;left:calc(22px + 12px);top:16px;bottom:16px;
  width:2px;background:var(--line);border-radius:2px}
.step{display:flex;align-items:flex-start;gap:13px;padding:9px 22px;border:0;width:100%;
  background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  position:relative;border-radius:0;transition:background .14s}
.step:hover:not(:disabled){background:var(--bg-2)}
.step:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.step[aria-current="true"]{background:var(--bg-2)}
.step[aria-current="true"]:after{content:"";position:absolute;left:0;top:6px;bottom:6px;
  width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.step .no{flex-shrink:0;width:26px;height:26px;border-radius:9px;display:grid;
  place-items:center;font-size:10px;font-weight:800;
  font-family:'JetBrains Mono',monospace;position:relative;z-index:1;
  background:var(--bg-1);color:var(--text-faint);border:2px solid var(--line);
  transition:background .16s,color .16s,border-color .16s}
.step.done .no{background:var(--go-dim);color:var(--go-bright);border-color:var(--go-line)}
.step[aria-current="true"] .no{background:var(--amber);color:var(--on-amber);
  border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-dim)}
.step .lab{min-width:0;flex:1;padding-top:2px}
.step .lab b{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
.step .lab small{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px;
  text-wrap:pretty;line-height:1.45}
.step.done .lab b{color:var(--text-muted)}
.step[aria-current="true"] .lab b{font-weight:700}

/* ── the phone's orientation, since the rail is not there ───────────────── */
.mobar{display:none}
@media (max-width:900px){
  .mobar{display:block;position:sticky;top:0;z-index:30;background:var(--bg-0);
    border-bottom:1px solid var(--line);padding:11px 18px 0}
  .mobar .mb{display:flex;align-items:center;gap:10px;min-width:0}
  .mobar img{width:26px;height:26px;border-radius:8px;background:var(--brand-plate);
    border:1px solid var(--brand-plate-line);object-fit:contain;padding:2px;flex-shrink:0}
  .mobar .mt{min-width:0;flex:1}
  .mobar .mt b{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobar .mt small{display:block;font-size:10px;color:var(--text-muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobar .mn{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11px;
    font-weight:700;color:var(--text-dim);background:var(--bg-2);border:1px solid var(--line);
    border-radius:20px;padding:4px 10px}
  .mobar .mbar{height:3px;background:var(--bg-3);border-radius:3px;overflow:hidden;
    margin-top:10px}
  .mobar .mbar i{display:block;height:100%;background:var(--amber);transition:width .3s}
}

/* ── the stage ─────────────────────────────────────────────────────────── */
.stage{padding:clamp(26px,3.4vw,46px) clamp(18px,5vw,56px) 30px;max-width:920px;
  width:100%;min-width:0}
h1{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.042em;
  margin:0 0 8px;text-wrap:balance;line-height:1.1}
.sub{font-size:14px;color:var(--text-dim);margin:0 0 4px;max-width:64ch;text-wrap:pretty}
.why{font-size:12.5px;color:var(--text-muted);margin:14px 0 0;max-width:64ch;
  background:var(--bg-1);border:1px solid var(--line-soft);
  border-left:3px solid var(--amber);border-radius:0 10px 10px 0;
  padding:11px 14px;text-wrap:pretty;line-height:1.6}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:16px;
  padding:clamp(18px,2.4vw,26px);margin-top:24px;box-shadow:var(--shadow-lg);
  animation:step .3s cubic-bezier(.16,.84,.34,1) both}
@keyframes step{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-faint)}
label .req{color:var(--amber-bright);margin-left:3px}
input,select,textarea{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;
  padding:11px 13px;min-height:46px;color:var(--text);font:inherit;font-size:14px;
  width:100%;outline:none;transition:border-color .14s,background .14s,box-shadow .14s;
}
input::placeholder,textarea::placeholder{color:var(--text-faint);opacity:.7}
input:hover,select:hover,textarea:hover{border-color:var(--line-3)}
input:focus,select:focus,textarea:focus{border-color:var(--amber);background:var(--bg-1);
  box-shadow:0 0 0 3px var(--amber-dim)}
input.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.hint{font-size:11px;color:var(--text-muted);text-wrap:pretty;line-height:1.5}
.err{font-size:12.5px;color:var(--danger-bright);margin-top:12px;font-weight:600;
  background:var(--bad-dim);border:1px solid var(--danger-line);border-radius:11px;
  padding:11px 13px;text-wrap:pretty}
.foot{font-size:11.5px;color:var(--text-muted);margin-top:20px;padding-top:16px;
  border-top:1px solid var(--line-soft);text-wrap:pretty;line-height:1.6}
/* ── the menu choice: two ways to start, one decision ───────────────────── */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;
  margin-bottom:18px}
.pick button{display:block;text-align:left;background:var(--bg-2);
  border:2px solid var(--line-2);border-radius:14px;padding:15px 16px;color:inherit;
  transition:border-color .14s,background .14s}
.pick button:hover{border-color:var(--line-3)}
.pick button[aria-pressed="true"]{border-color:var(--amber);background:var(--bg-1);
  box-shadow:0 0 0 3px var(--amber-dim)}
.pick b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.pick small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:5px;
  line-height:1.5;text-wrap:pretty}
.pick .mark{float:right;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--amber-bright)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.go{flex:0 0 auto;padding:13px 22px;min-height:48px;border-radius:12px;border:0;
  background:var(--amber);color:var(--on-amber);font-size:13.5px;font-weight:700;
  letter-spacing:-.01em;transition:transform .12s,filter .14s;
  box-shadow:0 1px 2px rgba(0,0,0,.16),0 8px 22px var(--amber-dim)}
button.go:hover:not(:disabled){filter:brightness(1.06)}
button.go:active:not(:disabled){transform:translateY(1px)}
button.go:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
button.ghost{background:var(--bg-1);border:1px solid var(--line-2);color:var(--text-dim);
  padding:13px 17px;min-height:48px;border-radius:12px;font-size:12.5px;
  font-weight:600;transition:background .14s,border-color .14s}
button.ghost:hover{background:var(--bg-2);border-color:var(--line-3);color:var(--text)}
button.mini{background:var(--bg-2);border:1px solid var(--line-2);color:var(--text-dim);
  padding:8px 12px;min-height:38px;border-radius:9px;font-size:11.5px;
  font-weight:600;transition:background .14s,border-color .14s}
button.mini:hover{background:var(--bg-3);border-color:var(--line-3);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-faint);padding:0 8px 9px;white-space:nowrap}
td{padding:5px 8px;border-top:1px solid var(--line-soft);vertical-align:middle}
td input,td select{min-height:40px;padding:8px 10px;font-size:12.5px;border-radius:9px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.09em;padding:5px 11px;border-radius:20px;
  background:var(--bg-2);color:var(--text-dim);border:1px solid var(--line-2)}
.chip.ok{background:var(--ok-dim);color:var(--go-bright);border-color:var(--go-line)}
.chip.warn{background:var(--warn-dim);color:var(--warn-bright);border-color:var(--warn-line)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-top:1px solid var(--line-soft);font-size:12.5px}
.kv:first-child{border-top:0}
.kv b{font-weight:600;color:var(--text-dim)}
.kv span{font-family:'JetBrains Mono',monospace;color:var(--text);text-align:right}
.bar{height:3px;background:var(--bg-3);border-radius:3px;overflow:hidden;margin-top:22px}
.bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--bg-1);border:1px solid var(--line-2);border-radius:12px;
  padding:13px 19px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:ktoast .2s;max-width:calc(100vw - 32px)}
.toast.err{border-color:var(--danger-line);color:var(--danger-bright)}
/* Thumbs, not mice. In-table controls were 36–38px, which is under the floor
   every other surface in this build holds itself to. */
@media (max-width:900px){
  td input,td select{min-height:44px;font-size:13px}
  /* min-WIDTH too: the row-delete control is a single glyph, so padding alone
     left it 34px across — tall enough and still too small to hit. */
  button.mini{min-height:40px;min-width:40px;padding:9px 13px}
  .stage{padding-top:22px;padding-bottom:148px}
  /* The action never scrolls out of reach. On a phone this is the difference
     between an install somebody finishes and one they abandon halfway down a
     long table — and the longest of them is the floor plan. */
  .row{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;gap:8px;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--bg-1);border-top:1px solid var(--line-2);
    box-shadow:0 -12px 34px var(--scrim)}
  .row button.go{flex:1 1 100%}
  .row button.ghost{flex:1 1 auto;padding:12px 14px}
  /* "Editable afterwards: Settings → Company" is orientation, not an action.
     It belongs on the page, not in a bar a thumb is aiming at. */
  .row .hint{display:none}
  /* Clear of the action bar. A toast that lands under the button somebody is
     about to press is a toast nobody reads. */
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* ── the pill stepper: three nodes, and every state is a fact ───────────── */
.pills{display:flex;align-items:center;gap:0;margin:0 0 20px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:9px;background:transparent;border:0;
  padding:4px 2px;color:var(--text-faint);min-height:44px;flex:0 0 auto}
.pill:disabled{cursor:not-allowed}
.pill .pd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;font-family:'JetBrains Mono',monospace;
  background:var(--bg-2);color:var(--text-faint);border:1.5px solid var(--line-2);
  transition:background .16s,color .16s,border-color .16s;flex:0 0 auto}
.pill .pl{font-size:11.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill.done .pd{background:var(--go-dim);color:var(--go-bright);border-color:var(--go-line)}
.pill.done .pl{color:var(--text-muted)}
.pill.now .pd{background:var(--text);color:var(--bg-0);border-color:var(--text)}
.pill.now .pl{color:var(--text)}
.pline{flex:1 1 22px;min-width:22px;height:2px;border-radius:2px;background:var(--line-2);
  margin:0 10px}
.pline.done{background:var(--go-line)}
/* On a phone three labelled pills do not fit, and a stepper whose last node is
   cut off at the edge is a stepper that has stopped saying how many there are.
   The dots always fit; only the node you are on needs naming, and the bar at
   the top carries the count. */
@media (max-width:560px){
  .pill .pl{display:none}
  .pill.now .pl{display:block}
  /* A PILL IS A CONTROL, AND HIDING ITS LABEL SHRANK THE TARGET. With the
     label gone the button is its 30px dot plus 2px of padding either side —
     34px, under the 44px this build states everywhere else and under the 36px
     the responsive test measures. The dot stays the same size; the button
     around it gets the room, which is what a thumb actually hits. Found by
     `test/responsive.test.js` on the one screen a new customer signs up on. */
  .pill{min-width:44px;justify-content:center}
  .pill.now{justify-content:flex-start}
  .pline{margin:0 7px;min-width:14px}
}

/* ── a toggle is a question with two written answers ────────────────────── */
.tog{display:flex;align-items:center;gap:14px;background:var(--bg-2);
  border:1px solid var(--line-2);border-radius:12px;padding:13px 15px}
.tog .tt{min-width:0;flex:1}
.tog .tt b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em;
  color:var(--text);text-wrap:pretty}
.tog .tt small{display:block;font-size:11px;color:var(--text-muted);margin-top:2px}
/* THE TRACK IS 30px AND THE BUTTON IS 44. The switch used to BE its track, so
   the whole control was 52 × 30 — under the 44px this build states for a tap
   target everywhere else, on a toggle a customer taps while signing up. The
   track is drawn by ::before now and the button is only the hit area around
   it, so nothing about the switch looks different and a thumb gets the room. */
.sw{flex:0 0 auto;width:52px;height:44px;min-height:44px;border:0;background:transparent;
  padding:0;position:relative;border-radius:22px}
.sw::before{content:"";position:absolute;left:0;top:7px;width:52px;height:30px;
  border-radius:20px;border:1.5px solid var(--line-3);background:var(--bg-3);
  transition:background .16s,border-color .16s}
.sw i{position:absolute;top:10px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--text-muted);transition:transform .16s,background .16s;display:block}
.sw.on::before{background:var(--go);border-color:var(--go)}
.sw.on i{transform:translateX(22px);background:var(--on-go)}
.sw:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── the logo, and what became of the file that was picked ──────────────── */
.logo{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.lp{width:78px;height:78px;border-radius:14px;flex:0 0 auto;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line-2);display:grid;place-items:center;
  overflow:hidden;transition:border-color .14s}
.lp:hover{border-color:var(--line-3)}
.lp.empty{border-style:dashed}
.lp.empty:after{content:"Logo";font-size:9.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--text-faint)}
.lp img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ls{min-width:150px;flex:1 1 auto;display:flex;flex-direction:column;gap:8px}
.la{display:flex;gap:8px;flex-wrap:wrap}
button.mini.ghosty{background:transparent}

/* ── what is about to be submitted ──────────────────────────────────────── */
.sum{margin-top:22px;background:var(--bg-2);border:1px solid var(--line-2);
  border-radius:13px;padding:16px 17px}
.sumh{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:6px}
.sum .kv{border-top-color:var(--line)}
.sum .hint{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
/* The spine runs the whole height of .steps, so a heading sitting on it
   needs its own ground or the line strikes the words through. */
.railHead.sub{padding-top:16px;background:var(--bg-0);position:relative;z-index:1}
.legal{margin-top:18px;font-size:11px;color:var(--text-muted);line-height:1.6;
  max-width:64ch;text-wrap:pretty}
.legal a{color:var(--text-dim);text-decoration:underline;text-underline-offset:2px}
.legal a:hover{color:var(--text)}
.pill .pd svg{width:15px;height:15px;display:block}
.steps .railHead.sub:first-child{padding-top:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
/* The application's last act is a submission, and it reads as one. Green is
   the FILL role here, the same one the terminal uses for a confirmed act. */
button.go.ok{background:var(--go);color:var(--on-go);
  box-shadow:0 1px 2px rgba(0,0,0,.16),0 8px 22px var(--go-dim)}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<!-- On a phone the rail is not there, so where-am-I moves up here and sticks. -->
<div class="mobar" id="mobar">
  <div class="mb">
    <img src="brand/kashikeyo-mark.png" alt="">
    <div class="mt"><b id="moTitle">Setting up</b><small id="moSub">KashikeyoPOS</small></div>
    <span class="mn" id="moNo">1</span>
  </div>
  <div class="mbar"><i id="moBar" style="width:0%"></i></div>
</div>
<div class="wrap">
  <aside class="rail">
    <div class="brand">
      <img src="brand/kashikeyo-mark.png" alt="">
      <div>
        <b>Kashikeyo<span>POS</span></b>
        <small>Restaurant platform</small>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </aside>
  <main class="stage" id="stage"></main>
</div>

<script>
(function () {
  "use strict";

  /* ── the steps, forced by dependency ──────────────────────────────────────
     Each `write` posts to the SAME handler the running app uses, so the
     panel's output and the app's model cannot drift. `edit` names where the
     step lives once the app is running — that is the promise this panel makes,
     and it is the reason none of these steps writes a config blob.

     ONE FACT IS ASKED ONCE. Three things used to be asked twice, and each was
     invisible from the step that asked second:

       · the ADDRESS, the PHONE and the EMAIL, on the company and again on the
         outlet — and a single-outlet business trades at its registered address
         on its registered number, so the honest default is "the same", said
         once and shown rather than typed again;
       · the TAX CLASS, on the outlet and again on a step of its own;
       · the RATE and the SERVICE CHARGE, likewise — `servicePct` appeared on
         both, literally the same field under the same label.

     The tax step is gone, and it was never doing anything: provisionOutlet()
     writes chain.tax_version from the outlet step's own taxCode, taxRate and
     taxFrom, so the server already reported the tax step done before anybody
     reached it. A step that opens on "Saved · continue" is a step asking a
     question it has already been given the answer to.

     The first three are the APPLICATION — the company, the store, the person —
     and they are the three that must be written before an install can do
     anything at all. Everything after them is the shop being set up, and the
     till nudges through it on its own Today list. */
  var STEPS = [
    {
      key: "company", label: "Business", eyebrow: "Step 1",
      sub: "The entity that files the return",
      title: "Business information",
      lede: "Tell us about your business. This is the legal entity — the name on the return, its registration number and its registered address. It is not the name over the door: your outlets are named on the next step, and one business may have several.",
      why: "A receipt carries the TIN of the entity that took the money, so it is asked for only if you have one. A business below the GST threshold has none, and inventing one here would be a false statement to a tax authority — which is also why nothing is pre-filled.",
      edit: "Settings → Company",
      fields: [
        { k: "logo", label: "Logo", type: "logo", full: true,
          hint: "PNG or JPG, up to 2 MB. It is scaled down on this device before it is sent — a four-megapixel photograph of a signboard costs every terminal its storage budget. Prints on the receipt and heads the guest's menu." },
        { k: "legalName", label: "Business name", req: true, full: true, ph: "Your registered legal name" },
        { k: "bizType", label: "Business type", type: "select", req: true,
          options: [
            ["restaurant", "Restaurant"], ["cafe", "Café or teashop"],
            ["hotel", "Hotel or resort"], ["guesthouse", "Guesthouse"],
            ["bakery", "Bakery"], ["takeaway", "Takeaway and delivery"],
            ["catering", "Catering"], ["retail", "Retail shop"], ["other", "Something else"]
          ] },
        { k: "regNo", label: "Registration number", req: true, mono: true, ph: "C-0000/2026" },
        { k: "gstRegistered", label: "GST registered", type: "toggle", full: true,
          v: "no", on: "yes", off: "no",
          onLabel: "This is a taxable business",
          offLabel: "Not registered for GST",
          pressOn: "Press if this business is registered for GST",
          pressOff: "Press if it is not registered",
          hint: "In the Maldives a business registers once taxable supplies pass MVR 1,000,000 in any 12 months — the tourism sector registers whatever the turnover. Below that you charge nothing and no tax line prints at all. The app keeps measuring your own turnover against the threshold and tells you when this answer has to change." },
        { k: "tin", label: "TIN", mono: true, ph: "1000000GST501", full: true,
          showIf: { k: "gstRegistered", is: "yes" },
          hint: "What MIRA issued you. It prints on every receipt." },
        { k: "address", label: "Address", req: true, full: true, type: "textarea",
          ph: "Full registered address" },
        { k: "atoll", label: "Atoll or city" },
        { k: "zip", label: "Postal code", mono: true, ph: "20000" },
        { k: "phone", label: "Telephone", ph: "+960 ..." },
        { k: "mobile", label: "Mobile", ph: "+960 7..." },
        { k: "email", label: "Email", type: "email", req: true, ph: "business@example.com",
          hint: "Where receipts, statements and anything the app sends come from and go to." },
        { k: "website", label: "Website", ph: "https://..." },
        { k: "currency", label: "Base currency", type: "select", req: true, v: "MVR",
          options: [["MVR", "MVR — Maldivian rufiyaa"], ["USD", "USD — US dollar"]],
          hint: "The currency this business keeps its books in. Every price, receipt, report and ledger figure is in it. A guest may still pay in another currency at the counter." }
      ],
      foot: "Saving writes chain.company. Every receipt, invoice and tax return reads it back from there rather than keeping its own copy, so a correction lands everywhere at once.",
      write: function (v) {
        return post("company", {
          legalName: v.legalName, regNo: v.regNo, gstRegistered: v.gstRegistered,
          tin: v.tin, address: v.address, atoll: v.atoll, phone: v.phone,
          email: v.email, currency: v.currency,
          /* The five that are presentation, not predicates — nothing joins on
             a website. chain.company.brand has carried exactly this since the
             schema was written. */
          brand: { logo: v.logo || "", type: v.bizType || "", website: v.website || "",
            zip: v.zip || "", mobile: v.mobile || "" }
        });
      }
    },
    {
      key: "outlet", label: "Outlet", eyebrow: "Step 2",
      sub: "Its own schema and its own login role",
      title: "Outlet information",
      lede: "Details about your first outlet. An outlet sits under the business you named on step 1 — one business, one or many outlets, and this is the first. Give it the name a guest would recognise on the door. An outlet is not a filter on shared data: it gets its own Postgres schema and its own database login, granted access to that schema alone.",
      why: "Tax class is per outlet, not per company: GGST for a general outlet, TGST for one in a tourism zone. Whether there is a rate at all was answered on step 1 — a business below the threshold charges nothing rather than quietly assuming 8%.",
      edit: "Chain & Outlets → the outlet",
      fields: [
        { k: "logo", label: "Logo", type: "logo", full: true,
          hint: function () {
            return "Leave it empty and this outlet uses the business logo. Set one only where the store trades under its own mark.";
          } },
        { k: "name", label: "Outlet name", req: true, full: true, ph: "Main branch",
          hint: "The store, not the company. It is what the fascia says, what a docket is headed with, and what you pick between when the business has more than one." },
        { k: "kind", label: "Outlet type", type: "select", options: [
          ["restaurant", "Restaurant — takes money"],
          ["central_kitchen", "Central kitchen — produces, does not sell"],
          ["main_store", "Main store — receives and dispatches"]
        ] },
        { k: "code", label: "Short code", req: true, mono: true, ph: "KOCHA",
          hint: "Goes in front of every document number. Letters and digits, up to eight." },
        { k: "slug", label: "Store address", type: "handle", from: "name", full: true,
          ph: "chaandhanee",
          hint: "Where your guests scan to. This is printed on the table cards, so it is worth getting right — lower case letters, numbers and hyphens." },
        /* ── the tax profile, where it is decided ──────────────────────────
           This was a step of its own, immediately after this one, asking the
           class and the service charge over again and the rate for the first
           time. It belongs here: provisionOutlet() writes chain.tax_version
           from these three in the same transaction that creates the schema, so
           the separate step was confirming a version that already existed. */
        { k: "taxCode", label: "Tax class", type: "select",
          options: function () {
            return state.gstRegistered()
              ? [["GGST", "GGST — general goods and services"],
                ["TGST", "TGST — tourism sector"]]
              : [["NONE", "Not registered for GST"]];
          },
          hint: function () {
            return state.gstRegistered()
              ? "TGST if this outlet is in a tourism zone; GGST otherwise."
              : "This business is not registered for GST, so this outlet charges nothing. Change it on step 1 if that is wrong.";
          } },
        { k: "taxRate", label: "Rate %", type: "number", mono: true,
          when: function () { return state.gstRegistered(); },
          v: function () { return String(state.statutory(state.taxCodeTyped())); },
          // GGST is 8, TGST is 16. The class is chosen after this box is
          // filled, so the box has to follow it — see the note in renderFields.
          follows: { k: "taxCode", value: function (code) { return String(state.statutory(code)); } },
          hint: "The statutory rate in force today is filled in. Change it only if yours differs — a tax version carries the date it took effect, so next year's change cannot restate this year's receipts." },
        { k: "taxFrom", label: "In force from", type: "date",
          when: function () { return state.gstRegistered(); },
          v: function () { return today(); } },
        { k: "servicePct", label: "Service charge %", type: "number", mono: true, v: "10",
          hint: "Charged on the goods, distributed to staff, and itself taxable. It is not a tax and is unaffected by GST registration." },
        { k: "dayStart", label: "Trading day starts", type: "time", v: "04:00",
          hint: "The trading day is not the calendar day: a sale at 01:30 belongs to last night." },
        /* ── asked once ────────────────────────────────────────────────────
           A single-outlet business trades at its registered address on its
           registered number, and typing both twice is the panel asking for
           something it is already holding. The offer reads off the RECORD, not
           off what step 1 left in the page, so it survives a reload. */
        { k: "sameAs", label: "Address and contact", type: "toggle", full: true,
          v: "yes", on: "yes", off: "no",
          onLabel: function () {
            var c = companyFacts();
            return "Same as the business" + (c.address ? " · " + oneLine(c.address) : "");
          },
          offLabel: "This outlet has its own",
          pressOn: "Press to use the business address and contact",
          pressOff: "Press if this store trades somewhere else",
          hint: "Turn it off where the store trades somewhere other than the registered address — a second branch, a kiosk, a resort island." },
        { k: "address", label: "Outlet address", full: true, type: "textarea",
          showIf: { k: "sameAs", is: "no" } },
        { k: "atoll", label: "Atoll or city", showIf: { k: "sameAs", is: "no" } },
        { k: "zip", label: "Postal code", mono: true, showIf: { k: "sameAs", is: "no" } },
        { k: "phone", label: "Telephone", showIf: { k: "sameAs", is: "no" } },
        { k: "mobile", label: "Mobile", showIf: { k: "sameAs", is: "no" } },
        { k: "email", label: "Email", type: "email", showIf: { k: "sameAs", is: "no" } },
        { k: "website", label: "Website", showIf: { k: "sameAs", is: "no" } }
      ],
      foot: "Saving creates the schema, the login role, the document series and the chart of accounts, records the tax version in force from the date above, and reserves the store address for good.",
      write: function (v) {
        var c = companyFacts();
        var own = v.sameAs !== "yes";
        return post("outlet", {
          name: v.name, code: v.code, kind: v.kind, slug: v.slug,
          taxCode: v.taxCode || null,
          taxRate: state.gstRegistered() && v.taxRate !== "" ? Number(v.taxRate) : undefined,
          taxFrom: state.gstRegistered() ? (v.taxFrom || undefined) : undefined,
          servicePct: Number(v.servicePct) || 0,
          dayStart: v.dayStart,
          address: own ? v.address : c.address,
          atoll: own ? v.atoll : c.atoll,
          phone: own ? v.phone : c.phone,
          brand: {
            logo: v.logo || "",
            email: (own ? v.email : c.email) || "",
            website: (own ? v.website : (c.brand || {}).website) || "",
            zip: (own ? v.zip : (c.brand || {}).zip) || "",
            mobile: (own ? v.mobile : (c.brand || {}).mobile) || ""
          }
        });
      }
    },
    {
      key: "owner", label: "Your account", eyebrow: "Step 3",
      sub: "Rank 5 — the only account that can create others",
      title: "Your account",
      lede: "This will be the admin user for your business. One five-rank ladder runs the whole system: Kitchen 1, Till 2, Manager 3, Admin 4, Owner 5. This is the rank-5 account, and it is the only one that can create the others.",
      why: "A shared till never asks for a password. Staff tap their own face and key four digits — that is what makes a void, a discount or a drawer opening attributable to a person. Your PIN is hashed with scrypt and a per-row salt the moment you set it, and is never displayed again.",
      edit: "Chain & Outlets → Users & roles",
      fields: [
        { k: "name", label: "Full name", req: true, full: true, ph: "Your full name" },
        { k: "phone", label: "Mobile", req: true, mono: true, ph: "+960 7XX XXXX",
          hint: "Yours, not the shop's. It is who support rings when the install needs a person, and it goes on your staff record — never on the roster a till can read." },
        { k: "pin", label: "Choose a PIN", req: true, mono: true, type: "password",
          attrs: { inputmode: "numeric", maxlength: "8", autocomplete: "new-password" },
          hint: "Four to eight digits. Six wrong attempts lock this terminal for fifteen minutes." },
        { k: "pin2", label: "Repeat the PIN", req: true, mono: true, type: "password",
          attrs: { inputmode: "numeric", maxlength: "8", autocomplete: "new-password" } }
      ],
      summary: true,
      foot: "This account can be claimed exactly once in the life of an installation. After that, accounts are created from Users & roles by an admin, and never above their own rank.",
      validate: function (v) {
        if (!/^\d{4,8}$/.test(v.pin)) return "A PIN is four to eight digits.";
        if (v.pin !== v.pin2) return "The two PINs do not match.";
        if (/^(\d)\1+$/.test(v.pin)) return "That PIN is one repeated digit — pick something a colleague could not watch you type.";
        return null;
      },
      write: function (v) {
        return post("owner", { name: v.name, pin: v.pin, phone: v.phone }).then(function (r) {
          state.token = r.token;
          try { localStorage.setItem("kashikeyo.token", JSON.stringify({
            token: r.token, outletId: r.outletId, rank: r.rank, name: r.name,
            roleKey: r.roleKey, staffId: r.staffId, exp: Date.now() + 11 * 3600e3
          })); } catch (e) {}
          return r;
        });
      }
    },
    {
      key: "series", label: "Document series",
      sub: "Once used, never renumbered",
      title: "How your documents are numbered",
      lede: "Every numbered document — receipt, credit note, purchase order, goods received note, indent, dispatch, journal voucher — is allocated from a series under a row lock, so two terminals can never mint the same number.",
      why: "A series that has already issued a number cannot be renumbered. That is not a limitation; it is what makes the trail auditable. Set them now, while they are empty.",
      edit: "Settings → Document series",
      table: {
        rows: "series",
        cols: [
          { k: "kind", label: "Document", ro: true, w: "1.4fr" },
          { k: "prefix", label: "Prefix", mono: true, w: "1.2fr" },
          { k: "start", label: "Starts at", type: "number", mono: true, w: ".8fr" }
        ]
      },
      foot: "Saving writes chain.doc_series. A series already in use is left alone and named back to you rather than silently ignored.",
      write: function (v) {
        return post("series", { series: v.series }).then(function (r) {
          if (r.refused && r.refused.length) {
            toast("Left alone (already in use): " + r.refused.join(", "), "warn");
          }
          return r;
        });
      }
    },
    {
      key: "chart", label: "Chart of accounts",
      sub: "Shipped complete — confirm the bank",
      title: "The books are already set up",
      lede: "Thirty-five accounts ship with the product, and the codes are load-bearing: the auto-posting rules, the profit and loss grouping and the GST return all read them. Nine of them belong to the till and a manual journal will refuse to touch them, because the ledger reconciles to the POS by construction.",
      why: "The only thing the app cannot know is your bank account and what was in it on the day your books start. The reconciliation counts forward from that figure.",
      edit: "Accounting → Chart of accounts",
      fields: [
        { k: "bankName", label: "Bank account name", v: "Bank — BML MVR", full: true },
        { k: "bankCode", label: "Account code", v: "1020", mono: true, ro: true },
        { k: "opening", label: "Opening balance, MVR", type: "number", v: "0", mono: true },
        { k: "asOf", label: "As at", type: "date", v: today() }
      ],
      foot: "The opening balance is a reconciliation anchor, not a posting — so the trial balance squares from the very first day, before anything has been sold.",
      write: function (v) { return post("chart", v); }
    },
    {
      key: "units", label: "Units",
      sub: "What the kitchen buys and cooks in",
      title: "Units, and how they convert",
      lede: "A recipe is written in the unit a chef thinks in — grams, millilitres, pieces — and stock is bought in the unit a supplier sells in. The factor between them is the only thing that keeps a plate cost honest.",
      why: "Get this wrong by a factor of a thousand and every food-cost percentage in the app is wrong by the same factor, silently. The defaults below are the standard set; add to them if your kitchen buys in something else.",
      edit: "Inventory → Units",
      table: {
        rows: "units",
        cols: [
          { k: "code", label: "Code", mono: true, w: ".8fr" },
          { k: "name", label: "Name", w: "1.6fr" },
          { k: "base", label: "Base unit", mono: true, w: ".9fr" },
          { k: "factor", label: "Base units in one", type: "number", mono: true, w: "1.1fr" }
        ],
        add: true
      },
      foot: "Saving writes the unit table the recipes and the stock ledger both read.",
      write: function (v) { return post("units", { units: v.units }); }
    },
    {
      key: "locations", label: "Locations",
      sub: "Stock cannot exist without one",
      title: "Where stock is held",
      lede: "Every gram in the system sits somewhere. A location is a place a person can walk to and count — the kitchen line, the dry store, the freezer.",
      why: "Transfers between them are movements, not edits, so the ledger stays the story of what actually happened.",
      edit: "Inventory → Locations",
      table: {
        rows: "locations",
        cols: [
          { k: "name", label: "Name", w: "1.6fr" },
          { k: "kind", label: "What it is", type: "select", w: "1.2fr", options: [
            ["kitchen", "Kitchen"], ["store", "Dry store"], ["freezer", "Freezer"],
            ["chiller", "Chiller"], ["bar", "Bar"], ["other", "Other"]
          ] }
        ],
        add: true
      },
      foot: "Saving writes the locations. One is enough to start; you can add the rest as you go.",
      write: function (v) {
        return post("locations", { locations: v.locations.filter(function (l) { return l.name; })
          .map(function (l) { return { id: slug(l.name), name: l.name, kind: l.kind }; }) });
      }
    },
    {
      key: "items", label: "Items",
      sub: "The first ingredients, with a cost",
      title: "What the kitchen buys",
      lede: "An ingredient carries the unit it is cooked in, the unit it is bought in, and what it costs. That is everything a recipe needs to price a plate.",
      why: "One item is enough to reach a first sale. The rest can arrive with your first delivery, or be imported from a supplier list later — the point of this step is that the chain is complete, not that the catalogue is.",
      edit: "Inventory → On hand",
      table: {
        rows: "items",
        cols: [
          { k: "name", label: "Ingredient", w: "1.8fr" },
          { k: "cat", label: "Category", w: "1fr" },
          { k: "base", label: "Cooks in", type: "select", w: ".8fr", options: [["g", "g"], ["ml", "ml"], ["pcs", "pcs"]] },
          { k: "stock", label: "Bought in", type: "select", w: ".9fr", options: [["kg", "kg"], ["g", "g"], ["l", "l"], ["ml", "ml"], ["pcs", "pcs"], ["doz", "doz"]] },
          { k: "cost", label: "Cost per bought unit", type: "number", mono: true, w: "1.2fr" },
          { k: "loc", label: "Held at", type: "select", w: "1fr", options: "locations" }
        ],
        add: true
      },
      foot: "Saving writes the ingredients. Cost is converted to a per-base-unit figure once, here, so no screen has to do it again.",
      write: function (v) {
        var rows = v.items.filter(function (i) { return i.name; });
        return post("items", { items: rows.map(function (i) {
          var f = factorFor(i.base, i.stock);
          return {
            id: slug(i.name), name: i.name, cat: i.cat || null,
            base: i.base, stock: i.stock, factor: f,
            cost: (Number(i.cost) || 0) / (f || 1),
            loc: i.loc || null
          };
        }) });
      }
    },
    {
      key: "menu", label: "Menu",
      sub: "Start with the full catalogue, or type your own",
      title: "What you sell",
      lede: "A dish carries a price and a recipe. The price is what the guest pays; the recipe is what leaves the kitchen when they do — and it is what turns a sale into a stock movement and a cost of sales at the moment of sale, rather than in a nightly batch.",
      why: "Two ways to start. The pre-set menu lands a complete Maldivian café catalogue — every section, every dish, and the add-on options a guest picks when a dish is ordered — ready to reprice, trim or rename in Menu Master. Starting empty is the same store with the typing still to do.",
      edit: "Menu Master",
      /* Saved once and re-saveable: an owner who started empty and thought
         better of it must be able to come back and load the catalogue — every
         write on this step is an upsert, so re-saving converges. */
      rewritable: true,
      table: {
        rows: "dishes",
        cols: [
          { k: "name", label: "Dish", w: "1.8fr" },
          { k: "cat", label: "Section", w: "1fr" },
          { k: "price", label: "Price MVR", type: "number", mono: true, w: ".9fr" },
          { k: "station", label: "Fires to", type: "select", w: ".9fr", options: [
            ["main", "Main"], ["grill", "Grill"], ["cold", "Cold"], ["bar", "Bar"], ["dessert", "Dessert"]
          ] },
          { k: "recipe", label: "Recipe", type: "recipe", w: "2.4fr" }
        ],
        add: true
      },
      foot: "Saving writes the sections, the dishes and the recipe lines. Price is exclusive of GST — the tax is added and shown as its own line.",
      write: function (v) {
        /* THE PRE-SET MENU. One request; the server replays the shipped
           catalogue through the same handlers a till write goes through, so a
           preset dish and a typed one are the same kind of row. The add-on
           links ride with the dishes — pick a dish at the till or on the QR
           menu and its options come up. */
        if (v.mode !== "empty") return post("menu-preset", {});
        var dishes = v.dishes.filter(function (d) { return d.name && d.price; });
        var cats = [];
        dishes.forEach(function (d) {
          var c = d.cat || "Menu";
          if (!cats.some(function (x) { return x.name === c; })) cats.push({ name: c });
        });
        return post("sections", { sections: [{ id: "menu", name: "Menu", pos: 1 }] })
          .then(function () {
            return post("categories", { categories: cats.map(function (c, i) {
              return { id: slug(c.name), name: c.name, section: "menu", pos: i + 1 };
            }) });
          })
          .then(function () {
            return post("dishes", { dishes: dishes.map(function (d, i) {
              return {
                id: slug(d.name), name: d.name, cat: slug(d.cat || "Menu"),
                price: Number(d.price) || 0, station: d.station || "main", pos: i,
                recipe: (d.recipe || []).filter(function (r) { return r.ing && r.qty; })
                  .map(function (r) { return [r.ing, Number(r.qty) || 0, 0]; })
              };
            }) });
          });
      }
    },
    {
      key: "floor", label: "Tables and zones",
      sub: "Or takeaway only, if that is the business",
      title: "The floor",
      lede: "A floor plan is a list of tables, not a count. A restaurant adds a two-top, pushes two together for a party of eight, or takes the terrace out of service for a week — none of which a number can express.",
      why: "If you only do takeaway and delivery, leave this empty and carry on. The till opens a bill straight away for those.",
      edit: "POS Floor → Edit floor",
      table: {
        rows: "tables",
        cols: [
          { k: "label", label: "Table", mono: true, w: "1fr" },
          { k: "zone", label: "Zone", w: "1.4fr" },
          { k: "seats", label: "Seats", type: "number", mono: true, w: ".8fr" }
        ],
        add: true
      },
      foot: "Saving writes the zones and the tables. Renaming a table later renames it on the kitchen ticket, the parked strip and the printed bill at the same time.",
      write: function (v) {
        var rows = v.tables.filter(function (t) { return t.label; });
        var zones = [];
        rows.forEach(function (t) {
          var z = t.zone || "Main floor";
          if (!zones.some(function (x) { return x.name === z; })) {

  /* WHAT THE COMPANY SAID, wherever it is. What step 1 typed this sitting, or

  function api(method, path, body) {
    var headers = { "content-type": "application/json" };
    if (state.token) headers.authorization = "Bearer " + state.token;
    // The account that signed up on the website is who this business will
    // belong to. Carried on every step, because the company is recorded on
    // step 1 and the outlet ownership on step 3.
    try {

  /* ── render ───────────────────────────────────────────────────────────── */

  function render() {

    var view = viewOf(step);
    var h = el("div");
    var where = step.apply

    h.appendChild(bar);

    /* The menu step leads with a DECISION, not a table: the full catalogue or
