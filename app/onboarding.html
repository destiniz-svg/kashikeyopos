       because a grid of blank rows under a pre-set the owner has already
       chosen is a form asking to be filled in for no reason. */
    if (step.key === "menu") {
      card.appendChild(renderMenuChoice(v));
      if (v.mode === "empty") card.appendChild(renderTable(step, v));
    } else if (step.table) card.appendChild(renderTable(step, v));
    else card.appendChild(renderFields(step, v));
    if (step.key === "chart") card.appendChild(renderChartSummary());
    if (step.summary) card.appendChild(renderApplicationSummary());
    card.appendChild(el("div", { class: "foot" }, view.foot));
    stage.appendChild(card);

    var err = el("div", { class: "err" });
    err.style.display = "none";
    stage.appendChild(err);

    var row = el("div", { class: "row" });
    /* The last application step SUBMITS — that is the moment the business,
       the store and the person all exist, and it reads differently from the
       nine "save and continue" that follow it. The last step of all opens the
       register, which is the moment a sale becomes possible. */
    var last = current === STEPS.length - 1;
    var submits = step.apply && step.n === APPLY_N;
    var save = el("button", { class: "go" + (submits ? " ok" : ""), type: "button" },
      state.done[step.key] ? "Saved · continue"
        : last ? "Open the register and start"
          : submits ? "Submit application ✓" : "Continue →");
    save.addEventListener("click", function () { commit(step, v, save, err); });
    row.appendChild(save);

    if (current > 0) {
      var back = el("button", { class: "ghost", type: "button" }, "← Back");
      back.addEventListener("click", function () { current--; render(); });
      row.appendChild(back);
    }
    if (state.done[step.key] && current < STEPS.length - 1) {
      var skip = el("button", { class: "ghost", type: "button" }, "Skip — already done");
      skip.addEventListener("click", function () { current++; render(); });
      row.appendChild(skip);
    }
    var where = el("span", { class: "hint" }, "Editable afterwards: " + step.edit);
    where.style.marginLeft = "auto";
    row.appendChild(where);
    stage.appendChild(row);

    /* The application's foot, on the application alone. The links are
       ABSOLUTE ADDRESSES ON THE BASE DOMAIN or they are not drawn — the
       website owns the apex, so a relative /terms on the app's own host
       answers 404, and a legal link that 404s is worse than none. Same rule
       joinUrl() keeps for the invitation. */
    if (step.apply && state.siteBase) {
      var legal = el("div", { class: "legal" });
      legal.appendChild(el("span", {}, "By submitting this application you agree to the "));
      legal.appendChild(el("a", { href: "https://" + state.siteBase + "/terms",
        target: "_blank", rel: "noopener" }, "Terms & Conditions"));
      legal.appendChild(el("span", {}, " and the "));
      legal.appendChild(el("a", { href: "https://" + state.siteBase + "/privacy",
        target: "_blank", rel: "noopener" }, "Privacy Policy"));
      legal.appendChild(el("span", {}, ". Need help? "));
      legal.appendChild(el("a", { href: "https://" + state.siteBase + "/docs",
        target: "_blank", rel: "noopener" }, "Read the guide"));
      legal.appendChild(el("span", {}, "."));
      stage.appendChild(legal);
    }

    // The rail is hidden on a phone, so the same three facts — which step,
    // how far in, how much is left — live in the bar at the top instead.
    document.getElementById("moTitle").textContent = step.label;
    document.getElementById("moSub").textContent = step.sub;
    document.getElementById("moNo").textContent = step.n + " / " + STEPS.length;
    document.getElementById("moBar").style.width =
      Math.round((doneN / STEPS.length) * 100) + "%";

    window.scrollTo(0, 0);
  }

  /* A store address is the one field on this panel whose answer is not the
     business's to decide alone — somebody else may already hold it. So it is
     checked against the same function the database will use when the step is
     saved (chain.handle_why), and it shows the whole address rather than the
     label, because a subdomain read on its own does not look like a place you
     can go. A field that shows a green tick and then refuses on save is worse
     than one that never checked. */
  function wireHandle(wrap, input, f, v, inputs) {
    var note = el("div", { class: "hint" }, "");
    note.style.marginTop = "2px";
    // Directly under the box, above the explanation. Feedback on what was just
    // typed belongs next to it, not below a paragraph about the rules.
    input.insertAdjacentElement("afterend", note);
    var timer = null, seq = 0, typed = false;
    input.addEventListener("input", function () { typed = true; });

    function paint(tone, text) {
      note.textContent = text;
      note.style.color = tone === "ok" ? "var(--go-bright)"
        : tone === "bad" ? "var(--danger-bright)" : "var(--text-muted)";
    }

    function ask() {
      var mine = ++seq;
      var q = "?h=" + encodeURIComponent(input.value || "")
        + "&from=" + encodeURIComponent(v[f.from] || "");
      api("GET", "/api/onboarding/handle" + q).then(function (r) {
        if (mine !== seq) return;                 // a later keystroke won
        // The server is the only thing that knows where the base domain ends,
        // so the whole address can only ever be spelled from its answer. The
        // summary on step 3 quotes the same one this field showed.
        if (r.base) state.portalBase = r.base;
        // Nothing typed yet: offer the business's own name as the address,
        // filled in rather than described, so it can be corrected in place.
        if (!typed && !input.value && r.suggested) {
          input.value = r.suggested;
          v[f.k] = r.suggested;
          return ask();
        }
        if (!input.value) return paint("", "");
        if (r.free) return paint("ok", "https://" + input.value
          + (r.base ? "." + r.base : "") + " is free");
        paint("bad", r.why || "that address cannot be used");
      }).catch(function () {
        // The check is a courtesy; the database is the authority. Say that
        // rather than block a business behind a failed fetch.
        if (mine === seq) paint("", "Could not check that address just now — saving will tell you.");
      });
    }

    input.addEventListener("input", function () {
      clearTimeout(timer); timer = setTimeout(ask, 350);
    });
    // Typing the business's name is how somebody tells us what to suggest. The
    // suggestion has to arrive THEN, not on a second visit to this step —
    // which is the only place it used to appear.
    var src = inputs && inputs[f.from];
    if (src) {
      src.addEventListener("input", function () {
        if (typed || input.value) return;    // theirs to change, not ours
        clearTimeout(timer); timer = setTimeout(ask, 400);
      });
    }
    ask();
  }

  function renderFields(step, v) {
    var grid = el("div", { class: "grid" });
    var inputs = {}, derived = [], conditional = [], follows = [];
    (fieldsOf(step) || []).forEach(function (f) {
      var wrap = el("div", { class: "f" + (f.full ? " full" : "") });
      var lab = el("label", {}, f.label);
      if (f.req) lab.appendChild(el("span", { class: "req" }, "*"));
      wrap.appendChild(lab);
      var input;
      if (f.type === "select") {
        input = el("select");
        (f.options || []).forEach(function (o) {
          var opt = el("option", { value: o[0] }, o[1]);
          input.appendChild(opt);
        });
        input.value = v[f.k] || (f.options[0] || [])[0] || "";
      } else if (f.type === "textarea") {
        input = el("textarea", { rows: "3" });
        if (f.ph) input.placeholder = f.ph;
        input.value = v[f.k] === undefined ? "" : v[f.k];
      } else if (f.type === "toggle") {
        input = toggleControl(wrap, lab, f, v);
      } else if (f.type === "logo") {
        input = logoControl(wrap, f, v);
      } else {
        input = el("input", { type: f.type || "text" });
        if (f.mono) input.className = "mono";
        if (f.ph) input.placeholder = f.ph;
        if (f.ro) { input.readOnly = true; input.style.opacity = ".6"; }
        Object.keys(f.attrs || {}).forEach(function (a) { input.setAttribute(a, f.attrs[a]); });
        input.value = v[f.k] === undefined ? "" : v[f.k];
      }
      input.addEventListener("input", function () { v[f.k] = input.value; });
      input.addEventListener("change", function () { v[f.k] = input.value; });
      // A toggle and a logo have already put their own furniture in the wrap;
      // what they hand back is the element carrying the VALUE, which is what
      // showIf reads and what nothing else needs to see.
      if (f.type !== "toggle" && f.type !== "logo") wrap.appendChild(input);
      inputs[f.k] = input;
      if (f.type === "handle") derived.push({ wrap: wrap, input: input, f: f });
      if (f.showIf) conditional.push({ wrap: wrap, input: input, f: f });
      if (f.follows) follows.push({ input: input, f: f });
      if (f.hint) wrap.appendChild(el("div", { class: "hint" }, f.hint));
      grid.appendChild(wrap);
    });

    /* A field that only applies given another field's answer. Asking a business
       below the GST threshold for a TIN is asking it to invent a tax number,
       and the field going away is the clearest way to say it does not apply. */
    conditional.forEach(function (c) {
      var src = inputs[c.f.showIf.k];
      var apply = function () {
        var on = src && String(src.value) === String(c.f.showIf.is);
        c.wrap.style.display = on ? "" : "none";
        // A hidden field must not also be a submitted one.
        if (!on) { c.input.value = ""; v[c.f.k] = ""; }
      };
      if (src) { src.addEventListener("change", apply); src.addEventListener("input", apply); }
      apply();
    });
    /* ── A FIGURE THAT FOLLOWS ANOTHER ANSWER ──────────────────────────────
       Found by driving this panel rather than by reading it: the rate box is
       filled with the statutory rate for the class, and the class is chosen
       AFTER the box has been filled. So picking TGST — the tourism sector,
       which is 16% — left 8% sitting beside it, and the outlet was created
       charging half what it owes. A tourism outlet at 8% is a debt to MIRA
       nobody notices until an audit, which is the same failure this build
       already refuses in `applySale()`.

       The rate follows the class, and STOPS following the moment somebody
       types their own — a business whose rate genuinely differs must not have
       it stomped by a select. Same rule the store address already keeps: a
       suggestion steps aside for an answer, a decision never does. */
    follows.forEach(function (d) {
      var src = inputs[d.f.follows.k];
      if (!src) return;
      var mine = false;
      d.input.addEventListener("input", function () { mine = true; });
      src.addEventListener("change", function () {
        if (mine) return;
        d.input.value = d.f.follows.value(src.value);
        v[d.f.k] = d.input.value;
      });
    });
    // Wired after the loop, not inside it: a field that derives from another
    // one has to be able to find it, and the one it derives from may not have
    // been built yet when its own turn came round.
    derived.forEach(function (d) { wireHandle(d.wrap, d.input, d.f, v, inputs); });
    return grid;
  }

  /* ── a toggle, which is a question with two answers ──────────────────────
     Not a checkbox: a checkbox says "on" and leaves "off" to be inferred from
     an empty box, and the two answers here are both statements — a business
     that is not registered for GST is making a claim, not failing to make one.
     So both sides are written out and the one in force is the one showing.

     The value lives on a hidden input rather than on the button, because
     `showIf` reads `.value` off whatever it is pointed at and a button has
     none. It dispatches `change` so a conditional field reacts the moment it
     is pressed, exactly as a select does. */
  function toggleControl(wrap, lab, f, v) {
    var hidden = el("input", { type: "hidden" });
    var on = f.on === undefined ? "yes" : f.on;
    var off = f.off === undefined ? "no" : f.off;
    hidden.value = v[f.k] === undefined ? (f.v === undefined ? off : f.v) : v[f.k];
    v[f.k] = hidden.value;

    var panel = el("div", { class: "tog" });
    var text = el("div", { class: "tt" });
    var title = el("b", {}, "");
    var note = el("small", {}, "");
    text.appendChild(title); text.appendChild(note);
    var sw = el("button", { class: "sw", type: "button", role: "switch" });
    sw.appendChild(el("i"));
    panel.appendChild(text);
    panel.appendChild(sw);

    function paint() {
      var is = hidden.value === on;
      sw.setAttribute("aria-checked", is ? "true" : "false");
      sw.classList.toggle("on", is);
      var t = is ? f.onLabel : f.offLabel;
      title.textContent = typeof t === "function" ? t() : (t || f.label);
      /* The label the SWITCH carries is the state it is in; the line under it
         is what pressing it would DO. Saying both is what stops a toggle being
         a control somebody has to press to find out — and each is written out
         as its own sentence rather than composed from the other, because
         "Press to say " + "This is a taxable business" reads as two sentences
         welded together, which is exactly how it read on screen. */
      var pr = is ? f.pressOff : f.pressOn;
      note.textContent = typeof pr === "function" ? pr() : (pr || "");
      sw.setAttribute("aria-label", f.label + " — " + title.textContent);
    }
    sw.addEventListener("click", function () {
      hidden.value = hidden.value === on ? off : on;
      v[f.k] = hidden.value;
      paint();
      hidden.dispatchEvent(new Event("change"));
    });
    paint();
    wrap.appendChild(panel);
    wrap.appendChild(hidden);
    return hidden;
  }

  /* ── a logo, scaled on the device that took it ───────────────────────────
     The same rule a dish photograph already follows: what comes off a phone is
     a four-megapixel JPEG, and a four-megapixel JPEG in an offline cache costs
     a terminal its whole storage budget. 320px on the longest side lands under
     a hundred kilobytes for any real mark.

     PNG stays PNG. A logo is the one image in this app that genuinely needs
     transparency — re-encoding it as JPEG puts a white box behind the mark on
     every dark receipt header and every dark menu. */
  function logoControl(wrap, f, v) {
    var hidden = el("input", { type: "hidden" });
    hidden.value = v[f.k] || "";

    var box = el("div", { class: "logo" });
    var pic = el("div", { class: "lp" });
    var img = el("img", { alt: "" });
    pic.appendChild(img);
    var side = el("div", { class: "ls" });
    var pick = el("button", { class: "mini", type: "button" }, "Upload logo");
    var drop = el("button", { class: "mini ghosty", type: "button" }, "Remove");
    var says = el("div", { class: "hint" }, "");
    var file = el("input", { type: "file", accept: "image/png,image/jpeg" });
    file.style.display = "none";
    var acts = el("div", { class: "la" });
    acts.appendChild(pick); acts.appendChild(drop);
    side.appendChild(acts); side.appendChild(says);
    box.appendChild(pic); box.appendChild(side); box.appendChild(file);

    function paint(msg) {
      var has = !!hidden.value;
      img.style.display = has ? "" : "none";
      if (has) img.src = hidden.value;
      pic.classList.toggle("empty", !has);
      pick.textContent = has ? "Replace" : "Upload logo";
      drop.style.display = has ? "" : "none";
      says.textContent = msg || (has ? "Stored with the record and printed from it."
        : "None — click to browse. PNG or JPG, up to 2 MB.");
      says.style.color = msg ? "var(--danger-bright)" : "";
    }
    pick.addEventListener("click", function () { file.click(); });
    pic.addEventListener("click", function () { file.click(); });
    drop.addEventListener("click", function () {
      hidden.value = ""; v[f.k] = ""; file.value = ""; paint();
    });
    file.addEventListener("change", function () {
      var got = file.files && file.files[0];
      if (!got) return;
      // Refused by NAME, not silently ignored. A picker that accepts a file
      // and shows nothing is a picker somebody tries three times.
      if (!/^image\/(png|jpeg)$/.test(got.type)) {
        return paint("That is a " + (got.type || "file of an unknown kind")
          + " — a logo is a PNG or a JPG.");
      }
      if (got.size > 2 * 1024 * 1024) {
        return paint("That file is " + Math.round(got.size / 1048576 * 10) / 10
          + " MB — the limit is 2 MB.");
      }
      paint("Scaling it down…");
      var rd = new FileReader();
      rd.onerror = function () { paint("That file could not be read."); };
      rd.onload = function () {
        var im = new Image();
        im.onerror = function () { paint("That file is not an image this browser can open."); };
        im.onload = function () {
          try {
            var max = 320;
            var sc = Math.min(1, max / Math.max(im.width, im.height));
            var cv = document.createElement("canvas");
            cv.width = Math.max(1, Math.round(im.width * sc));
            cv.height = Math.max(1, Math.round(im.height * sc));
            cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
            var out = got.type === "image/png"
              ? cv.toDataURL("image/png")
              : cv.toDataURL("image/jpeg", 0.85);
            hidden.value = out;
            v[f.k] = out;
            paint(cv.width + "×" + cv.height + " · "
              + Math.round(out.length * 0.75 / 1024) + " KB");
          } catch (e) { paint("That image could not be scaled: " + e.message); }
        };
        im.src = rd.result;
      };
      rd.readAsDataURL(got);
    });
    paint();
    wrap.appendChild(box);
    wrap.appendChild(hidden);
    return hidden;
  }

  /* Two ways to start a menu, as two cards the owner picks between. The
     counts come from the server's own reading of the shipped file — never
     typed here, so the sentence cannot drift from what Continue would write. */
  function renderMenuChoice(v) {
    var p = state.preset || {};
    var wrap = el("div", { class: "pick", role: "radiogroup",
      "aria-label": "How the menu starts" });
    function opt(mode, title, body, mark) {
      var b = el("button", { type: "button",
        "aria-pressed": v.mode === mode ? "true" : "false" });
      if (mark) b.appendChild(el("span", { class: "mark" }, mark));
      b.appendChild(el("b", {}, title));
      b.appendChild(el("small", {}, body));
      b.addEventListener("click", function () {
        if (v.mode === mode) return;
        v.mode = mode;
        render();
      });
      return b;
    }
    wrap.appendChild(opt("preset", "Start with the pre-set menu",
      (p.dishes ? p.dishes + " dishes in " + p.sections + " sections, with "
        + p.addons + " add-on options and " + (p.counter || 0)
        + " bought-in counter items"
        : "The full shipped catalogue")
      + " — every dish carries the add-on choices a guest picks when it is"
      + " ordered. Reprice, rename or remove anything in Menu Master.",
      "Recommended"));
    wrap.appendChild(opt("empty", "Start empty",
      "Type your own sections and dishes below — or import a CSV from Menu"
      + " Master later. The pre-set menu stays one tap away in Menu Master"
      + " if you change your mind."));
    return wrap;
  }

  function renderTable(step, v) {""
    var key = step.table.rows;
    var rows = v[key] || (v[key] = []);
    var box = el("div");
    var scroll = el("div", { class: "scroll" });
    var t = el("table");
    var thead = el("thead"), tr = el("tr");
    step.table.cols.forEach(function (c) { tr.appendChild(el("th", {}, c.label)); });
    if (step.table.add) tr.appendChild(el("th", {}, ""));
    thead.appendChild(tr); t.appendChild(thead);
    var tb = el("tbody");
    rows.forEach(function (r, i) {
      var line = el("tr");
      step.table.cols.forEach(function (c) {
        var td = el("td");
        td.style.minWidth = c.w === "2.4fr" ? "300px" : "110px";
        if (c.type === "recipe") td.appendChild(recipeCell(r));
        else if (c.type === "select") {
          var sel = el("select");
          optionsFor(c).forEach(function (o) { sel.appendChild(el("option", { value: o[0] }, o[1])); });
          sel.value = r[c.k] || "";
          sel.addEventListener("change", function () { r[c.k] = sel.value; });
          td.appendChild(sel);
        } else {
          var inp = el("input", { type: c.type || "text" });
          if (c.mono) inp.className = "mono";
          if (c.ro) { inp.readOnly = true; inp.style.opacity = ".6"; }
          Object.keys(c.attrs || {}).forEach(function (a) { inp.setAttribute(a, c.attrs[a]); });
          inp.value = r[c.k] === undefined ? "" : r[c.k];
          inp.addEventListener("input", function () { r[c.k] = inp.value; });
          td.appendChild(inp);
        }
        line.appendChild(td);
      });
      if (step.table.add) {
        var td2 = el("td");
        td2.style.minWidth = "0";
        var del = el("button", { class: "mini", type: "button", title: "Remove this row" }, "✕");
        del.addEventListener("click", function () { rows.splice(i, 1); render(); });
        td2.appendChild(del);
        line.appendChild(td2);
      }
      tb.appendChild(line);
    });
    t.appendChild(tb);
    scroll.appendChild(t);
    box.appendChild(scroll);
    if (step.table.add) {
      var add = el("button", { class: "mini", type: "button" }, "+ Add a row");
      add.style.marginTop = "12px";
      add.addEventListener("click", function () { rows.push(blank(step)); render(); });
      box.appendChild(add);
    }
    if (!rows.length) {
      box.appendChild(el("div", { class: "hint", style: "padding:14px 4px" },
        "Nothing here yet — add a row, or carry on and add them from the app later."));
    }
    return box;
  }

  function optionsFor(c) {
    if (c.options === "locations") {
      var locs = (state.vals.locations && state.vals.locations.locations) || [];
      var out = locs.filter(function (l) { return l.name; })
        .map(function (l) { return [slug(l.name), l.name]; });
      return out.length ? out : [["", "—"]];
    }
    return c.options || [];
  }

  // A recipe on one line: what goes into the dish, and how much.
  function recipeCell(row) {
    var box = el("div");
    row.recipe = row.recipe || [];
    var items = (state.vals.items && state.vals.items.items) || [];
    var choices = items.filter(function (i) { return i.name; });
    if (!choices.length) {
      return el("div", { class: "hint" }, "Add ingredients in step 9 first");
    }
    row.recipe.forEach(function (line, i) {
      var l = el("div");
      l.style.cssText = "display:flex;gap:6px;align-items:center;margin-bottom:5px";
      var sel = el("select");
      sel.style.flex = "1 1 auto";
      choices.forEach(function (c) { sel.appendChild(el("option", { value: slug(c.name) }, c.name)); });
      sel.value = line.ing || slug(choices[0].name);
      line.ing = sel.value;
      sel.addEventListener("change", function () { line.ing = sel.value; });
      var qty = el("input", { type: "number", class: "mono" });
      qty.style.cssText = "width:88px;flex:0 0 auto";
      qty.placeholder = "qty";
      qty.value = line.qty || "";
      qty.addEventListener("input", function () { line.qty = qty.value; });
      var unit = el("span", { class: "hint" },
        (choices.filter(function (c) { return slug(c.name) === line.ing; })[0] || {}).base || "");
      var del = el("button", { class: "mini", type: "button" }, "✕");
      del.addEventListener("click", function () { row.recipe.splice(i, 1); render(); });
      l.appendChild(sel); l.appendChild(qty); l.appendChild(unit); l.appendChild(del);
      box.appendChild(l);
    });
    var add = el("button", { class: "mini", type: "button" }, "+ ingredient");
    add.addEventListener("click", function () {
      row.recipe.push({ ing: slug(choices[0].name), qty: "" });
      render();
    });
    box.appendChild(add);
    return box;
  }

  /* ── the pill stepper ────────────────────────────────────────────────────
     Three nodes and two lines, and every one of them is a fact rather than a
     decoration: filled is where you are, ticked is written, pale is ahead. It
     is drawn only over the application, because a stepper is legible at three
     and a smear at thirteen — the rail is what carries the long sequence.

     Reachability is the same rule the rail keeps: a step is reachable if the
     one before it is done, so this cannot be used to jump the dependency. */
  function renderPills() {
    var box = el("div", { class: "pills" });
    STEPS.filter(function (s) { return s.apply; }).forEach(function (s, i) {
      var idx = STEPS.indexOf(s);
      if (i) box.appendChild(el("span", { class: "pline"
        + (state.done[STEPS[idx - 1].key] ? " done" : "") }));
      var reachable = idx === 0 || state.done[STEPS[idx - 1].key] || state.done[s.key];
      var b = el("button", { class: "pill" + (state.done[s.key] ? " done" : "")
        + (idx === current ? " now" : ""), type: "button" });
      b.disabled = !reachable;
      b.setAttribute("aria-current", idx === current ? "step" : "false");
      var dot = el("span", { class: "pd" }, state.done[s.key] ? "✓" : undefined);
      if (!state.done[s.key]) {
        var ic = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        ic.setAttribute("viewBox", "0 0 24 24");
        ic.setAttribute("fill", "none"); ic.setAttribute("stroke", "currentColor");
        ic.setAttribute("stroke-width", "1.8"); ic.setAttribute("stroke-linecap", "round");
        ic.setAttribute("stroke-linejoin", "round");
        ic.setAttribute("aria-hidden", "true");
        var ph = document.createElementNS("http://www.w3.org/2000/svg", "path");
        ph.setAttribute("d", PILL_ICONS[s.key] || "");
        ic.appendChild(ph);
        dot.appendChild(ic);
      }
      var lab = el("span", { class: "pl" }, s.label);
      b.appendChild(dot); b.appendChild(lab);
      b.addEventListener("click", function () { if (reachable) { current = idx; render(); } });
      box.appendChild(b);
    });
    return box;
  }

  /* ── what is about to be submitted ───────────────────────────────────────
     Read off what has actually been written or typed, never off a literal.
     A summary that states a plan nobody chose, or an outlet nobody named, is
     the invented-figure defect with a border round it — so a line with no
     answer says so rather than guessing one. */
  function renderApplicationSummary() {
    var c = companyFacts();
    var o = (state.vals && state.vals.outlet) || {};
    var out = state.outletRec || {};
    var box = el("div", { class: "sum" });
    box.appendChild(el("div", { class: "sumh" }, "Your application"));
    var rows = [
      ["Business", c.legalName || state.business || "—"],
      ["GST", state.gstRegistered() ? "Registered" : "Not registered"],
      ["Outlet", out.name || o.name || "—"],
      ["Store address", (out.slug || o.slug)
        ? (out.slug || o.slug) + (state.portalBase ? "." + state.portalBase : "")
        : "—"],
      ["Currency", c.currency || "MVR"]
    ];
    /* THE PLAN, only where the install actually carries one. A seller-set
       licence is a fact worth summarising; a self-serve signup has none yet,
       and a row reading "Plan — none" would be the panel asserting a state
       nobody chose. No price ever: chain.licence carries no price, and this
       build does not invent figures. */
    if (state.licence && state.licence.kind) {
      rows.push(["Plan", state.licence.kind
        + (state.licence.trialEnds ? " · until " + state.licence.trialEnds : "")]);
    }
    rows.forEach(function (r) {
      var kv = el("div", { class: "kv" });
      kv.appendChild(el("b", {}, r[0]));
      kv.appendChild(el("span", {}, r[1]));
      box.appendChild(kv);
    });
    box.appendChild(el("div", { class: "hint" },
      "Submitting creates the rank-5 account and signs this terminal in as it. "
      + "Everything above is editable afterwards from Settings."));
    return box;
  }

  function renderChartSummary() {
    var box = el("div");
    box.style.marginTop = "18px";
    var rows = [
      ["Accounts shipped", "35"],
      ["Owned by the till, refused to a manual journal", "9"],
      ["Expense accounts on the P&L", "17"],
      ["Document series created", "7"]
    ];
    rows.forEach(function (r) {
      var kv = el("div", { class: "kv" });
      kv.appendChild(el("b", {}, r[0]));
      kv.appendChild(el("span", {}, r[1]));
      box.appendChild(kv);
    });
    return box;
  }

  /* ── save ─────────────────────────────────────────────────────────────── */
  function commit(step, v, button, errEl) {
    errEl.style.display = "none";
    var missing = (fieldsOf(step) || []).filter(function (f) {
      return f.req && !String(v[f.k] || "").trim();
    });
    if (missing.length) {
      errEl.textContent = missing.length === 1
        ? missing[0].label + " is required."
        : "These are required: " + missing.map(function (f) { return f.label; }).join(", ") + ".";
      errEl.style.display = "block";
      return;
    }
    if (step.validate) {
      var msg = step.validate(v);
      if (msg) { errEl.textContent = msg; errEl.style.display = "block"; return; }
    }

    // Already done and unchanged: move on rather than writing twice.
    if (state.done[step.key] && !step.rewritable) {
      advance();
      return;
    }

    button.disabled = true;
    var was = button.textContent;
    button.textContent = "Saving…";
    Promise.resolve(step.write(v)).then(function () {
      return refresh();
    }).then(function () {
      button.disabled = false;
      button.textContent = was;
      toast(step.label + " saved");
      advance();
    }).catch(function (e) {
      button.disabled = false;
      button.textContent = was;
      if (e.claim) {
        // The code was wrong, or this install grew one since the page loaded.
        // Forget it and ask again in the code's own words — leaving a bad code
        // in place would refuse every subsequent step for the same reason.
        state.claim = "";
        try { sessionStorage.removeItem("kashikeyo.claim"); } catch (x) {}
        askClaim(e.message);
        return;
      }
      errEl.textContent = e.message;
      errEl.style.display = "block";
      toast(e.message, "err");
    });
  }

  function advance() {
    if (current < STEPS.length - 1) { current++; render(); return; }
    // The last of them. Stamp it and hand over to the floor.
    api("POST", "/api/onboarding/finish", {}).catch(function () {}).then(function () {
      toast("Set up — opening the floor");
      setTimeout(function () { location.href = "/"; }, 700);
    });
  }

  /* ── the setup code ───────────────────────────────────────────────────────
     An install provisioned by a seller is CLAIMED before it is configured, and
     the claim is a code handed over with the address. It is asked once, up
     front, rather than added as a field on step 1: it is not a fact about the
     company, it is permission to create one — and putting it beside the legal
     name would invite somebody to invent it the way they might invent a TIN.

     There is nothing to remember and nothing to get wrong: one field, one
     button, and the server's own words when it refuses. */
  function askClaim(why) {
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    stage.appendChild(el("div", { class: "chip" }, "Before you begin"));
    var t = el("h1", {}, "This install has a setup code");
    t.style.marginTop = "12px";
    stage.appendChild(t);
    stage.appendChild(el("p", { class: "sub" },
      why || "It was given to you with your store's address. It proves this "
        + "install is yours to set up."));

    var card = el("div", { class: "card" });
    var lab = el("label", { for: "claimcode" }, "Setup code");
    card.appendChild(lab);
    var inp = el("input", {
      id: "claimcode", type: "text", autocomplete: "off",
      spellcheck: "false", placeholder: "Paste the code"
    });
    card.appendChild(inp);
    card.appendChild(el("div", { class: "foot" },
      "Lost it? Whoever set the store up can read it back — it is not "
      + "recoverable from this screen, by design."));
    stage.appendChild(card);

    var err = el("div", { class: "err" });
    err.style.display = "none";
    stage.appendChild(err);

    var go = el("button", { class: "go" }, "Continue");
    go.onclick = function () {
      var v = inp.value.trim();
      if (!v) { err.textContent = "Type the code you were given."; err.style.display = ""; return; }
      // Checked HERE, not on the first save. Letting somebody past the gate on
      // an unchecked code and refusing them three fields later is the same
      // defect as a green tick on a store handle that is then taken.
      go.disabled = true;
      var was = go.textContent;
      go.textContent = "Checking…";
      state.claim = v;
      api("POST", "/api/onboarding/claim", {}).then(function () {
        try { sessionStorage.setItem("kashikeyo.claim", v); } catch (e) {}
        begin();
      }).catch(function (e) {
        state.claim = "";
        go.disabled = false;
        go.textContent = was;
        err.textContent = e.message;
        err.style.display = "";
        inp.select();
      });
    };
    inp.onkeydown = function (e) { if (e.key === "Enter") go.click(); };
    stage.appendChild(go);
    inp.focus();
  }

  /* ── boot ─────────────────────────────────────────────────────────────── */
  function begin() {
    return refresh().then(function () {
      if (state.claimWanted && !state.claim) return askClaim();
      // Land on the first step that is not done, not on step 1 every time.
      var i = STEPS.findIndex(function (s) { return !state.done[s.key]; });
      current = i < 0 ? 0 : i;
      if (i < 0) { location.href = "/"; return; }
      render();
    });
  }

  try { state.claim = sessionStorage.getItem("kashikeyo.claim") || ""; } catch (e) {}
  begin().catch(function (e) {
    document.getElementById("stage").innerHTML = "";
    var stage = document.getElementById("stage");
    stage.appendChild(el("h1", {}, "The server is not answering"));
    stage.appendChild(el("p", { class: "sub" },
      "Set-up needs the database to be reachable. " + e.message));
  });

  /* One element helper, so the markup above reads as markup. Text is set with
     textContent, never innerHTML: a company name is user input and belongs in
     a text node. */
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text !== undefined) n.textContent = text;
    return n;
  }
})();
</script>
</body>
</html>
