<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control · KashikeyoPOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4553c'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3' fill='%23fff4f0'/%3E%3C/svg%3E">
<style>
/* The panel wears the terminal's clothes: same faces, same near-neutral dark
   ramp, same rule that a filled background always means "this does something".
   One saturated accent (the brand coral) and one data hue (the periwinkle the
   till uses to advance an order) — everything else is ink on graphite. */
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(/fonts/instrument-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/fonts/jbmono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/fonts/jbmono-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/fonts/jbmono-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#111214;--bg-0:#161719;--bg-1:#1b1c1f;--bg-2:#212327;--bg-3:#2c2e33;
  --line-soft:#212327;--line:#2c2e33;--line-2:#3a3d43;
  --text:#f5f6f7;--text-dim:#d3d5d9;--text-muted:#bcbfc5;--text-faint:#a6aab1;
  --accent:#f4553c;--accent-deep:#d63f27;--accent-btn:#c2321c;--on-accent:#fff4f0;
  --go:#34c77b;--go-bright:#5fe09a;--go-dim:#12281d;--go-line:#256b47;
  --fwd:#7c92f5;--fwd-bright:#a3b3fa;--fwd-dim:#171c33;--fwd-line:#3a4a9c;
  --warn:#f2a43a;--warn-bright:#ffc14a;--warn-dim:rgba(242,164,58,.14);--warn-line:#6b4a1f;
  --danger:#f2445e;--danger-bright:#ff7b8e;--danger-dim:#301218;--danger-line:#7d2231;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--text);font-size:14px;
  line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg-0);
  border:1px solid var(--line-2);border-radius:9px;padding:11px 13px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--fwd-line)}
::placeholder{color:var(--text-faint)}
.mono{font-family:var(--mono);letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 60px}
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}

/* the sign-in / setup card */
.gatecard{width:100%;max-width:400px;background:var(--bg-1);border:1px solid var(--line);
  border-radius:18px;padding:30px}
.gatecard h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.gatecard .sub{font-size:12.5px;color:var(--text-muted);margin:6px 0 20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--text-faint);margin-bottom:6px}
.cta{width:100%;padding:13px;border-radius:999px;background:var(--accent-btn);color:var(--on-accent);
  font-weight:700;font-size:13.5px;min-height:46px;margin-top:6px}
.cta:hover{background:var(--accent-deep)}
.cta[disabled]{opacity:.5;cursor:default}
.err{font-size:12.5px;color:var(--danger-bright);background:var(--danger-dim);
  border:1px solid var(--danger-line);border-radius:9px;padding:10px 12px;margin-bottom:12px}

/* top bar — wraps on narrow screens rather than overflowing */
.top{display:flex;align-items:center;gap:10px 14px;padding:20px 0 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.top .grow{flex:1}

/* the view tabs — one recessed track, one raised chip, the back-office rule */
.tabs{display:flex;gap:4px;background:var(--bg-0);border:1px solid var(--line);
  border-radius:999px;padding:4px}
.tab{padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--text-muted);min-height:36px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--bg-3);color:var(--text)}

/* the filter bar over the business grid */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filters input{max-width:280px;padding:9px 13px;min-width:160px;flex:1 1 160px}
.fchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);
  color:var(--text-muted);font-size:12px;font-weight:600;min-height:36px;white-space:nowrap}
.fchip:hover{color:var(--text)}
.fchip.on{background:var(--bg-3);border-color:var(--line-2);color:var(--text)}

/* the log pane */
.logbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.logpane{background:var(--bg-0);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-family:var(--mono);font-size:11px;line-height:1.7;
  letter-spacing:.01em;overflow:auto;max-height:min(62dvh,640px);
  overscroll-behavior:contain}
.logline{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word}
.logline .lt{color:var(--text-faint);flex-shrink:0}
.logline .lm{color:var(--text-dim);min-width:0}
.logline.err .lm{color:var(--danger-bright)}
.logline.warn .lm{color:var(--warn-bright)}
.ghost{padding:9px 15px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-dim);
  font-size:12.5px;font-weight:600;min-height:40px}
.ghost:hover{background:var(--bg-2)}
.primary{padding:9px 16px;border-radius:999px;background:var(--accent-btn);color:var(--on-accent);
  font-size:12.5px;font-weight:700;min-height:40px}
.primary:hover{background:var(--accent-deep)}

/* KPI stat tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--bg-1);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--text-muted);margin-top:3px}

/* install cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--bg-1);border:1px solid var(--line);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:12px}
.card.archived{opacity:.55}
.card .head{display:flex;align-items:flex-start;gap:10px}
.card .head .nm{flex:1;min-width:0}
.card .head .nm b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .head .nm span{display:block;font-size:11.5px;color:var(--text-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.chip .pip{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chip.live{background:var(--go-dim);border:1px solid var(--go-line);color:var(--go-bright)}
.chip.live .pip{background:var(--go)}
.chip.onb{background:var(--fwd-dim);border:1px solid var(--fwd-line);color:var(--fwd-bright)}
.chip.onb .pip{background:var(--fwd)}
.chip.warn{background:var(--warn-dim);border:1px solid var(--warn-line);color:var(--warn-bright)}
.chip.warn .pip{background:var(--warn)}
.chip.bad{background:var(--danger-dim);border:1px solid var(--danger-line);color:var(--danger-bright)}
.chip.bad .pip{background:var(--danger)}
.chip.mute{background:var(--bg-2);border:1px solid var(--line-2);color:var(--text-muted)}
.chip.mute .pip{background:var(--text-faint)}
.card .figs{display:flex;align-items:flex-end;gap:16px}
.card .figs .today .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-faint)}
.card .figs .today .v{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.02em;margin-top:3px}
.card .figs svg{flex:1;min-width:0;display:block}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-muted)}
.card .meta .warn-t{color:var(--warn-bright);font-weight:600}
.card .meta .mono{font-size:10.5px;color:var(--text-faint)}
.card .note{font-size:12px;color:var(--text-faint);border-top:1px solid var(--line-soft);padding-top:10px}
/* A customer asking to be put on a plan is the one thing on this card that
   somebody has to act on, so it does not read as a footnote. Warm ground,
   a rule down the left, and the ink stays at full strength. */
.card .note.ask{color:var(--text);background:var(--warn-dim);border-top:none;
  border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:9px 11px;margin-top:2px}
.card .note.ask b{display:block;font-weight:600}
.card .note.ask div{margin-top:3px;color:var(--text-dim)}
.card .foot{display:flex;gap:8px;margin-top:2px}
.card .foot .grow{flex:1}
.mini{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-dim);
  font-size:11.5px;font-weight:600;min-height:36px}
.mini:hover{background:var(--bg-2)}

.sechead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-faint);margin:24px 0 12px}

/* empty + loading states say what is true */
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:44px 24px;text-align:center;
  color:var(--text-muted);font-size:13.5px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.updated{font-size:11px;color:var(--text-faint);margin:14px 0 0;text-align:right}

/* sheet (add / edit) rises from the bottom edge */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:40}
.sheet{width:100%;max-width:520px;background:var(--bg-1);border:1px solid var(--line);
  border-bottom:none;border-radius:18px 18px 0 0;padding:24px 24px 30px;max-height:88dvh;overflow:auto;
  animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:16px;font-weight:700;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .cta{margin-top:0}
@media (max-width:560px){.sheet .row2{grid-template-columns:1fr}}

/* ── the phone ──────────────────────────────────────────────────────────────
   A developer checks this panel from wherever the alert found them, which is
   as likely a phone as a desk. Nothing may scroll sideways; the tiles and
   cards collapse to one column; the sheets keep their bottom-edge rise but
   spend less chrome; every control keeps a 36px+ touch target. */
@media (max-width:720px){
  .wrap{padding:0 14px 40px}
  .top{padding-top:14px}
  .tabs{order:3;width:100%;justify-content:stretch}
  .tab{flex:1;text-align:center}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
  .kpi{padding:12px 14px;border-radius:12px}
  .kpi .v{font-size:20px}
  .cards{grid-template-columns:1fr;gap:11px}
  .card{padding:15px;border-radius:14px}
  .card .foot{flex-wrap:wrap}
  .filters input{max-width:none}
  .sheet{padding:18px 16px 26px;max-height:92dvh}
  .logpane{max-height:70dvh;border-radius:12px;padding:11px 12px}
}

/* WHERE THE KEYBOARD IS. Every field here carries outline:none for the sake of
   the bordered pill it sits in, so a seller signing in by keyboard had no idea
   which control they were on. One rule, drawn inside the field because a pill
   has no room outside it. */
:focus-visible{outline:2px solid var(--accent) !important;outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline-offset:-2px}
</style>
</head>
<body>
<div id="app" class="center"><div style="color:var(--text-faint);font-size:13px">Loading…</div></div>
<script src="/kashikeyo-qr.js"></script>
<script src="/panel.js"></script>
</body>
</html>
