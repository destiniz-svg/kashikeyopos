<!--
  KashikeyoPOS — Guest QR ordering app · BUILD FILE
  ================================================
  Framework-free. No build step, no bundler, no runtime dependency. Drop this
  file on a route (e.g. GET /t/:outlet/:table) and it runs.

  The production port of the design prototype, matched to the till. Colour,
  radius and the item panel come from the KashikeyoPOS till's own item screen
  (paper, olive-green accent, DARK label on the accent fill, pill modifier
  chips, monospaced money) so a guest and a server look at the same product.
  Everything that was hardcoded is now a token or an adapter call.

  ── HOW TO WIRE IT UP ───────────────────────────────────────────────────────
  Everything the app needs from the till goes through ONE object. Define it
  before this file's script runs (or pass it to KashikeyoGuestQR.mount):

    window.KASHIKEYO_QR = {
      outletId: 3,                  // required
      table: 9,                     // required
      host: "order.kashikeyo.mv",   // shown in the fake browser chrome
      greeting: "",                 // "" = time-of-day greeting
      shell: "auto",                // auto | frame | bleed
      showBanner: true,
      showTipLine: true,
      showBrowserChrome: true,
      imageBase: "img/",            // prefix for every m.img / banner .img
                                    //   resolution is idempotent: bare
                                    //   ("foo.jpg"), already-prefixed
                                    //   ("img/foo.jpg") and absolute
                                    //   ("/static/..", "https://..") all work
      data: { CHAIN, OUTLETS, MENU_CATEGORIES, MENU, MODIFIERS, BANNERS },
      adapter: { ...see ADAPTER below }
    };

  Leave `data` out and the bundled seed below is used — the file then opens
  standalone in a browser and looks exactly like the prototype.

  ── THE ADAPTER (the only place that talks to your backend) ─────────────────
  Every method is optional; the default implementation is the localStorage
  bridge the prototype used, so an unwired file still demos end to end.

    ticket()            -> { lines:[{id,qty,note,fired,firedAt,done}] } | null
                           what the till says this table actually holds
    soldOut()           -> ["m3", ...]   the 86 list
    prefs()             -> { tipLine:boolean, kdsSla:minutes }
    banners()           -> [{id,title,sub,code,img,active,outlet}] | null
    promoCodes()        -> ["REEF5", ...] valid codes on this outlet
    push(intent)        -> boolean   guest -> till. See INTENTS.
    subscribe(fn)       -> unsubscribe. Call fn() whenever the ticket changes.

  INTENTS pushed to push():
    { kind:"assist",  detail, table, outlet }                    raised hand
    { kind:"assist",  detail, split:1 }                          split request
    { kind:"order",   detail, lines:[{id,qty,note}], total, promo, pct }
    { kind:"bill",    detail, tender, tip, due, ref, promo, pct }
  A guest phone is never a source of truth for a ticket: it posts intent and
  reads state back. Nothing here writes the till's session.

  ── SETTLEMENT ──────────────────────────────────────────────────────────────
  The till closes the ticket; the app reads that as paid. Once ticket() returns
  no lines while a settlement is pending, the screen flips to a receipt. Do not
  add a "mark paid" call — the terminal is the authority.

  ── ACCESSIBILITY / MOTION ──────────────────────────────────────────────────
  prefers-reduced-motion drops every transform animation to a fade. Every hit
  target is >=44px in the footer bars and >=27px on quantity steppers, matching
  the prototype exactly.
-->

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TOKENS — every colour in the app. These are the prototype's literal values,
   named. Nothing below this block invents a colour.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* accent — taken from the till's item panel: olive green, dark label on the fill */
  --k-accent:#7fae3c;         /* the accent: every fill, every active state */
  --k-accent-deep:#5f8b26;    /* pressed, borders, glyph on a fill */
  --k-accent-text:#4a7020;    /* ACCENT AS TEXT. 5.6:1 on paper — #7fae3c is 2.6:1 and
                                 must never carry small text. Fills use --k-accent. */
  --k-accent-ink:#22300d;     /* LABEL ON AN ACCENT FILL — the till uses dark, not white */
  --k-desk:#4c5334;           /* the desk the handset sits on */
  --k-accent-tint:#f2f7e8;    /* sheet action icon wells */
  --k-accent-tint-2:#f6faf0;  /* selected chip / selected tip */
  --k-accent-tint-3:#f9fcf4;  /* selected tender row */
  --k-accent-line:#cbdfa4;    /* border when the item is in the round */
  --k-accent-glow:rgba(127,174,60,.32);
  --k-accent-glow-sm:rgba(127,174,60,.28);
  --k-accent-glow-lg:rgba(127,174,60,.38);

  /* ink — warmed to sit on paper rather than white */
  --k-ink:#191813;
  --k-ink-1:#1f1e18;
  --k-ink-2:#2c2b23;
  --k-ink-3:#3a382e;
  --k-ink-4:#4a4839;
  --k-ink-5:#5a5847;
  --k-ink-6:#6a6857;
  --k-ink-7:#807e6c;
  --k-mute:#6f6d5e;           /* the workhorse secondary — 5.1:1 on paper */
  --k-mute-2:#737162;         /* footnotes — 4.8:1 at 11.5px */
  --k-mute-3:#767464;         /* 11px meta — 4.5:1 */
  --k-placeholder:#b4b2a2;
  --k-icon-dim:#bebcac;
  --k-disabled:#c6c4b4;

  /* surfaces + lines — paper, not white */
  --k-white:#fffdf6;          /* PAPER. The till's panel colour. */
  --k-well:#f3f1e6;           /* chip, note field, close button */
  --k-chrome:#f5f3ea;         /* fake Safari chrome */
  --k-photo-bg:#ebe7db;       /* behind a loading photo */
  --k-hero-bg:#2a281c;
  --k-line:#e9e6d9;           /* search field */
  --k-line-2:#e6e3d4;         /* the default card border */
  --k-line-3:#eae7da;         /* footer bar rule */
  --k-line-4:#edeade;
  --k-line-5:#f0ede2;
  --k-line-dash:#e2dfd0;      /* receipt perforation */
  --k-line-dash-2:#e2dfd2;
  --k-line-6:#e8e5d6;         /* unselected tip / tracker bar */
  --k-line-7:#d6d3c2;         /* tracker dot, not reached */
  --k-line-8:#dcd9c8;         /* carousel dot, off */
  --k-line-9:#e0ddcc;         /* chrome rule */

  /* status — "go" is a deeper teal-green so it can never be read as the accent */
  --k-go:#1e8f66;
  --k-go-ink:#15734f;
  --k-go-bg:#e7f4ee;
  --k-go-line:#c7e5d8;
  --k-go-ink-2:#0f5c3d;
  --k-go-ink-3:#3a7a62;
  --k-warn-ink:#7f5511;      /* 5.9:1 on the warn tint, 6.7:1 on paper */
  --k-warn-bg:#fdf2e2;
  --k-warn-bg-2:#fdf8ee;
  --k-warn-line:#f0dfc0;
  --k-info-ink:#1f4f9c;
  --k-info-bg:#eef3fd;
  --k-info-line:#cfe0f6;
  --k-bad:#c9453c;
  --k-bad-ink:#a83a32;
  --k-bad-bg:#fbeeec;
  --k-neutral-bg:#f0eee3;
  --k-neutral-ink:#5a5847;

  /* device chrome */
  --k-ios-blue:#007aff;
  --k-ios-blue-dim:#9cc9f7;
  --k-bezel:#17171a;
  --k-island:#0a0a0a;

  /* type */
  --k-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* motion */
  --k-press:transform .09s cubic-bezier(.2,.8,.3,1),opacity .12s;

/* ── resets ──────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{height:100%}
/* Lock the page to the VISIBLE viewport on a phone. `100dvh` tracks the area
   left after the browser's URL bar, so the bottom action bar can never sit
   behind it (the old `100vh` measured the tall viewport and pushed the bar off
   the bottom). overscroll-behavior kills the rubber-band that let the whole
   shell bounce and the address bar flicker while scrolling a round list. */
body{background:var(--k-desk);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--k-ink-1);
  overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;transition:var(--k-press)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{cursor:not-allowed}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none;width:100%}
textarea{resize:none}
a{color:var(--k-accent-text);text-decoration:none}
a:hover{color:var(--k-accent-ink)}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}
::placeholder{color:var(--k-placeholder)}
svg{display:block}

/* ── motion ──────────────────────────────────────────────────────────────── */
@keyframes qup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes qpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes qsheet{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes qtoast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes qpulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  @keyframes qup{from{opacity:0}to{opacity:1}}
  @keyframes qpop{from{opacity:0}to{opacity:1}}
  @keyframes qsheet{from{opacity:0}to{opacity:1}}
  @keyframes qtoast{from{opacity:0;transform:translate(-50%,0)}to{opacity:1;transform:translate(-50%,0)}}
  button:active:not(:disabled){transform:none}
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHELL — one build, three contexts. A real phone runs full-bleed (the device
   draws its own status bar and browser chrome); a desk-sized window shows the
   handset, because that is what the guest is actually holding.
   ═══════════════════════════════════════════════════════════════════════════ */
.q-page{min-height:100vh;min-height:100dvh;background:var(--k-white);display:block}
.q-page.is-framed{padding:40px 20px 48px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(178deg,#1b1e11 0%,#333a1e 26%,var(--k-desk) 62%,#7f8a52 100%)}
.q-frame{width:100%;margin:0 auto;height:100vh;height:100dvh;position:relative;background:var(--k-white);display:block}
.is-framed .q-frame{height:auto;flex-shrink:0;border-radius:56px;padding:11px;
  background:linear-gradient(148deg,#4a4a4d,var(--k-bezel) 42%,#424245);
  box-shadow:0 44px 90px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4)}
.q-screen{width:100%;height:100%;background:var(--k-white);overflow:hidden;display:flex;flex-direction:column;position:relative}
.is-framed .q-screen{border-radius:46px}
.q-island{display:none}
.q-cam{display:none}
.is-framed .q-island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:124px;height:35px;border-radius:20px;background:var(--k-island);display:block;z-index:5}
.is-framed .q-cam{position:absolute;top:34px;left:calc(50% + 40px);width:11px;height:11px;border-radius:50%;background:#16171b;box-shadow:inset 0 0 0 1.5px #0d0d0f;display:block;z-index:6}

/* status bar (framed only) */
.q-status{flex-shrink:0;height:54px;padding:16px 30px 0;display:flex;align-items:flex-start;justify-content:space-between;
  font-size:15.5px;font-weight:700;letter-spacing:-.02em;color:var(--k-ink)}
.q-status.is-over{color:var(--k-white);position:absolute;top:0;left:0;right:0;z-index:4;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.q-status-right{display:flex;align-items:flex-end;gap:6px;padding-top:2px}
.q-batt{width:23px;height:12px;border:1.4px solid rgba(0,0,0,.35);border-radius:3.5px;padding:1.6px;display:block}
.is-over .q-batt{border-color:rgba(255,255,255,.55)}
.q-batt>i{display:block;width:100%;height:100%;border-radius:1.6px;background:var(--k-ink)}
.is-over .q-batt>i{background:var(--k-white)}

/* scrolling body + footer bars */
/* The entry animation is applied by render() ONLY when the screen actually
   changes. Left on .q-body it re-fired on every background poll — the flash. */
.q-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.q-body.anim{animation:qup .2s}
.q-body.pad{padding:6px 22px 20px}
.q-bar{flex-shrink:0;border-top:1px solid var(--k-line-3);padding:14px 20px;display:flex;align-items:center;gap:12px;background:var(--k-white)}

/* ── primitives ──────────────────────────────────────────────────────────── */
.q-round{width:44px;height:44px;border-radius:50%;background:var(--k-white);display:grid;place-items:center;flex-shrink:0;box-shadow:0 3px 12px rgba(0,0,0,.10)}
.q-round.on-photo{box-shadow:0 4px 14px rgba(0,0,0,.22)}
.q-round.lg{width:46px;height:46px}
.q-step{width:34px;height:34px;border-radius:11px;background:var(--k-well);border:1px solid var(--k-line-2);display:grid;place-items:center;flex-shrink:0;color:var(--k-ink-2)}
.q-step.lg{width:40px;height:40px;border-radius:12px}
.q-card{border:1px solid var(--k-line-2);border-radius:14px;background:var(--k-white);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.q-h{font-size:17px;font-weight:700;color:var(--k-ink);letter-spacing:-.02em}
.q-h2{font-size:21px;font-weight:700;color:var(--k-ink);letter-spacing:-.03em}
.q-foot{font-size:11.5px;color:var(--k-mute-2);line-height:1.55;text-wrap:pretty}
.q-thumb{border-radius:11px;flex-shrink:0;display:block;background-size:cover;background-position:center;background-color:var(--k-photo-bg)}
.q-btn-solid{padding:15px 8px;border-radius:12px;background:var(--k-accent);color:var(--k-accent-ink);font-size:14.5px;font-weight:700;box-shadow:0 3px 10px var(--k-accent-glow);white-space:nowrap}
.q-btn-ghost{padding:15px 8px;border-radius:12px;border:1.4px solid var(--k-accent);color:var(--k-accent-text);font-size:14.5px;font-weight:700;background:var(--k-white);white-space:nowrap}
.q-btn-solid:disabled,.q-btn-ghost:disabled{opacity:.45}
.q-chip{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.q-row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;color:var(--k-ink-4)}
.q-row b{color:var(--k-ink-1);font-weight:500;font-family:var(--k-mono)}
.q-price{font-size:14px;font-weight:700;color:var(--k-accent-text);font-family:var(--k-mono)}
.q-num{font-variant-numeric:tabular-nums}

/* heat tag — a FACT about the dish. Always the word, never colour or a count of
   glyphs alone: a chilli icon reads differently in every market. */
.q-heat{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;
  font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.q-heat.on-photo{background:rgba(20,20,22,.82);color:#fff;padding:4px 9px;border-radius:8px}

/* modifier chips — the till's pills, carrying price and quantity */
.q-mod{display:inline-flex;align-items:stretch;border-radius:999px;border:1px solid var(--k-line-2);background:var(--k-well);overflow:hidden}
.q-mod.on{border-color:var(--k-accent-line);background:var(--k-accent-tint)}
.q-mod>button{padding:11px 16px;min-height:44px;font-size:14px;font-weight:600;color:var(--k-ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.q-mod>button.dec{padding:0 13px;border-left:1px solid var(--k-accent-line)}
.q-mod-p{font-size:12px;font-weight:600;color:var(--k-mute);font-family:var(--k-mono);white-space:nowrap}
.q-mod.on .q-mod-p{color:var(--k-accent-text)}
.q-mod-n{font-size:12.5px;font-weight:700;color:var(--k-accent-text);font-family:var(--k-mono)}

/* overlays */
.q-scrim{position:absolute;inset:0;background:rgba(15,10,9,.42);z-index:14;animation:qup .16s}
.q-sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--k-white);border-radius:26px 26px 0 0;
  padding:20px 22px 30px;box-shadow:0 -10px 40px rgba(0,0,0,.22);animation:qsheet .22s var(--k-sheet-ease)}
.is-framed .q-sheet{border-radius:26px 26px 46px 46px}
.q-sheet-act{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--k-line-2);background:var(--k-white);text-align:left;width:100%}
.q-sheet-ico{width:34px;height:34px;border-radius:50%;background:var(--k-accent-tint);display:grid;place-items:center;flex-shrink:0;color:var(--k-accent-text)}
.q-toast{position:absolute;left:50%;transform:translateX(-50%);max-width:300px;padding:12px 18px;border-radius:24px;
  background:rgba(20,20,22,.94);color:var(--k-white);font-size:13px;font-weight:500;text-align:center;line-height:1.4;
  z-index:20;animation:qtoast .18s;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* fake browser chrome (framed previews only) */
.q-chrome{flex-shrink:0;background:var(--k-chrome);display:flex;flex-direction:column}
.q-chrome-url{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-top:1px solid var(--k-line-9)}
.q-chrome-tabs{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:var(--k-ios-blue)}
.q-chrome-home{height:24px;display:grid;place-items:center}
.q-chrome-home>span{width:138px;height:5px;border-radius:3px;background:var(--k-ink);display:block}
</style>

    var lv = Number(m && m.spice) || 0;

    var L = this.heatLevels().filter(function (x) { return x.id === id; })[0];

  };
  App.prototype.addonLabel = function (m, sel) {
    var list = this.addonsFor(m);
    return Object.keys(sel || {}).filter(function (k) { return sel[k] > 0; }).map(function (k) {
      var a = list.filter(function (x) { return x.k === k; })[0];
      return a ? (a.n + (sel[k] > 1 ? ' ×' + sel[k] : '')) : '';

  };

  /* ── banners ─────────────────────────────────────────────────────────────── */
  /* Authored in the POS merchant portal and published to the phone. The bundled
     list is the fallback for a phone that has never seen a terminal — a scan
     should never open to a dead slot. Off means the header runs straight into
     the menu: no empty frame, no placeholder. */
  App.prototype.banners = function () {
    if (this.cfg.showBanner === false) return [];
    var live = this.A.banners ? this.A.banners() : null;
    var list = live == null ? (this.D.BANNERS || []) : live;
    var oid = Number(this.cfg.outletId) || 3;
    return list.filter(function (b) { return b && b.active !== false && (!b.outlet || b.outlet === oid); });
  };
  App.prototype.validCodes = function () {
    if (this.A.promoCodes) return this.A.promoCodes().map(function (c) { return String(c).toUpperCase(); });
    return this.banners().map(function (x) { return (x.code || '').toUpperCase(); }).filter(Boolean);
  };

  /* ── the table: POS ticket when there is one, our rounds when there isn't ──
     The ticket is the truth, but not the whole truth the moment a round is
     sent: until a terminal ingests it, the till knows nothing about it. So the
     bill is POS lines PLUS any sent round the ticket does not yet account for,
     matched on item + note and topped up by the difference. Never understate
     what the guest has already ordered. */
  App.prototype.tableLines = function () {
    var tk = this.A.ticket ? this.A.ticket() : null;
    var posRows = ((tk && tk.lines) || []).map(function (l) {
      var note = l.note || '', mine = note.indexOf('QR') === 0;
      return {
        id: l.id, qty: l.qty, note: note, opt: mine ? note.replace(/^QR( · )?/, '') : note,
        mine: mine, fired: !!l.fired, source: 'pos'
      };
    });
    // Credit the phone's sent rounds against till lines by product id (see
    // lineStages): a line the till has already taken isn't also shown pending.
    var credit = {};
    posRows.forEach(function (r) { if (r.mine) credit[r.id] = (credit[r.id] || 0) + r.qty; });
    var pending = [];
    this.s.sent.forEach(function (r) {
      r.lines.forEach(function (l) {
        var have = credit[l.id] || 0;
        if (have >= l.qty) { credit[l.id] = have - l.qty; return; }
        credit[l.id] = 0;
        var bits = [l.opt, l.note].filter(Boolean).join(' · ');
        pending.push({ id: l.id, qty: l.qty - have, note: 'QR' + (bits ? ' · ' + bits : ''), opt: bits, mine: true, fired: false, source: 'guest' });
      });
    });
    return posRows.concat(pending);
  };
  App.prototype.tableSub = function () {
    var self = this;
    return this.tableLines().reduce(function (a, l) {
      var m = self.item(l.id);
      return a + (m ? self.price(m) * l.qty : 0);
    }, 0);
  };
  App.prototype.billTotal = function () { return this.bill(this.tableSub() + this.cartSub()).total; };

  /* ── order status ────────────────────────────────────────────────────────────
     Four honest stages, each read from something the till actually records:
       0 sent      on the bridge, no terminal has taken it
       1 at till   on the ticket, not fired
       2 kitchen   fired (firedAt starts the clock)
       3 served    done  (a cook bumped it off the pass)
     Nothing is guessed: an unknown line stays at "sent" rather than claiming
     progress the kitchen never reported. */
  App.prototype.sla = function () { return (this.A.prefs && this.A.prefs().kdsSla) || 18; };
  App.prototype.lineStages = function () {
    /* Match each sent line to a live till line by PRODUCT ID (consuming one per
       match). The till rebuilds the kitchen note from add-ons/heat/comment, so
       an exact note-key match is fragile — the id + quantity of a QR table's
       lines are exactly this phone's rounds, so id-matching reflects status
       reliably. */
    var tk = this.A.ticket ? this.A.ticket() : null, pool = {};
    ((tk && tk.lines) || []).forEach(function (l) {
      (pool[l.id] = pool[l.id] || []).push(l);

    var map = {};
    this.s.sent.forEach(function (r) {
      r.lines.forEach(function (l, i) {
        var hit = (pool[l.id] || []).shift();
        map[r.id + '|' + i] = {
          // 0 sent · 1 received at the till · 2 preparing · 3 ready · 4 served —
          // the same four states the till moves an order through.
          stage: hit ? (hit.done ? 4 : hit.ready ? 3 : hit.fired ? 2 : 1) : 0,
          firedAt: hit ? (hit.firedAt || 0) : 0
        };
      });
    });
    return map;
  };
  App.prototype.stageName = function (n) {
    return ['Sent to the floor', 'Received at the till', 'Preparing', 'Ready', 'Served'][n] || 'Sent to the floor';
  };

  /* ── persistence ─────────────────────────────────────────────────────────── */
  App.prototype.save = function () {
    if (!this.A.saveSession) return;
    var s = this.s;

      v: 2, at: Date.now(), table: this.table(), outlet: this.cfg.outletId,
      cart: s.cart, sent: s.sent, promo: s.promo, applied: s.applied, lang: s.lang, screen: s.screen,
      tender: s.tender, tip: s.tip, settling: s.settling, paid: s.paid

  };
  App.prototype.restore = function () {
    if (!this.A.loadSession) return;
    var d = this.A.loadSession();
    if (!d || d.v !== 2) return;
    /* A different table is a fresh session, not a resumed one. */
    if (d.table !== this.table() || d.outlet !== this.cfg.outletId) return;
    /* A settled ticket belongs to the party that just left. Resuming it would
       show the next guest someone else's receipt, so a paid session is only
       resumed briefly — long enough that paying then reloading still works. */
    if (d.paid && Date.now() - (d.at || 0) > 5400000) return;
    Object.assign(this.s, {
      cart: d.cart || [], sent: d.sent || [], promo: d.promo || '',
      applied: !!d.applied, lang: d.lang || 'en',
      tender: d.tender || '', tip: d.tip || 0, settling: d.settling || null, paid: d.paid || null,
      screen: d.screen === 'dish' ? 'menu' : (d.screen || 'menu')
    });
  };

  /* ── lifecycle ───────────────────────────────────────────────────────────── */
  App.prototype.bind = function () {
    var self = this;
    this.root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      self.act(el.getAttribute('data-act'), el.dataset);
    });
    this.root.addEventListener('input', function (e) {
      var f = e.target.getAttribute('data-field');
      if (!f) return;
      if (f === 'q') { self.s.q = e.target.value; self.render(); }
      if (f === 'note') { self.s.note = e.target.value; }
      if (f === 'promo') { self.s.promo = e.target.value; self.s.applied = false; self.s.promoErr = ''; self.render(); }
    });
    this._unsub = this.A.subscribe ? this.A.subscribe(function () { self.pull(); }) : null;
    /* The wait clock keeps counting even when nothing on the till moves — but
       only the status screen shows elapsed time, so a tick anywhere else would
       just rebuild an identical menu/bill string every 20s and burn a phone's
       battery. Render on tick only when it can change something. */
    this._tock = setInterval(function () { if (self.s.screen !== 'sent') return; self.s.tick++; self.render(); }, 20000);
    this._rot = setInterval(function () {

           A height-only change is the mobile browser hiding/showing its URL bar
           as the guest scrolls — re-rendering on that stutters the scroll for
           no visual gain, so skip it. The shell height is CSS `100dvh` now, so

  /* Settlement is the till's call, and the till says so by closing the ticket:

  App.prototype.pull = function () {

    }

       per acknowledgement, not on every 5s poll. */

      else if (t2.billAck && !was.bill) this.toast('A cashier is on the way with your bill');
      else if (t2.settled && !was.settled) this.toast('Bill settled — thank you');
    }

  };

  /* ── intents ─────────────────────────────────────────────────────────────── */
  App.prototype.push = function (kind, detail, extra) {
    var intent = Object.assign({ kind: kind, detail: detail || '' }, extra || {});
    return this.A.push ? !!this.A.push(intent) : false;
  };
  App.prototype.toast = function (msg) {
    var self = this;

    clearTimeout(this._tt);
    this._tt = setTimeout(function () { self.s.toast = null; self.render(); }, 2600);
  };

  App.prototype.act = function (a, d) {
    var s = this.s, self = this;
    switch (a) {
      case 'menu': s.screen = 'menu'; break;
      case 'order': s.screen = 'order'; break;
      case 'sent': s.screen = 'sent'; s.sheet = false; break;
      case 'bill':
        /* Asking for the bill opens the bill AND flags the floor terminal so a
           server knows this table wants to settle (the guest still picks how to
           pay on the next screen, which sends the tender). */
        if (this.s.sent.length) this.push('bill', 'Table ' + this.table() + ' asked for the bill · ' + this.money(this.billTotal()));
        s.screen = 'bill'; s.sheet = false;
        if (this.s.sent.length) this.toast('Your bill is ready — a server has been notified');
        break;
      case 'back-bill': s.screen = s.sent.length ? 'sent' : 'menu'; break;
      case 'sheet': s.sheet = true; break;
      case 'sheet-close': s.sheet = false; break;
      case 'veg': s.vegOnly = !s.vegOnly; break;
      case 'noheat': s.noHeat = !s.noHeat; break;
      case 'heat': s.heat = (d.k === s.heat ? '' : d.k); break;
      case 'cat': s.cat = d.id; break;
      case 'banner': s.banner = Number(d.i); break;
      case 'lang':
        s.lang = s.lang === 'en' ? 'dv' : 'en';
        return this.toast(s.lang === 'en' ? 'English' : 'Dhivehi — ދިވެހި');
      case 'dish': {
        var sold = this.soldOut().indexOf(d.id) >= 0;
        if (sold) return this.toast((this.item(d.id) || {}).name + ' is off the menu tonight');
        Object.assign(s, { screen: 'dish', dishId: d.id, dQty: 1, addons: {}, note: '' });
        break;
      }
      case 'qty': s.dQty = Math.max(1, s.dQty + Number(d.d)); break;
      case 'addon': {
        var q = (s.addons[d.k] || 0) + Number(d.d);

      case 'bump': {

      case 'promo-take':

      case 'banner-info': return this.toast(d.title + ' — ask your server for details');
      case 'place': return this.placeOrder(false);
      case 'place-pay': return this.placeOrder(true);

      case 'tender': s.tender = d.k; break;

        return this.toast('A server will split the bill with you');
      case 'call':

        s.sheet = false;
        return this.toast('A server is on the way');
      default: return;
    }
    this.render();
  };

  App.prototype.applyPromo = function () {
    var s = this.s, code = s.promo.trim().toUpperCase();
    if (code.length < 3) {
      s.applied = false; s.promoErr = 'Enter the code from your receipt or table card';
      return this.render();
    }
    /* The only valid codes are the ones the merchant is currently advertising on
       this outlet. No hardcoded fallback: a code that is not published is not
       a code. */
    var good = this.validCodes().indexOf(code) >= 0;
    s.applied = good;
    s.promoErr = good ? '' : 'That code is not valid at ' + this.outlet().name;
    this.toast(good ? 'Promo applied — 5% off' : 'Code not recognised');
  };

  App.prototype.addToOrder = function () {
    var s = this.s, m = this.cur();
    /* heat is part of the key: a mild and a hot one of the same dish are two
       ticket lines, not one line of two. */
    var label = this.optLabel(m, s.addons, s.heat);
    var key = m.id + '|' + label + '|' + s.note.trim();
    var cart = s.cart.slice();
    var ex = cart.filter(function (l) { return l.key === key; })[0];
    if (ex) cart[cart.indexOf(ex)] = Object.assign({}, ex, { qty: ex.qty + s.dQty });
    else cart.push({ key: key, id: m.id, qty: s.dQty, addons: Object.assign({}, s.addons), heat: s.heat, note: s.note.trim() });
    var added = this.lineTotal({ id: m.id, qty: s.dQty, addons: s.addons });
    Object.assign(s, { cart: cart, screen: 'menu', dQty: 1, addons: {}, heat: '', note: '' });
    this.toast(m.name + ' added — ' + this.fmt(added));
  };

  /* One round = one KOT. Lines carry the guest's own note text plus a QR tag so
     the floor can see at a glance which lines the table rang themselves. */
  App.prototype.placeOrder = function (pay) {
    var s = this.s, self = this;
    if (!s.cart.length) return this.toast('Add a dish first');
    var lines = s.cart.map(function (l) {
      var m = self.item(l.id);
      var bits = [self.optLabel(m, l.addons, l.heat), l.note].filter(Boolean).join(' · ');
      /* Structured picks so the till prices each add-on itself (one entry per
         unit chosen); the chosen heat + free-text note ride alongside as the
         kitchen note. `disp` keeps the "QR · …" label the local round shows. */
      var picks = [];
      Object.keys(l.addons || {}).forEach(function (k) {
        for (var i = 0; i < (l.addons[k] || 0); i++) picks.push({ name: k });
      });
      var comment = [self.heatLabel(l.heat), (l.note || '').trim()].filter(Boolean).join(' · ');
      return { id: l.id, qty: l.qty, addons: picks, comment: comment,
        note: 'QR' + (bits ? ' · ' + bits : ''), disp: bits };
    });
    var n = s.cart.reduce(function (a, l) { return a + l.qty; }, 0);
    /* The discount is part of the order, not a display trick: it rides the same
       row as the lines so the till settles on the figure the guest was shown. */
    var code = this.promoOk() ? s.promo.trim().toUpperCase() : '';

      n + ' item' + (n === 1 ? '' : 's') + ' · ' + this.money(this.cartSub()) + (code ? ' · promo ' + code + ' 5%' : ''),
      Object.assign({ lines: lines, total: this.cartSub() }, code ? { promo: code, pct: 5 } : {}));
    var round = {
      id: 'r' + Date.now(), at: Date.now(), pay: !!pay,
      lines: s.cart.map(function (l) {
        return {
          id: l.id, qty: l.qty, opt: self.addonLabel(self.item(l.id), l.addons),
          note: l.note, total: self.lineTotal(l)
        };
      })
    };
    s.sent = s.sent.concat([round]); s.cart = []; s.screen = 'sent'; s.sheet = false;
    if (pay) this.push('bill', 'Pay at the table · ' + this.money(this.billTotal()) + (code ? ' · promo ' + code + ' 5%' : ''),
      code ? { promo: code, pct: 5 } : {});

      ? (pay ? 'Order sent — a server is bringing the card machine' : 'Order sent to the kitchen')
      : 'Order saved on this phone — it will send when the connection returns');
  };

  App.prototype.tipOn = function () {
    if (this.cfg.showTipLine != null) return !!this.cfg.showTipLine;

  App.prototype.tipAmt = function (sub) { return this.tipOn() ? sub * (this.s.tip / 100) : 0; };

  };
  App.prototype.confirmPay = function () {
    var s = this.s;

    var due = T.total + this.tipAmt(T.sub);
    var code = this.promoOk() ? s.promo.trim().toUpperCase() : '';

      Object.assign({ tender: s.tender, tip: s.tip, due: due, ref: ref }, code ? { promo: code, pct: 5 } : {}));

  };

  /* ── shell metrics ───────────────────────────────────────────────────────── */
  App.prototype.metrics = function () {
    var vw = this.s.vw, vh = this.s.vh, shell = this.cfg.shell || 'auto';
    /* A desk-sized window is someone reviewing the design, so show the handset;

    var scr = framed ? (vw >= 1180 ? 430 : 392) : Math.min(vw, 720);
    return {
      framed: framed, bare: !framed, scr: scr,
      h: framed ? Math.min(846, Math.max(660, vh - 96)) : vh,
      cols: !framed && scr >= 600 ? 3 : 2

  };

  /* ═══════════════════════════════════════════════════════════════════════════

     ═══════════════════════════════════════════════════════════════════════════ */
  App.prototype.render = function () {
    var M = this.metrics(), s = this.s;
    var frameStyle = M.framed
      ? 'width:' + (M.scr + 22) + 'px;height:' + (M.h + 22) + 'px'
      : 'max-width:' + M.scr + 'px';

       in the background (the till, the banner carousel, the wait clock); firing
       qup on each of them read as a flash every couple of seconds. */
    var moved = this._screen !== s.screen;

    var html =
      '<div class="q-page' + (M.framed ? ' is-framed' : '') + '">' +
        '<div class="q-frame" style="' + frameStyle + '">' +
          '<div class="q-screen">' +
            this.vStatus(M) +
            this.vScreen(M, moved) +
            this.vBar(M) +
            this.vChrome(M) +
            (s.sheet ? '<div class="q-scrim" data-act="sheet-close"></div>' + this.vSheet(M) : '') +
            (s.toast ? '<div class="q-toast" style="bottom:' + (M.bare ? 96 : 150) + 'px">' + esc(s.toast.msg) + '</div>' : '') +
          '</div>' +
          '<span class="q-island"></span><span class="q-cam"></span>' +
        '</div>' +
      '</div>';

    /* A poll that changed nothing must not touch the DOM at all: rebuilding
       identical markup repaints every photo and drops the scroll position. */
    if (html === this._html) return;

  /* ── SENT / TRACKER ──────────────────────────────────────────────────────── */
  App.prototype.vSent = function () {

    var nOf = function (n) { return n === total ? ('All ' + (total === 1 ? 'item' : total + ' items')) : (n + ' of ' + total + ' items'); };

        '<span style="font-size:13.5px;font-weight:700;color:var(--k-ink);letter-spacing:-.01em">Your order · Table ' + esc(this.table()) + '</span>' +

          '<span style="font-size:13.5px;font-weight:700;color:var(--k-go-ink-2)">Settled — thank you. Your bill has been paid at the till.</span></div>';
        if (tk.billAck) return '<div style="margin:6px 0 2px;display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:14px;background:var(--k-info-bg);border:1px solid var(--k-info-line);animation:qpulse 1.8s ease-in-out infinite">' +

    var tl = this.tableLines();
    var T = this.bill(this.tableSub() + this.cartSub());
    var tipAmt = this.tipAmt(T.sub), due = T.total + tipAmt;
    var paid = s.paid, settling = s.settling, ok = this.promoOk();

    var h = '<div class="q-body pad">' +
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<button class="q-round" data-act="back-bill">' + svg(I.back, { s: 19, c: C, w: 2.4 }) + '</button>' +
        '<span class="q-h2" style="flex:1;text-align:right">' + (paid ? 'Receipt' : 'Your Bill') + '</span>' +
      '</div>';

    if (paid) {
      h += '<div style="margin-top:16px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--k-go-bg);border:1px solid var(--k-go-line);animation:qpop .2s">' +
        '<span style="width:34px;height:34px;border-radius:50%;background:var(--k-go);display:grid;place-items:center;flex-shrink:0">' +
          svg(I.tick, { s: 18, c: '#fff', w: 3.2 }) + '</span>' +
        '<span style="display:block">' +
          '<span style="display:block;font-size:14.5px;font-weight:700;color:var(--k-go-ink-2)">Settled — thank you</span>' +
          '<span style="display:block;font-size:12.5px;color:var(--k-go-ink-3);margin-top:2px">' +
            this.money(paid.total) + ' · ' + ({ card: 'card', cash: 'cash', wallet: 'transfer' }[paid.tender] || 'paid') + ' · ref ' + esc(paid.ref) + '</span>' +
        '</span></div>';
    }

    /* receipt card */
    h += '<div class="q-card" style="margin-top:18px;border-radius:16px;overflow:hidden">' +
      '<div style="padding:16px 16px 14px;border-bottom:1px dashed var(--k-line-dash);text-align:center">' +
        '<div style="font-size:15px;font-weight:800;color:var(--k-ink);letter-spacing:.02em">' + esc(o.name) + '</div>' +
        '<div style="font-size:11.5px;color:var(--k-mute);margin-top:4px;line-height:1.5">' + esc((o.addr || '') + ' · ' + (o.region || '')) + '</div>' +
        '<div class="q-num" style="font-size:11px;color:var(--k-mute-3);margin-top:4px">' + esc('TIN ' + (K.tin || '') + ' · ' + o.code) + '</div>' +
      '</div>' +
      '<div class="q-num" style="padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 18px;border-bottom:1px dashed var(--k-line-dash);font-size:11.5px;color:var(--k-ink-7)">' +
        '<span>' + esc(this.billRef()) + '</span><span>Table ' + esc(this.table()) + '</span>' +
        '<span>' + new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' · ' + this.clock() + '</span>' +
      '</div>' +
      '<div style="padding:6px 16px 12px">' +
      tl.map(function (l) {
        var m = self.item(l.id) || { name: 'Item' };
        var unit = self.price(m);
        var opt = l.mine ? (l.opt || '') : (l.opt || 'Rung by your server');
        return '<div style="display:flex;align-items:flex-start;gap:12px;padding-top:11px">' +
          '<span style="flex:1;min-width:0;display:block">' +
            '<span style="display:block;font-size:13.5px;font-weight:600;color:var(--k-ink-1);line-height:1.35">' + esc(m.name) + '</span>' +
            ((l.mine ? !!l.opt : true) ? '<span style="display:block;font-size:11.5px;color:var(--k-mute);margin-top:2px;line-height:1.4">' + esc(opt) + '</span>' : '') +
          '</span>' +
          '<span class="q-num" style="font-size:12.5px;color:var(--k-mute);flex-shrink:0;padding-top:1px">' + l.qty + ' × ' + self.fmt(unit).replace('MVR ', '') + '</span>' +
          '<span class="q-num" style="font-size:13.5px;font-weight:600;color:var(--k-ink-1);flex-shrink:0;min-width:74px;text-align:right">' + self.money(unit * l.qty) + '</span>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="q-num" style="padding:14px 16px;border-top:1px dashed var(--k-line-dash);display:flex;flex-direction:column;gap:10px">' +
        '<div class="q-row" style="font-size:13.5px"><span>Subtotal</span><b>' + this.money(T.sub) + '</b></div>' +
        '<div class="q-row" style="font-size:13.5px"><span>Service charge (' + (o.sc || 0) + '%)</span><b>' + this.money(T.svc) + '</b></div>' +
        '<div class="q-row" style="font-size:13.5px"><span>' + o.tax + ' (' + o.rate + '%)</span><b>' + this.money(T.tax) + '</b></div>' +
        (ok ? '<div class="q-row" style="font-size:13.5px"><span>Promo ' + esc(s.promo.trim().toUpperCase() || 'code') + ' (5%)</span><b>−' + this.money(T.disc) + '</b></div>' : '') +
        (tipAmt > 0 ? '<div class="q-row" style="font-size:13.5px"><span>Tip (' + s.tip + '%)</span><b>' + this.money(tipAmt) + '</b></div>' : '') +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-top:1px solid var(--k-line-3);padding-top:12px">' +
          '<span style="font-size:14px;font-weight:600;color:var(--k-ink-1)">Total due</span>' +
          '<span style="font-size:22px;font-weight:800;color:var(--k-accent-text);font-family:var(--k-mono);letter-spacing:-.03em">' + this.money(due) + '</span>' +
        '</div>' +
      '</div></div>';

    /* tip */
    if (this.tipOn() && !paid) {
      h += '<div style="margin-top:22px">' +
        '<div style="font-size:15px;font-weight:700;color:var(--k-ink);letter-spacing:-.02em">Add a tip?</div>' +
        '<div style="font-size:12px;color:var(--k-mute);margin-top:4px;line-height:1.5;text-wrap:pretty">The ' + (o.sc || 0) + '% service charge is already shared with the team. A tip is entirely optional.</div>' +
        '<div style="margin-top:12px;display:flex;gap:8px">' +
        [0, 5, 10, 15].map(function (p) {
          var on = s.tip === p;
          return '<button data-act="tip" data-p="' + p + '" style="flex:1;padding:11px 6px;border-radius:12px;font-size:13.5px;font-weight:600;white-space:nowrap;border:1.3px solid ' +
            (on ? C : 'var(--k-line-6)') + ';background:' + (on ? 'var(--k-accent-tint-2)' : 'var(--k-white)') +
            ';color:' + (on ? C : 'var(--k-ink-5)') + '">' + (p ? p + '%' : 'No tip') + '</button>';
        }).join('') + '</div></div>';
    }

    /* tender */
    if (!paid) {
      var tenders = [
        { k: 'card', label: 'Card at the table', sub: 'Your server brings the terminal', icon: I.card },
        { k: 'cash', label: 'Cash', sub: 'Pay your server directly', icon: I.cash },
        { k: 'wallet', label: 'Bank transfer', sub: 'Scan the merchant QR on the receipt', icon: I.bank }
      ];
      h += '<div style="margin-top:24px">' +
        '<div class="q-h">How would you like to pay?</div>' +
        '<div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">' +
        tenders.map(function (t) {
          var on = s.tender === t.k;
          return '<button data-act="tender" data-k="' + t.k + '" style="display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1.4px solid ' +
            (on ? C : 'var(--k-line-2)') + ';background:' + (on ? 'var(--k-accent-tint-3)' : 'var(--k-white)') + ';box-shadow:0 2px 8px rgba(0,0,0,.04)">' +
            '<span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:' +
              (on ? C : 'var(--k-accent-tint)') + ';color:' + (on ? 'var(--k-white)' : C) + '">' + svg(t.icon, { s: 18 }) + '</span>' +
            '<span style="flex:1;display:block;text-align:left">' +
              '<span style="display:block;font-size:14.5px;font-weight:600;color:var(--k-ink-1)">' + t.label + '</span>' +
              '<span style="display:block;font-size:12px;color:var(--k-mute);margin-top:2px">' + t.sub + '</span>' +
            '</span>' +
            (on ? '<span style="width:22px;height:22px;border-radius:50%;flex-shrink:0;place-items:center;background:' + C + ';display:grid">' + svg(I.tick, { s: 12, c: 'var(--k-accent-ink)', w: 3.4 }) + '</span>' : '') +
          '</button>';
        }).join('') + '</div></div>';
    }

    if (settling) {
      h += '<div style="margin-top:18px;display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:14px;background:var(--k-warn-bg-2);border:1px solid var(--k-warn-line);color:var(--k-warn-ink)">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:var(--k-warn-ink);display:block;flex-shrink:0;animation:qpulse 1.4s ease-in-out infinite;margin-top:5px"></span>' +
        '<span style="display:block;font-size:12.5px;line-height:1.5;text-wrap:pretty">' +
          esc(({ card: 'Card machine on its way', cash: 'A server is coming to take cash', wallet: 'A server will confirm your transfer' }[settling.tender] || 'A server is on the way') +
            ' · ' + this.money(settling.total) + ' · ref ' + settling.ref) + '</span></div>';
    }

    h += '<div class="q-foot" style="margin-top:16px">' + esc(paid
      ? 'A tax invoice for this ticket is printed at the counter. ' + ((K.brand && K.brand.receiptFoot) || 'Thank you')
      : 'This is a preview of your bill. It becomes a tax invoice when the till settles it — the figures here already match the terminal to the laari.') + '</div>';

    return h + '</div>';
  };

  /* ── footer bars, one per screen ─────────────────────────────────────────── */
  App.prototype.vBar = function () {
    var s = this.s, C = 'var(--k-accent)';
    var nCart = s.cart.reduce(function (a, l) { return a + l.qty; }, 0);

    if (s.screen === 'menu') {
      var tl = this.tableLines();
      if (!nCart && !tl.length) return '';
      var T = this.bill(this.tableSub() + this.cartSub());
      /* One line each, no wrapping: this bar sits over the menu and must never
         grow. The exact bill to the laari lives on the order screen. */
      var line = nCart
        ? nCart + ' item' + (nCart === 1 ? '' : 's') + ' · '
        : 'Table ' + this.table() + ' · ';
      var lineAmt = this.fmt(nCart ? this.cartSub() : T.total);
      var sub = nCart ? 'Not sent yet' : tl.length + ' item' + (tl.length === 1 ? '' : 's') + ' ordered';
      if (!nCart && s.sent.length) {
        var stages = this.lineStages();
        var all = Object.keys(stages).map(function (k) { return stages[k]; });
        var total = all.length;
        var reached3 = all.filter(function (x) { return x.stage >= 3; }).length;
        var cooking = all.filter(function (x) { return x.stage === 2 && x.firedAt; });
        var stageNow = total ? Math.min.apply(null, all.map(function (x) { return x.stage; })) : 0;
        var waited = cooking.length ? Math.max.apply(null, cooking.map(function (x) { return (Date.now() - x.firedAt) / 60000; })) : 0;
        var left = Math.max(0, Math.ceil(this.sla() - waited));
        sub = reached3 === total ? 'All served'
          : cooking.length ? ('Cooking' + (left === 0 ? '' : ' · ~' + left + ' min'))
          : stageNow >= 1 ? 'At the till' : 'On its way';
      }
      return '<div style="flex-shrink:0;padding:10px 20px 14px;background:var(--k-white);border-top:1px solid var(--k-line-5)">' +
        '<button data-act="order" style="width:100%;height:56px;border-radius:28px;background:' + C + ';color:var(--k-accent-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px 0 20px;box-shadow:0 8px 22px var(--k-accent-glow-lg)">' +
          '<span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left">' +
            '<span style="display:block;max-width:100%;font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(line) +
              '<span style="font-family:var(--k-mono)">' + esc(lineAmt) + '</span></span>' +
            '<span style="display:block;max-width:100%;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(sub) + '</span>' +
          '</span>' +
          '<span style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border-radius:22px;padding:9px 13px;font-size:13.5px;font-weight:600;flex-shrink:0;white-space:nowrap">View order' +
            svg(I.arrow, { s: 15, c: '#fff', w: 2.6 }) + '</span>' +
        '</button></div>';
    }

    if (s.screen === 'dish') {
      var d = this.cur();
      return '<div class="q-bar" style="padding:14px 22px;justify-content:space-between">' +
        '<span style="display:block">' +
          '<span style="display:block;font-size:14px;font-weight:600;color:var(--k-accent-text)">Total:</span>' +
          '<span style="display:block;font-size:16px;font-weight:700;color:var(--k-accent-text);font-family:var(--k-mono);letter-spacing:-.02em;margin-top:2px">' +
            this.fmt((this.price(d) + this.addonSum(d, s.addons)) * s.dQty) + '</span>' +
        '</span>' +
        '<button class="q-btn-solid" data-act="add" style="padding:14px 28px">Add to orders</button></div>';
    }

    if (s.screen === 'order') {
      var dis = nCart ? '' : ' disabled';
      return '<div class="q-bar">' +
        '<button class="q-btn-ghost" data-act="place-pay" style="flex:1"' + dis + '>Order &amp; Pay Now</button>' +
        '<button class="q-btn-solid" data-act="place" style="flex:1.15"' + dis + '>Order Now</button></div>';
    }

    if (s.screen === 'sent') {
      return '<div class="q-bar">' +
        '<button class="q-btn-ghost" data-act="menu" style="flex:1">Add more items</button>' +
        '<button class="q-btn-solid" data-act="bill" style="flex:1.15">Ask for the bill</button></div>';
    }

    if (s.screen === 'bill') {
      var dz = (!s.tender || !!s.settling || !!s.paid) ? ' disabled' : '';
      return '<div class="q-bar">' +
        '<button class="q-btn-ghost" data-act="split" style="flex:1">Split the bill</button>' +
        '<button class="q-btn-solid" data-act="confirm-pay" style="flex:1.35"' + dz + '>' +
          (s.paid ? 'Paid' : s.settling ? 'Server on the way…' : 'Confirm &amp; call server') + '</button></div>';
    }
    return '';
  };

  /* ── table sheet ─────────────────────────────────────────────────────────── */
  App.prototype.vSheet = function () {
    var s = this.s, o = this.outlet(), K = this.D.CHAIN, C = 'var(--k-accent)';
    var T = this.bill(this.tableSub() + this.cartSub());
    var stages = this.lineStages();
    var all = Object.keys(stages).map(function (k) { return stages[k]; });
    var stageNow = all.length ? Math.min.apply(null, all.map(function (x) { return x.stage; })) : 0;
    var cooking = all.filter(function (x) { return x.stage === 2 && x.firedAt; });
    var waited = cooking.length ? Math.max.apply(null, cooking.map(function (x) { return (Date.now() - x.firedAt) / 60000; })) : 0;
    var left = Math.max(0, Math.ceil(this.sla() - waited));
    var ordersHint = s.sent.length
      ? s.sent.length + ' round' + (s.sent.length === 1 ? '' : 's') + ' · ' + this.stageName(stageNow) + (cooking.length && left > 0 ? ' · ~' + left + ' min' : '')
      : 'Nothing sent yet';
    var live = this.A.live ? this.A.live() : false;

    var act = function (a, icon, title, sub) {
      return '<button class="q-sheet-act" data-act="' + a + '">' +
        '<span class="q-sheet-ico">' + (icon.charAt(0) === '<' ? icon : svg(icon)) + '</span>' +
        '<span style="flex:1;display:block">' +
          '<span style="display:block;font-size:14.5px;font-weight:600;color:var(--k-ink-1)">' + title + '</span>' +
          '<span style="display:block;font-size:12px;color:var(--k-mute);margin-top:2px">' + esc(sub) + '</span>' +
        '</span></button>';
    };

    return '<div class="q-sheet">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<span style="display:block">' +
          '<span class="q-h" style="display:block">Table ' + esc(this.table()) + '</span>' +
          '<span style="display:block;font-size:12.5px;color:var(--k-mute);margin-top:3px">' +
            esc('Session QR-' + o.code + '-' + this.table() + ' · scanned at ' + this.clock()) + '</span>' +
        '</span>' +
        '<button data-act="sheet-close" style="width:34px;height:34px;border-radius:50%;background:var(--k-well);display:grid;place-items:center;flex-shrink:0">' +
          svg(I.close, { s: 16, c: '#6a6a6f', w: 2.4 }) + '</button>' +
      '</div>' +
      '<div style="margin-top:16px;display:flex;flex-direction:column;gap:9px">' +
        act('call', I.bell, 'Call a server', 'A raised hand shows on the floor terminal') +
        act('bill', I.doc, 'Ask for the bill', 'Total so far ' + this.money(T.total)) +
        act('sent', I.lines, 'My orders', ordersHint) +
        act('lang', GLOBE, s.lang === 'en' ? 'Language · English' : 'ބަސް · ދިވެހި', 'Menu names stay in English') +
      '</div>' +
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--k-line-4);display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        '<span style="font-size:11px;color:var(--k-mute-3);letter-spacing:.05em">' +
          esc((K.brand && K.brand.poweredBy) ? 'Powered by KashikeyoPOS™' : K.name) + '</span>' +
        '<span style="display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:' +
          (live ? 'var(--k-go-ink)' : 'var(--k-warn-ink)') + '">' + (live ? 'Till connected' : 'Offline — saved on this phone') + '</span>' +
      '</div></div>';
  };

  /* ── mount ───────────────────────────────────────────────────────────────── */
  function mount(el, opts) {
    var target = typeof el === 'string' ? document.querySelector(el) : el;
    var cfg = Object.assign({
      outletId: 3, table: 9, host: 'order.kashikeyo.mv', greeting: '', shell: 'auto',
      showBanner: true, showTipLine: null, showBrowserChrome: true, imageBase: 'img/'
    }, window.KASHIKEYO_QR || {}, opts || {});
    cfg.data = cfg.data || window.KASHIKEYO_QR_SEED;
    cfg.adapter = Object.assign(defaultAdapter(cfg), cfg.adapter || {});
    return new App(target, cfg);
  }

  return { mount: mount, App: App, defaultAdapter: defaultAdapter };
})();

/* Auto-mount when the file is served as its own page. Importing it into an
   existing app? Delete these two lines and call mount() yourself. */
if (document.getElementById('kashikeyo-qr')) {
  window.__kashikeyoQR = window.KashikeyoGuestQR.mount('#kashikeyo-qr');
}
</script>
