<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>KashikeyoPOS — Terminal (v2 build)</title>
<style>
/* ── Design tokens: verbatim from the handoff prototype (KashikeyoPOS.dc.html).
      Dark by default; [data-theme="light"] is the daylight variant. ───────── */
:root{
  --bg:#0e0f11; --bg-0:#121417; --bg-1:#15171a; --bg-2:#1b1e22; --bg-3:#24282e;
  --line-soft:#22262b; --line:#2a2f36; --line-2:#363c44; --line-3:#3d4249;
  --text:#f2ede2; --text-dim:#a8a79f; --text-muted:#6b6e74; --text-faint:#585b61;
  --amber:#f2a43a; --amber-bright:#ffb84a; --amber-dim:#3a2a12; --amber-line:#6b4a1f; --amber-deep:#c4761e;
  --on-amber:#1a0f00;
  --green:#6bbf7b; --green-line:#2d5a35; --green-soft:#9fd0aa;
  --red:#e2603f; --red-bright:#ff7a55; --red-line:#6b3a2a;
  --blue:#67a2d9; --blue-bright:#8fbde8; --violet:#a88ad9; --violet-bright:#c3aae6;
  --scrim:rgba(6,7,8,.72); --shadow-lg:0 24px 70px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f6f2ea; --bg-0:#efe9de; --bg-1:#fffdf9; --bg-2:#f1ece2; --bg-3:#e4dccd;
  --line-soft:#eee7db; --line:#e0d8c8; --line-2:#cec4b0; --line-3:#b9ae98;
  --text:#1f1c17; --text-dim:#6b6459; --text-muted:#8d857a; --text-faint:#a89f92;
  --amber:#d1841c; --amber-bright:#a8630f; --amber-dim:#fbeed6; --amber-line:#e0bc7e; --amber-deep:#8a5210;
  --on-amber:#fffdf9;
  --green:#3f8a4f; --green-line:#a9cfb1; --green-soft:#2f6b3c;
  --red:#c2452a; --red-bright:#a33418; --red-line:#e6b8a6;
  --blue:#3d7cb8; --blue-bright:#2c5f91; --violet:#7d5fb0; --violet-bright:#5f4490;
  --scrim:rgba(60,52,40,.42); --shadow-lg:0 24px 70px rgba(90,75,50,.22);
}
@font-face{font-family:'Inter';src:url('/app/fonts/inter-latin-100-900.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/app/fonts/jetbrains-mono-latin-100-800.woff2') format('woff2');font-weight:100 800;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left;transition:transform .09s cubic-bezier(.2,.8,.3,1),background .12s,border-color .12s,color .12s}
button:active:not(:disabled){transform:scale(.975)}
input{font-family:inherit}
::selection{background:var(--amber);color:#000}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@keyframes kfade{from{opacity:0}to{opacity:1}}
@keyframes kmodal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes kpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes kshake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}36%{transform:translateX(6px)}54%{transform:translateX(-4px)}72%{transform:translateX(3px)}}
@keyframes kspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#root{height:100%;animation:kfade .25s ease-out}

/* ── Lock screen ─────────────────────────────────────────────────────────── */
.lock{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 50% -10%,var(--bg-2),var(--bg))}
.lock-card{width:100%;max-width:440px;background:var(--bg-1);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .3s cubic-bezier(.2,.8,.3,1)}
.lock-head{padding:22px 22px 16px;border-bottom:1px solid var(--line-soft);text-align:center}
.lock-mark{width:44px;height:44px;border-radius:12px;background:var(--amber);color:var(--on-amber);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 10px}
.lock-title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.lock-sub{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;margin-top:4px;font-weight:700}
.lock-body{padding:16px 18px 20px;max-height:min(62vh,520px);overflow-y:auto}
.staff-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg-2);margin-bottom:8px}
.staff-row:hover{border-color:var(--line-3);background:var(--bg-3)}
.staff-row[disabled]{opacity:.42;cursor:not-allowed}
.avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff}
.staff-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.staff-role{font-size:11px;color:var(--text-dim);margin-top:2px}
.pin-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--amber-bright);
  background:var(--amber-dim);border:1px solid var(--amber-line);border-radius:8px;padding:5px 9px;flex-shrink:0}
.who{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:14px}
.not-you{margin-left:auto;font-size:11px;color:var(--text-dim);padding:7px 11px;border-radius:8px;border:1px solid var(--line)}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 16px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--bg-3);border:1px solid var(--line-2);transition:background .12s,transform .12s}
.dot.on{background:var(--amber);border-color:var(--amber);transform:scale(1.08)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{aspect-ratio:1.55;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);
  font-size:21px;font-weight:700;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;color:var(--text)}
.key:hover{background:var(--bg-3);border-color:var(--line-3)}
.key.wide{font-size:15px}
.shake{animation:kshake .4s}
.lock-hint{font-size:10.5px;color:var(--text-faint);line-height:1.6;margin-top:14px;text-align:center}

/* ── Shell ───────────────────────────────────────────────────────────────── */
.shell{height:100%;display:flex}
.side{width:236px;flex-shrink:0;background:var(--bg-0);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--amber);color:var(--on-amber);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.brand-name{font-size:13.5px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:8.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav-grp{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:1px}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.active{background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0}
.ident{border-top:1px solid var(--line-soft);padding:10px}
.ident-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:10px;border:1px solid transparent}
.ident-btn:hover{background:var(--bg-2);border-color:var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bg-0)}
.crumb{font-size:15px;font-weight:800;letter-spacing:-.02em}
.crumb-sub{font-size:11px;color:var(--text-dim);margin-top:1px}
.clock{margin-left:auto;text-align:right}
.clock-t{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.1}
.clock-d{font-size:9.5px;color:var(--text-dim)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);background:var(--bg-1)}
.iconbtn:hover{color:var(--text);border-color:var(--line-3)}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── Floor plan (POS) ────────────────────────────────────────────────────── */
.floor-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.floor-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.floor-legend{display:flex;gap:16px;margin:10px 0 18px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.floor-legend span{display:inline-flex;align-items:center;gap:6px}
.leg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.table{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--bg-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden}
.table:hover{border-color:var(--line-3)}
.table .tn{font-size:19px;font-weight:800;font-family:'JetBrains Mono',monospace}
.table .ts{font-size:10px;color:var(--text-dim)}
.table.occupied{border-color:var(--amber-line);background:var(--amber-dim)}
.table.occupied .tn{color:var(--amber-bright)}
.table.reserved{border-color:var(--blue)}
.table.reserved .tn{color:var(--blue-bright)}
.corner{position:absolute;top:0;left:0;width:100%;height:3px}

/* ── Order screen (till) ─────────────────────────────────────────────────── */
.order{display:grid;grid-template-columns:1fr 340px;gap:16px;height:100%}
.order-main{min-width:0;display:flex;flex-direction:column;min-height:0}
.ord-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-dim);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-1);margin-bottom:12px;align-self:flex-start}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cat{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg-1);color:var(--text-dim)}
.cat.active{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;align-content:start;padding-right:4px;flex:1;min-height:0}
.item{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;gap:8px;min-height:86px}
.item:hover{border-color:var(--amber-line);background:var(--bg-2)}
.item-n{font-size:12.5px;font-weight:700;line-height:1.3;flex:1}
.item-b{display:flex;align-items:center;justify-content:space-between}
.item-p{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--amber-bright)}
.veg{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--green);position:relative}
.veg::after{content:"";position:absolute;inset:2.5px;border-radius:1px;background:var(--green)}
/* Ticket panel */
.ticket{background:var(--bg-0);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.tk-head{padding:13px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.tk-t{font-size:14px;font-weight:800;letter-spacing:-.01em}
.tk-s{font-size:10.5px;color:var(--text-dim);margin-top:2px}
.tk-lines{flex:1;overflow-y:auto;padding:8px 12px;min-height:60px}
.tk-empty{padding:40px 16px;text-align:center;color:var(--text-faint);font-size:12px;line-height:1.6}
.tk-line{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bg-2);animation:kpop .18s}
.tk-ln{flex:1;min-width:0}.tk-ln-n{font-size:12px;font-weight:600;line-height:1.3}
.tk-ln-p{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.step{display:flex;align-items:center;gap:2px;flex-shrink:0}
.step button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text)}
.step button:hover{border-color:var(--line-3)}
.step .q{min-width:22px;text-align:center;font-size:12.5px;font-weight:800;font-family:'JetBrains Mono',monospace}
.tk-lv{width:58px;text-align:right;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.tk-tot{padding:12px 15px;border-top:1px solid var(--line)}
.tk-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);padding:2.5px 0}
.tk-row.grand{font-size:15px;font-weight:800;color:var(--text);padding-top:8px;margin-top:4px;border-top:1px solid var(--line-2)}
.tk-row .v{font-family:'JetBrains Mono',monospace}
.tk-actions{display:flex;gap:8px;padding:12px 15px 14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:12.5px;font-weight:800;text-align:center;border:1px solid var(--line)}
.btn.ghost{background:var(--bg-1);color:var(--text-dim)}.btn.ghost:hover{color:var(--text);border-color:var(--line-3)}
.btn.pay{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.btn.pay[disabled]{opacity:.4;cursor:not-allowed}

/* ── Pay modal ───────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;animation:kfade .16s}
.pay{width:100%;max-width:400px;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .24s cubic-bezier(.2,.8,.3,1)}
.pay-head{padding:15px 17px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.pay-body{padding:15px 17px}
.tenders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tender{padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);text-align:center;font-size:12px;font-weight:700;color:var(--text-dim)}
.tender.active{background:var(--amber-dim);border-color:var(--amber-line);color:var(--amber-bright)}
.tendered{display:flex;justify-content:space-between;align-items:baseline;padding:10px 13px;background:var(--bg);border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
.tendered .l{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.tendered .n{font-size:21px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--amber-bright)}
.change{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:4px 2px 12px;color:var(--green)}
.confirm{width:100%;padding:13px;border-radius:11px;background:var(--amber);color:var(--on-amber);font-size:13px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.confirm[disabled]{opacity:.4;cursor:not-allowed}
.receipt{text-align:center;padding:8px 4px}
.rcheck{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:6px auto 12px;animation:kpop .3s}

/* ── KDS (kitchen display) ───────────────────────────────────────────────── */
.kds-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.kt{background:var(--bg-1);border:1px solid var(--line);border-radius:13px;overflow:hidden;animation:kpop .2s}
.kt.urgent{border-color:var(--red-line)}
.kt-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}
.kt.urgent .kt-head{background:rgba(226,96,63,.08)}
.kt-tn{font-size:15px;font-weight:800;letter-spacing:-.02em;font-family:'JetBrains Mono',monospace}
.kt-meta{font-size:10px;color:var(--text-dim);margin-top:2px}
.kt-timer{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;padding:4px 9px;border-radius:8px;
  background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line)}
.kt.urgent .kt-timer{background:rgba(226,96,63,.15);color:var(--red-bright);border-color:var(--red-line);animation:kpulse 1.6s infinite}
@keyframes kpulse{0%,100%{opacity:1}50%{opacity:.55}}
.kt-lines{padding:5px 0}
.kt-line{display:flex;align-items:center;gap:10px;width:100%;padding:8px 13px}
.kt-line:hover{background:var(--bg-2)}
.kt-q{min-width:26px;height:26px;border-radius:7px;background:var(--bg-3);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.kt-n{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.3}
.kt-line.done .kt-n{text-decoration:line-through;color:var(--text-faint)}
.kt-line.done .kt-q{background:var(--green-line);border-color:var(--green-line);color:var(--green-soft)}
.kt-ck{width:18px;flex-shrink:0;text-align:center;color:var(--green);font-weight:800;opacity:0}
.kt-line.done .kt-ck{opacity:1}
.kt-serve{width:100%;padding:11px;font-size:12px;font-weight:800;text-align:center;border-top:1px solid var(--line);color:var(--text-dim)}
.kt-serve.ready{background:var(--green);color:#fff;border-color:var(--green)}
.kt-serve:hover{color:var(--text)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:800;font-family:'JetBrains Mono',monospace;background:var(--amber);color:var(--on-amber);border-radius:10px;padding:1px 7px;min-width:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:var(--bg-3);color:var(--text);border:1px solid var(--line-3);border-radius:11px;padding:11px 18px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-lg);animation:kpop .2s;display:none}

/* ── Customers & credit ──────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:2px 0 18px}
.stat{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat-l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.stat-v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:5px;font-family:'JetBrains Mono',monospace}
.stat-s{font-size:10.5px;color:var(--text-dim);margin-top:2px}
.ctable{background:var(--bg-1);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr 96px 108px 150px;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.crow.head{background:var(--bg-0);font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;cursor:default}
.crow:not(.head):hover{background:var(--bg-2)}
.crow:last-child{border-bottom:none}
.cwho{display:flex;align-items:center;gap:11px;min-width:0}
.cname{font-size:13px;font-weight:700;letter-spacing:-.01em}
.cph{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.tier{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px;color:#fff}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700}
.dim{color:var(--text-dim)}
.cbar{height:6px;border-radius:4px;background:var(--bg-3);overflow:hidden;margin-top:5px}
.cbar>span{display:block;height:100%;background:var(--amber)}
.cbar.full>span{background:var(--red)}
.cavail{font-size:10px;color:var(--text-dim);margin-top:3px}
/* detail modal */
.det{width:100%;max-width:440px;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .24s cubic-bezier(.2,.8,.3,1);max-height:88vh;display:flex;flex-direction:column}
.det-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
.det-body{padding:14px 18px 18px;overflow-y:auto}
.drow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--bg-2);font-size:12.5px}
.drow .dl{color:var(--text-dim)}.drow .dv{font-weight:700;font-family:'JetBrains Mono',monospace}
.sect{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin:16px 0 8px}
.led{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.led-row{display:grid;grid-template-columns:1fr 74px 82px;gap:8px;padding:8px 12px;font-size:11.5px;border-bottom:1px solid var(--bg-2)}
.led-row.head{background:var(--bg-0);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);font-weight:800}
.led-row:last-child{border-bottom:none}
.led-row .n{min-width:0}.led-row .a{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700}
.led-row .deb{color:var(--red-bright)}.led-row .cr{color:var(--green-soft)}
.led-row.bal{background:var(--bg-0);font-weight:800}
.det-note{margin-top:14px;font-size:11.5px;color:var(--text-dim);line-height:1.6;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:9px}

/* ── Orders & receipts ───────────────────────────────────────────────────── */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 16px}
.tab{font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg-1);color:var(--text-dim)}
.tab.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.orow{display:grid;grid-template-columns:120px 54px 60px 110px 1fr 90px 96px 78px;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;font-size:12px}
.orow.head{background:var(--bg-0);font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800;cursor:default}
.orow:not(.head):hover{background:var(--bg-2)}
.orow:last-child{border-bottom:none}
.ono{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px}
.chan{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chan.dine_in{background:rgba(103,162,217,.14);color:var(--blue-bright);border:1px solid var(--blue)}
.chan.qr{background:rgba(168,138,217,.14);color:var(--violet-bright);border:1px solid var(--violet)}
.chan.takeaway{background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line)}
.chan.delivery{background:rgba(107,191,123,.12);color:var(--green-soft);border:1px solid var(--green-line)}
.ost{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:6px}
.ost.closed{background:rgba(107,191,123,.10);color:var(--green-soft);border:1px solid var(--green-line)}
.ost.open{background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line)}
.ost.refunded{background:rgba(226,96,63,.10);color:var(--red-bright);border:1px solid var(--red-line)}
.oright{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700}
/* receipt */
.rcp{width:100%;max-width:380px;background:var(--paper,#fdfbf6);color:#1a1a1a;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .22s;max-height:88vh;display:flex;flex-direction:column;font-family:'JetBrains Mono',monospace}
.rcp-b{padding:20px 22px;overflow-y:auto}
.rcp-c{text-align:center;margin-bottom:14px}
.rcp-name{font-family:'Inter',sans-serif;font-size:16px;font-weight:800}
.rcp-meta{font-size:10.5px;color:#666;margin-top:3px;line-height:1.5}
.rcp-div{border-top:1px dashed #bbb;margin:12px 0}
.rcp-line{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0}
.rcp-line .q{color:#888;margin-right:6px}
.rcp-tot{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0;color:#333}
.rcp-tot.grand{font-weight:800;font-size:13.5px;border-top:1px solid #999;margin-top:6px;padding-top:6px;color:#1a1a1a}
.rcp-foot{text-align:center;font-size:10px;color:#777;margin-top:14px;line-height:1.6;font-family:'Inter',sans-serif}
.rcp-actions{display:flex;gap:8px;padding:12px 16px;background:var(--bg-1);border-top:1px solid var(--line)}
.rcp-refunded{text-align:center;font-family:'Inter',sans-serif;font-size:11px;font-weight:800;color:#c2452a;border:1.5px solid #c2452a;border-radius:8px;padding:6px;margin-top:10px;letter-spacing:.1em}

/* ── Generic module placeholder (views built in later increments) ────────── */
.mod{max-width:760px}
.mod-blurb{font-size:13px;color:var(--text-dim);line-height:1.7;margin:8px 0 18px;max-width:560px}
.mod-note{border:1px dashed var(--line-2);border-radius:12px;padding:18px 20px;background:var(--bg-1);
  font-size:12.5px;color:var(--text-muted);line-height:1.7}
.pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 8px;border-radius:20px;background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line);margin-left:8px;vertical-align:middle}

@media (max-width:1024px){ .side{width:64px} .brand-name,.brand-sub,.nav-item span:not(.nav-dot),.nav-grp,.ident-btn .idtext{display:none}

function dayLedger(out){

  var closed = orders.filter(function(o){ return o.status==="closed" && !S.refunded[o.no]; });
  var acc = {}; function add(c,dr,cr){ if(!acc[c]) acc[c]={dr:0,cr:0}; acc[c].dr+=dr; acc[c].cr+=cr; }
  var byTender={cash:0,card:0,wallet:0,credit:0}, gross=0,net=0,svc=0,gst=0, entries=[];
  closed.forEach(function(o){
    var T = totals(o.lines,out), ta = TENDER_ACC[o.tender];
    add(ta,T.total,0); add("4000",0,T.sub); add("2300",0,T.svc); add("2200",0,T.tax);
    byTender[o.tender]+=T.total; gross+=T.total; net+=T.sub; svc+=T.svc; gst+=T.tax;
    entries.push({no:o.no,tender:o.tender,ta:ta,sub:T.sub,svc:T.svc,tax:T.tax,total:T.total});
  });
  var totDr=0,totCr=0; Object.keys(acc).forEach(function(c){ totDr+=acc[c].dr; totCr+=acc[c].cr; });
  return { closed:closed, acc:acc, byTender:byTender, gross:gross, net:net, svc:svc, gst:gst, entries:entries, totDr:totDr, totCr:totCr };
}
function genOrders(out){
  var r = rng(4242 + out.id);
  var chans = ["dine_in","dine_in","dine_in","qr","takeaway","delivery"];
  var servers = ["Ismail Nabeeh","Shifa Adam","Hassan Shifau"];
  var tenders = ["cash","card","wallet","credit"];
  var list = [];
  for(var i=0;i<28;i++){
    var ch = chans[Math.floor(r()*chans.length)];
    var nl = 2 + Math.floor(r()*3), lines = [];
    for(var j=0;j<nl;j++){ var m = MENU[Math.floor(r()*MENU.length)]; lines.push({ name:m.name, price:m.price, qty:1+Math.floor(r()*2) }); }
    list.push({
      no:"KO-"+out.code.split("-")[1]+"-"+(2418+i),
      table:(ch==="dine_in"||ch==="qr") ? "T"+pad2(1+Math.floor(r()*(out.tables||10))) : "—",
      channel:ch, lines:lines, total:totals(lines,out).total,
      tender:tenders[Math.floor(r()*tenders.length)],
      status:r()>0.14 ? "closed":"open",
      server:servers[Math.floor(r()*servers.length)],
      time:pad2(11+Math.floor(r()*11))+":"+pad2(Math.floor(r()*60))
    });
  }
  return list.sort(function(a,b){ return a.time<b.time?1:-1; });
}

  if(d.fire){ fireToKitchen(); render(); return; }
  if(d.kbump){ var parts = d.kbump.split(":"); var tk = S.kds.filter(function(k){return k.id===parts[0];})[0];
    if(tk && tk.lines[+parts[1]]){ var ln2 = tk.lines[+parts[1]]; ln2.done = !ln2.done; render(); } return; }
  if(d.kserve){ S.kds = S.kds.filter(function(k){ return k.id !== d.kserve; }); render(); return; }
  // ── Customers ──
  if(d.cust){ S.cust = d.cust; render(); return; }
  if(d.custclose){ S.cust = null; render(); return; }
  // ── Orders ──
  if(d.ordtab){ S.ordTab = Number(d.ordtab); render(); return; }
  if(d.order){ S.order = d.order; render(); return; }
  if(d.ordclose){ S.order = null; render(); return; }
  if(d.refund){ S.refunded[d.refund] = true; render(); return; }
  // ── Inventory / Menu ──
  if(d.invtab){ S.invTab = Number(d.invtab); render(); return; }
  if(d.menutab){ S.menuTab = Number(d.menutab); render(); return; }
  // ── Reports export ──
  if(d.export){ toast(d.export==="gst" ? "GST return exported — kashikeyo-gst-return.csv" : "Z-report exported — kashikeyo-z-report.csv"); return; }
});
var toastTimer = 0;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block"; t.style.animation = "none"; void t.offsetWidth; t.style.animation = "kpop .2s";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = "none"; }, 2600);
}

/* ── Real sync. The till writes each settled sale to the SAME backend the
   shipped /app uses: a durable localStorage outbox flushed to /api/ops with a
   stable opId (so a retry can never double-post), against a demo workspace this
   browser provisions once via /api/register. This is the actual offline-first
   transaction path, not a mock — sales appear in /api/pull and the real /app. */
var SYNC = {
  token: localStorage.getItem("kv2-token"),
  slug: localStorage.getItem("kv2-slug"),
  outbox: JSON.parse(localStorage.getItem("kv2-outbox") || "[]"),
  rowver: 0, state: "local", busy: false   // local | syncing | synced | offline
};
function syncPersist(){ localStorage.setItem("kv2-outbox", JSON.stringify(SYNC.outbox)); }
function syncChip(){
  var el = document.getElementById("syncchip"); if(!el) return;
  var n = SYNC.outbox.length;
  var map = {
    local:   ["○","var(--text-muted)","Local"],
    syncing: ["◍","var(--amber-bright)","Syncing"+(n?" · "+n:"")],
    synced:  ["●","var(--green-soft)","Synced"+(SYNC.rowver?" · r"+SYNC.rowver:"")],
    offline: ["●","var(--red-bright)", (navigator.onLine?"Queued":"Offline")+(n?" · "+n:"")]
  };
  var m = map[SYNC.state] || map.local;
  el.innerHTML = '<span style="color:'+m[1]+';font-size:9px">'+m[0]+'</span> '+esc(m[2]);
  el.title = "Real /api/ops sync · "+n+" queued"+(SYNC.slug?" · workspace "+SYNC.slug:"");
}
async function ensureStore(){
  if(SYNC.token) return true;
  var rnd = Math.random().toString(36).slice(2,9);
  var r = await fetch("/api/register",{ method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ email:"v2-"+rnd+"@demo.kashikeyo.mv", password:"v2demo-"+rnd, storeName:"KashikeyoPOS v2 demo", currency:"MVR", pin:"1234" }) });
  if(!r.ok) return false;
  var j = await r.json(); SYNC.token=j.token; SYNC.slug=j.slug;
  localStorage.setItem("kv2-token",j.token); localStorage.setItem("kv2-slug",j.slug);
  // Seed the catalogue so each sale validates against real product prices (laari).
  SYNC.outbox.unshift({ opId:"seed-products-"+j.slug, puts: MENU.map(function(m){ return {kind:"products",id:m.id,data:{id:m.id,name:m.name,price:Math.round(m.price*100)}}; }) });
  syncPersist();
  return true;
}
async function flush(){
  if(SYNC.busy) return;
  if(!SYNC.outbox.length){ SYNC.state = SYNC.token ? "synced" : "local"; syncChip(); return; }
  if(!navigator.onLine){ SYNC.state="offline"; syncChip(); return; }
  SYNC.busy = true; SYNC.state="syncing"; syncChip();
  try{
    if(!(await ensureStore())){ SYNC.state="offline"; return; }
    var batch = SYNC.outbox.slice(0,50);
    var r = await fetch("/api/ops",{ method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+SYNC.token}, body:JSON.stringify({ops:batch}) });
    if(r.status===401){ localStorage.removeItem("kv2-token"); SYNC.token=null; SYNC.state="offline"; return; }
    if(!r.ok){ SYNC.state="offline"; return; }
    var j = await r.json(); SYNC.rowver = j.rowver || SYNC.rowver;
    SYNC.outbox = SYNC.outbox.slice(batch.length); syncPersist();
    SYNC.state = SYNC.outbox.length ? "syncing" : "synced";
  }catch(e){ SYNC.state="offline"; }
  finally{ SYNC.busy=false; syncChip(); if(SYNC.outbox.length && navigator.onLine) setTimeout(flush,400); }
}
function enqueueSale(sale){
  SYNC.outbox.push({ opId:"v2-"+sale.id, puts:[{kind:"sales",id:sale.id,data:sale}] });
  syncPersist(); syncChip(); flush();
}
window.addEventListener("online", function(){ flush(); });
window.addEventListener("offline", function(){ SYNC.state="offline"; syncChip(); });
setInterval(function(){ if(SYNC.outbox.length) flush(); }, 8000);  // safety-net poll, like the shipped till
document.addEventListener("keydown", function(e){
  if(!S.picking) return;
  if(/^[0-9]$/.test(e.key)){ if(S.entry.length<4){ S.entry+=e.key; render(); tryPin(); } }
  else if(e.key==="Backspace"){ S.entry=S.entry.slice(0,-1); render(); }
  else if(e.key==="Escape"){ S.picking=null; S.entry=""; render(); }
});
render();
syncChip();
if(SYNC.outbox.length) flush();   // resume any queued sales from a previous session
</script>
