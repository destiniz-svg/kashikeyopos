<title>KashikeyoPOS — Terminal (v2 build)</title>
<style>
/* ── Design tokens: verbatim from the handoff prototype (KashikeyoPOS.dc.html).
      Dark by default; [data-theme="light"] is the daylight variant. ───────── */
:root{
  --bg:#0e0f11; --bg-0:#121417; --bg-1:#15171a; --bg-2:#1b1e22; --bg-3:#24282e;
  --line-soft:#22262b; --line:#2a2f36; --line-2:#363c44; --line-3:#3d4249;
  --text:#f2ede2; --text-dim:#a8a79f; --text-muted:#6b6e74; --text-faint:#585b61;
  --amber:#f2a43a; --amber-bright:#ffb84a; --amber-dim:#3a2a12; --amber-line:#6b4a1f; --amber-deep:#c4761e;
  --on-amber:#1a0f00;
  --green:#6bbf7b; --green-line:#2d5a35; --green-soft:#9fd0aa;
  --red:#e2603f; --red-bright:#ff7a55; --red-line:#6b3a2a;
  --blue:#67a2d9; --blue-bright:#8fbde8; --violet:#a88ad9; --violet-bright:#c3aae6;
  --scrim:rgba(6,7,8,.72); --shadow-lg:0 24px 70px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f6f2ea; --bg-0:#efe9de; --bg-1:#fffdf9; --bg-2:#f1ece2; --bg-3:#e4dccd;
  --line-soft:#eee7db; --line:#e0d8c8; --line-2:#cec4b0; --line-3:#b9ae98;
  --text:#1f1c17; --text-dim:#6b6459; --text-muted:#8d857a; --text-faint:#a89f92;
  --amber:#d1841c; --amber-bright:#a8630f; --amber-dim:#fbeed6; --amber-line:#e0bc7e; --amber-deep:#8a5210;
  --on-amber:#fffdf9;
  --green:#3f8a4f; --green-line:#a9cfb1; --green-soft:#2f6b3c;
  --red:#c2452a; --red-bright:#a33418; --red-line:#e6b8a6;
  --blue:#3d7cb8; --blue-bright:#2c5f91; --violet:#7d5fb0; --violet-bright:#5f4490;
  --scrim:rgba(60,52,40,.42); --shadow-lg:0 24px 70px rgba(90,75,50,.22);
}
@font-face{font-family:'Inter';src:url('/app/fonts/inter-latin-100-900.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/app/fonts/jetbrains-mono-latin-100-800.woff2') format('woff2');font-weight:100 800;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left;transition:transform .09s cubic-bezier(.2,.8,.3,1),background .12s,border-color .12s,color .12s}
button:active:not(:disabled){transform:scale(.975)}
input{font-family:inherit}
::selection{background:var(--amber);color:#000}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
@keyframes kfade{from{opacity:0}to{opacity:1}}
@keyframes kmodal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes kpop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes kshake{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px)}36%{transform:translateX(6px)}54%{transform:translateX(-4px)}72%{transform:translateX(3px)}}
@keyframes kspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#root{height:100%;animation:kfade .25s ease-out}

/* ── Lock screen ─────────────────────────────────────────────────────────── */
.lock{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 50% -10%,var(--bg-2),var(--bg))}
.lock-card{width:100%;max-width:440px;background:var(--bg-1);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .3s cubic-bezier(.2,.8,.3,1)}
.lock-head{padding:22px 22px 16px;border-bottom:1px solid var(--line-soft);text-align:center}
.lock-mark{width:44px;height:44px;border-radius:12px;background:var(--amber);color:var(--on-amber);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 10px}
.lock-title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.lock-sub{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;margin-top:4px;font-weight:700}
.lock-body{padding:16px 18px 20px;max-height:min(62vh,520px);overflow-y:auto}
.staff-row{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg-2);margin-bottom:8px}
.staff-row:hover{border-color:var(--line-3);background:var(--bg-3)}
.staff-row[disabled]{opacity:.42;cursor:not-allowed}
.avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff}
.staff-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.staff-role{font-size:11px;color:var(--text-dim);margin-top:2px}
.pin-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--amber-bright);
  background:var(--amber-dim);border:1px solid var(--amber-line);border-radius:8px;padding:5px 9px;flex-shrink:0}
.who{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:14px}
.not-you{margin-left:auto;font-size:11px;color:var(--text-dim);padding:7px 11px;border-radius:8px;border:1px solid var(--line)}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 16px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--bg-3);border:1px solid var(--line-2);transition:background .12s,transform .12s}
.dot.on{background:var(--amber);border-color:var(--amber);transform:scale(1.08)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{aspect-ratio:1.55;border-radius:12px;background:var(--bg-2);border:1px solid var(--line);
  font-size:21px;font-weight:700;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;color:var(--text)}
.key:hover{background:var(--bg-3);border-color:var(--line-3)}
.key.wide{font-size:15px}
.shake{animation:kshake .4s}
.lock-hint{font-size:10.5px;color:var(--text-faint);line-height:1.6;margin-top:14px;text-align:center}

/* ── Shell ───────────────────────────────────────────────────────────────── */
.shell{height:100%;display:flex}
.side{width:236px;flex-shrink:0;background:var(--bg-0);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--amber);color:var(--on-amber);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.brand-name{font-size:13.5px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-size:8.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav-grp{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:1px}
.nav-item:hover{background:var(--bg-2);color:var(--text)}
.nav-item.active{background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line)}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex-shrink:0}
.ident{border-top:1px solid var(--line-soft);padding:10px}
.ident-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:10px;border:1px solid transparent}
.ident-btn:hover{background:var(--bg-2);border-color:var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:54px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--bg-0)}
.crumb{font-size:15px;font-weight:800;letter-spacing:-.02em}
.crumb-sub{font-size:11px;color:var(--text-dim);margin-top:1px}
.clock{margin-left:auto;text-align:right}
.clock-t{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1.1}
.clock-d{font-size:9.5px;color:var(--text-dim)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim);background:var(--bg-1)}
.iconbtn:hover{color:var(--text);border-color:var(--line-3)}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── Floor plan (POS) ────────────────────────────────────────────────────── */
.floor-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.floor-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.floor-legend{display:flex;gap:16px;margin:10px 0 18px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.floor-legend span{display:inline-flex;align-items:center;gap:6px}
.leg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.table{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--bg-1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;overflow:hidden}
.table:hover{border-color:var(--line-3)}
.table .tn{font-size:19px;font-weight:800;font-family:'JetBrains Mono',monospace}
.table .ts{font-size:10px;color:var(--text-dim)}
.table.occupied{border-color:var(--amber-line);background:var(--amber-dim)}
.table.occupied .tn{color:var(--amber-bright)}
.table.reserved{border-color:var(--blue)}
.table.reserved .tn{color:var(--blue-bright)}
.corner{position:absolute;top:0;left:0;width:100%;height:3px}

/* ── Order screen (till) ─────────────────────────────────────────────────── */
.order{display:grid;grid-template-columns:1fr 340px;gap:16px;height:100%}
.order-main{min-width:0;display:flex;flex-direction:column;min-height:0}
.ord-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text-dim);padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-1);margin-bottom:12px;align-self:flex-start}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cat{font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg-1);color:var(--text-dim)}
.cat.active{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto;align-content:start;padding-right:4px;flex:1;min-height:0}
.item{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;gap:8px;min-height:86px}
.item:hover{border-color:var(--amber-line);background:var(--bg-2)}
.item-n{font-size:12.5px;font-weight:700;line-height:1.3;flex:1}
.item-b{display:flex;align-items:center;justify-content:space-between}
.item-p{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--amber-bright)}
.veg{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--green);position:relative}
.veg::after{content:"";position:absolute;inset:2.5px;border-radius:1px;background:var(--green)}
/* Ticket panel */
.ticket{background:var(--bg-0);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.tk-head{padding:13px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.tk-t{font-size:14px;font-weight:800;letter-spacing:-.01em}
.tk-s{font-size:10.5px;color:var(--text-dim);margin-top:2px}
.tk-lines{flex:1;overflow-y:auto;padding:8px 12px;min-height:60px}
.tk-empty{padding:40px 16px;text-align:center;color:var(--text-faint);font-size:12px;line-height:1.6}
.tk-line{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--bg-2);animation:kpop .18s}
.tk-ln{flex:1;min-width:0}.tk-ln-n{font-size:12px;font-weight:600;line-height:1.3}
.tk-ln-p{font-size:10.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.step{display:flex;align-items:center;gap:2px;flex-shrink:0}
.step button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text)}
.step button:hover{border-color:var(--line-3)}
.step .q{min-width:22px;text-align:center;font-size:12.5px;font-weight:800;font-family:'JetBrains Mono',monospace}
.tk-lv{width:58px;text-align:right;font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.tk-tot{padding:12px 15px;border-top:1px solid var(--line)}
.tk-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-dim);padding:2.5px 0}
.tk-row.grand{font-size:15px;font-weight:800;color:var(--text);padding-top:8px;margin-top:4px;border-top:1px solid var(--line-2)}
.tk-row .v{font-family:'JetBrains Mono',monospace}
.tk-actions{display:flex;gap:8px;padding:12px 15px 14px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:12.5px;font-weight:800;text-align:center;border:1px solid var(--line)}
.btn.ghost{background:var(--bg-1);color:var(--text-dim)}.btn.ghost:hover{color:var(--text);border-color:var(--line-3)}
.btn.pay{background:var(--amber);color:var(--on-amber);border-color:var(--amber)}
.btn.pay[disabled]{opacity:.4;cursor:not-allowed}

/* ── Pay modal ───────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;animation:kfade .16s}
.pay{width:100%;max-width:400px;background:var(--bg-1);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:kmodal .24s cubic-bezier(.2,.8,.3,1)}
.pay-head{padding:15px 17px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.pay-body{padding:15px 17px}
.tenders{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tender{padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);text-align:center;font-size:12px;font-weight:700;color:var(--text-dim)}
.tender.active{background:var(--amber-dim);border-color:var(--amber-line);color:var(--amber-bright)}
.tendered{display:flex;justify-content:space-between;align-items:baseline;padding:10px 13px;background:var(--bg);border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
.tendered .l{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.tendered .n{font-size:21px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--amber-bright)}
.change{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:4px 2px 12px;color:var(--green)}
.confirm{width:100%;padding:13px;border-radius:11px;background:var(--amber);color:var(--on-amber);font-size:13px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.confirm[disabled]{opacity:.4;cursor:not-allowed}
.receipt{text-align:center;padding:8px 4px}
.rcheck{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin:6px auto 12px;animation:kpop .3s}

/* ── Generic module placeholder (views built in later increments) ────────── */
.mod{max-width:760px}
.mod-blurb{font-size:13px;color:var(--text-dim);line-height:1.7;margin:8px 0 18px;max-width:560px}
.mod-note{border:1px dashed var(--line-2);border-radius:12px;padding:18px 20px;background:var(--bg-1);
  font-size:12.5px;color:var(--text-muted);line-height:1.7}
.pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 8px;border-radius:20px;background:var(--amber-dim);color:var(--amber-bright);border:1px solid var(--amber-line);margin-left:8px;vertical-align:middle}

/* ── Responsive: tablet icon rail, phone drawer ──────────────────────────── */
@media (max-width:1024px){ .side{width:64px} .brand-name,.brand-sub,.nav-item span:not(.nav-dot),.nav-grp,.ident-btn .idtext{display:none}
  .nav-item{justify-content:center;padding:11px 0} .ident-btn{justify-content:center} }
@media (max-width:720px){ .side{display:none} .content{padding:14px} .topbar{padding:0 14px} }
.mobibar{display:none}
@media (max-width:720px){ .mobibar{display:flex} }
</style>

function cart(){ if(!S.carts[S.table]) S.carts[S.table] = []; return S.carts[S.table]; }
function money(n){ return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Bill math, identical to totals() in the reference prototype: menu price is the
   pre-tax base; service charge on goods; GST on (goods + service). */
function totals(lines, out){
  var sub = lines.reduce(function(a,l){ return a + l.price*l.qty; }, 0);
  var svc = sub * ((out.sc||0)/100);
  var tax = (sub + svc) * ((out.rate||0)/100);
  return { sub: sub, svc: svc, tax: tax, total: sub + svc + tax };
}

function floorView(out){
  var n = out.tables || 12;
  var h = '<div class="floor-head"><div class="floor-title">Floor plan</div>'
        + '<div class="crumb-sub">'+n+' tables · tap a table to open its ticket</div></div>';
  h += '<div class="floor-legend">'
     + '<span><span class="leg-dot" style="background:var(--line-3)"></span>Available</span>'
     + '<span><span class="leg-dot" style="background:var(--amber)"></span>Occupied</span>'
     + '<span><span class="leg-dot" style="background:var(--blue)"></span>Reserved</span></div>';
  h += '<div class="tables">';
  for(var i=1;i<=n;i++){
    // A table with items in its cart reads as occupied; the rest are seeded so
    // the floor looks like a live service.
    var has = (S.carts[i] && S.carts[i].length);
    var mod = (i*7 + out.id) % 10;
    var st = has ? "occupied" : (mod < 4 ? "occupied" : (mod === 4 ? "reserved" : ""));
    var seats = [2,2,4,4,4,6,2,4][i%8];
    var sub = has ? (S.carts[i].reduce(function(a,l){return a+l.qty;},0)+" items") : (st==="occupied" ? "seated" : (st==="reserved" ? "held" : seats+" seats"));
    h += '<button class="table '+st+'" data-table="'+i+'"><span class="tn">'+i+'</span><span class="ts">'+sub+'</span></button>';
  }
  h += '</div>';
  return h;
}

function payModal(T, out){
  var p = S.pay;
  var tend = p.method==="Cash" ? (parseFloat(p.tendered)||0) : T.total;
  var change = Math.max(0, tend - T.total);
  var enough = p.method!=="Cash" || tend >= T.total;
  if(p.done){
    return '<div class="scrim"><div class="pay"><div class="pay-body"><div class="receipt">'
      + '<div class="rcheck">✓</div>'
      + '<div style="font-size:15px;font-weight:800">Paid · MVR '+money(T.total)+'</div>'
      + '<div style="font-size:12px;color:var(--text-dim);margin-top:4px">Table '+S.table+' · '+esc(p.method)+(p.method==="Cash"?' · change '+money(change):'')+'</div>'
      + '<div style="font-size:11px;color:var(--text-muted);margin-top:10px;line-height:1.6">Receipt queued. In production this posts a sale to the sync outbox and prints/queues the receipt.</div>'
      + '<button class="confirm" data-newbill="1" style="margin-top:16px">New order on Table '+S.table+'</button>'
      + '<button class="btn ghost" data-floor2="1" style="margin-top:8px;width:100%">Back to floor</button>'
      + '</div></div></div></div>';
  }
  var h = '<div class="scrim" data-scrim="1"><div class="pay">';
  h += '<div class="pay-head"><div><div class="tk-t">Take payment</div><div class="tk-s">Table '+S.table+' · MVR '+money(T.total)+'</div></div>'
     + '<button class="iconbtn" data-paycancel="1">×</button></div>';
  h += '<div class="pay-body">';
  h += '<div class="tenders">';
  ["Cash","Card","Transfer"].forEach(function(m){ h += '<button class="tender'+(p.method===m?' active':'')+'" data-tender="'+m+'">'+m+'</button>'; });
  h += '</div>';
  if(p.method==="Cash"){
    h += '<div class="tendered"><span class="l">Tendered</span><span class="n">'+money(tend)+'</span></div>';
    h += '<div class="keypad" style="grid-template-columns:repeat(3,1fr)">';
    ["1","2","3","4","5","6","7","8","9"].forEach(function(d){ h += '<button class="key" data-cash="'+d+'">'+d+'</button>'; });
    h += '<button class="key wide" data-cashclr="1">C</button><button class="key" data-cash="0">0</button><button class="key wide" data-cash="00">00</button>';
    h += '</div>';
    h += '<div class="change"><span>Change due</span><span style="font-family:\'JetBrains Mono\',monospace">'+money(change)+'</span></div>';
  } else {
    h += '<div style="padding:14px 2px 16px;font-size:12px;color:var(--text-dim);line-height:1.6">'+esc(p.method)+' payment for the full MVR '+money(T.total)+'. In production this captures the terminal/transfer reference against the sale.</div>';
  }
  h += '<button class="confirm" data-confirm="1"'+(enough?'':' disabled')+'>Confirm · MVR '+money(T.total)+'</button>';
  h += '</div></div></div>';
  return h;
}

  return '<div class="mod"><div class="floor-title">'+esc(m.label)+'<span class="pill">'+esc(m.group)+'</span></div>'
    + '<div class="mod-blurb">'+esc(BLURB[m.key]||"")+'</div>'
    + '<div class="mod-note">You can reach <b>'+esc(m.label)+'</b> because you are signed in as <b>'+esc((ROLE[u.role]||{}).label||u.role)+'</b>. '
    + 'This module\'s full screen is built in a later increment of the ground-up rebuild — the shell, role-filtered navigation, theme and identity you see here are complete and driven by the design\'s own data.</div></div>';
}
function tickClock(){
  var t = document.getElementById("clk-t"), d = document.getElementById("clk-d");
  if(!t||!d) return;
  var now = new Date();
  t.textContent = now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  d.textContent = now.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
setInterval(function(){ if(S.session) tickClock(); }, 1000*20);

/* ── Render + events ─────────────────────────────────────────────────────── */
function render(){ if(S.session) renderShell(); else renderLock(); }
function tryPin(){
  var u = S.picking;
  if(S.entry.length < 4) return;
  if(S.entry === u.pin){ S.session = u; S.picking = null; S.entry = ""; S.view = "pos"; render(); }
  else { S.shake = true; render(); setTimeout(function(){ S.shake=false; S.entry=""; render(); }, 420); }
}
function findLine(id){ return cart().filter(function(l){return l.id===id;})[0]; }
root.addEventListener("click", function(e){
  // Pay-modal backdrop (a div, not a button) closes the modal.
  if(e.target.dataset && e.target.dataset.scrim){ S.pay=null; render(); return; }
  var el = e.target.closest("button"); if(!el) return;
  var d = el.dataset;
  // ── lock screen ──
  if(d.pick){ S.picking = USERS.filter(function(x){return x.id===d.pick;})[0]; S.entry=""; render(); return; }
  if(d.back){ S.picking = null; S.entry=""; render(); return; }
  if(d.del){ S.entry = S.entry.slice(0,-1); render(); return; }
  if(d.key){ if(S.entry.length<4){ S.entry += d.key; render(); tryPin(); } return; }
  // ── shell ──
  if(d.view){ S.view = d.view; if(S.view!=="pos") S.table=null; render(); return; }
  if(d.signout){ S.session=null; S.picking=null; S.entry=""; S.table=null; render(); return; }
  if(d.themeToggle){ S.theme = S.theme==="dark"?"light":"dark"; localStorage.setItem("kv2-theme",S.theme);
    document.documentElement.setAttribute("data-theme",S.theme); render(); return; }
  // ── POS till ──
  if(d.table){ S.table = Number(d.table); S.cat="starters"; S.pay=null; render(); return; }
  if(d.floor || d.floor2){ S.table = null; S.pay = null; render(); return; }
  if(d.cat){ S.cat = d.cat; render(); return; }
  if(d.add){ var m = MENU.filter(function(x){return x.id===d.add;})[0]; var ln = findLine(d.add);
    if(ln) ln.qty++; else cart().push({ id:m.id, name:m.name, price:m.price, qty:1 }); render(); return; }
  if(d.inc){ var li = findLine(d.inc); if(li){ li.qty++; render(); } return; }
  if(d.dec){ var ld = findLine(d.dec); if(ld){ ld.qty--; if(ld.qty<=0) S.carts[S.table] = cart().filter(function(l){return l.id!==d.dec;}); render(); } return; }
  if(d.hold){ S.table = null; render(); return; }   // holding just parks the ticket (cart persists on the table)
  if(d.pay){ S.pay = { method:"Cash", tendered:"" }; render(); return; }
  if(d.paycancel){ S.pay = null; render(); return; }
  if(d.tender){ S.pay.method = d.tender; render(); return; }
  if(d.cash){ S.pay.tendered = (S.pay.tendered==="0"?"":S.pay.tendered) + d.cash; render(); return; }
  if(d.cashclr){ S.pay.tendered = ""; render(); return; }
  if(d.confirm){ S.pay.done = true; render(); return; }
  if(d.newbill){ S.carts[S.table] = []; S.pay = null; render(); return; }
});
document.addEventListener("keydown", function(e){
  if(!S.picking) return;
  if(/^[0-9]$/.test(e.key)){ if(S.entry.length<4){ S.entry+=e.key; render(); tryPin(); } }
  else if(e.key==="Backspace"){ S.entry=S.entry.slice(0,-1); render(); }
  else if(e.key==="Escape"){ S.picking=null; S.entry=""; render(); }
});
render();
</script>
